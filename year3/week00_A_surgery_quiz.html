<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Year 3 Week 00 A: Surgery quiz</title>
<style>
:root{
  --paper:#EEF4F2; --card:#FFFFFF; --ink:#0F2A33; --soft:#4C666E; --line:#C9D8D4;
  --scrub:#1B7567; --scrub-dark:#125548; --scrub-tint:#DCEEEA;
  --wrong:#B23A30; --wrong-tint:#F7E3E0; --amber:#B7790C;
  --ui:"Avenir Next","Segoe UI",system-ui,-apple-system,Roboto,sans-serif;
  --read:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
}
@media (prefers-color-scheme:dark){
  :root{--paper:#0C1F25;--card:#132E36;--ink:#E6F0EE;--soft:#9DB5B8;--line:#27474F;
  --scrub:#4FB8A5;--scrub-dark:#7FD3C3;--scrub-tint:#17403F;--wrong:#E8867C;--wrong-tint:#42211F;--amber:#E0A93F;}
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--ui);line-height:1.5;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
.wrap{max-width:760px;margin:0 auto;padding:20px 18px 60px}
h1{font-family:var(--read);font-weight:600;font-size:2rem;line-height:1.15;margin:18px 0 6px;letter-spacing:-.01em}
h2{font-size:1.05rem;margin:26px 0 10px}
p.lead{color:var(--soft);margin:0 0 8px;max-width:60ch}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible,label:focus-within{outline:3px solid var(--amber);outline-offset:2px}
.hidden{display:none!important}

/* start screen */
.topic{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);
  border-radius:10px;padding:13px 14px;margin-bottom:8px}
.topic input{width:22px;height:22px;accent-color:var(--scrub);flex:none}
.topic .name{flex:1;font-weight:600}
.topic .meta{color:var(--soft);font-size:.86rem;white-space:nowrap}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--card)}
.seg button{flex:1;border:0;background:none;padding:12px 8px;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--scrub);color:#fff;font-weight:600}
.note{color:var(--soft);font-size:.9rem;margin:8px 0 0}
.primary{display:block;width:100%;margin-top:26px;border:0;border-radius:12px;background:var(--scrub);
  color:#fff;font-weight:700;font-size:1.08rem;padding:16px}
.primary:active{background:var(--scrub-dark)}
.primary:disabled{opacity:.45}
.ghost{background:none;border:1px solid var(--line);border-radius:10px;padding:11px 16px}

/* count strip: one mark per question */
.strip{display:flex;gap:2px;margin:6px 0 18px;height:12px}
.strip i{flex:1;border-radius:2px;background:var(--line);min-width:2px}
.strip i.ok{background:var(--scrub)} .strip i.no{background:var(--wrong)}
.strip i.done{background:var(--soft)} .strip i.now{background:var(--amber);transform:scaleY(1.5)}
.bar{display:flex;justify-content:space-between;align-items:center;gap:12px;color:var(--soft);font-size:.92rem}
.bar strong{color:var(--ink)}
.timer{font-variant-numeric:tabular-nums;font-weight:700;color:var(--ink)}
.timer.low{color:var(--wrong)}

/* question */
.tag{display:inline-block;background:var(--scrub-tint);color:var(--scrub-dark);border-radius:6px;
  padding:3px 9px;font-size:.82rem;font-weight:600}
.stem{font-family:var(--read);font-size:1.28rem;line-height:1.5;margin:14px 0 18px;max-width:62ch}
.opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;background:var(--card);
  border:1.5px solid var(--line);border-radius:12px;padding:14px;margin-bottom:10px;min-height:54px}
.opt .k{flex:none;width:28px;height:28px;border-radius:50%;border:1.5px solid var(--line);
  display:grid;place-items:center;font-weight:700;font-size:.88rem;color:var(--soft)}
.opt.sel{border-color:var(--scrub);background:var(--scrub-tint)}
.opt.sel .k{background:var(--scrub);border-color:var(--scrub);color:#fff}
.opt.right{border-color:var(--scrub);background:var(--scrub-tint)}
.opt.right .k{background:var(--scrub);border-color:var(--scrub);color:#fff}
.opt.bad{border-color:var(--wrong);background:var(--wrong-tint)}
.opt.bad .k{background:var(--wrong);border-color:var(--wrong);color:#fff}
.opt:disabled{cursor:default;color:inherit;opacity:1}
.exp{border-left:4px solid var(--scrub);background:var(--card);border-radius:0 10px 10px 0;
  padding:14px 16px;margin:16px 0 0}
.exp.no{border-left-color:var(--wrong)}
.exp b.verdict{display:block;margin-bottom:4px}
.exp .src{display:block;margin-top:8px;color:var(--soft);font-size:.86rem}
.actions{display:flex;gap:10px;margin-top:20px}
.actions .primary{margin-top:0}

/* results */
.score{font-family:var(--read);font-size:3.2rem;line-height:1;margin:10px 0 4px}
.row{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center;margin-bottom:12px}
.row .track{grid-column:1/-1;height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.row .track span{display:block;height:100%;background:var(--scrub)}
.row .track span.weak{background:var(--wrong)}
.review{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:10px}
.review .stem{font-size:1.06rem;margin:8px 0 10px}
.review p{margin:4px 0}
.review .you{color:var(--wrong)} .review .ans{color:var(--scrub-dark);font-weight:600}
@media (max-width:480px){h1{font-size:1.6rem}.stem{font-size:1.14rem}}
@media (prefers-reduced-motion:no-preference){.strip i{transition:background .2s,transform .2s}}
</style>
</head>
<body>
<div class="wrap">

<section id="start">
  <h1>Surgery, week 00</h1>
  <p class="lead">Year 3, batch A. Questions are written from your own lecture slides, handouts and LGW cases. Options are shuffled every time.</p>

  <h2>Pick the lectures</h2>
  <div id="topics"></div>

  <h2>How many questions</h2>
  <div class="seg" id="count">
    <button data-n="15">15</button><button data-n="30">30</button><button data-n="0" aria-pressed="true">All</button>
  </div>

  <h2>How to answer</h2>
  <div class="seg" id="mode">
    <button data-m="practice" aria-pressed="true">Practice</button><button data-m="exam">Exam</button>
  </div>
  <p class="note" id="modeNote"></p>

  <button class="primary" id="go">Start quiz</button>
</section>

<section id="quiz" class="hidden">
  <div class="bar"><span>Question <strong id="qn"></strong> of <strong id="qt"></strong></span>
    <span class="timer hidden" id="timer"></span>
    <button class="ghost" id="quit">End quiz</button></div>
  <div class="strip" id="strip"></div>
  <span class="tag" id="qtag"></span>
  <div class="stem" id="stem"></div>
  <div id="opts"></div>
  <div id="exp"></div>
  <div class="actions"><button class="primary" id="next" disabled>Check answer</button></div>
</section>

<section id="done" class="hidden">
  <h1>Your result</h1>
  <div class="score" id="score"></div>
  <p class="lead" id="scoreNote"></p>
  <h2>By lecture</h2>
  <div id="byTopic"></div>
  <div class="actions">
    <button class="primary" id="retry">Retry the ones I missed</button>
    <button class="ghost" id="home">Back to start</button>
  </div>
  <h2 id="revTitle">Questions to review</h2>
  <div id="reviews"></div>
</section>

</div>
<script>
const BANK = [{"topic": "Stress response to injury", "source": "ICC [154] + handout + LGW [154a]", "stem": "Who introduced the term \"homeostasis\" and linked survival to its maintenance?", "correct": "Walter B. Cannon", "distractors": ["Claude Bernard", "Sir David Cuthbertson", "Francis Moore"], "exp": "Claude Bernard described the constancy of the internal environment (milieu interieur). Walter Cannon took this further and introduced the word homeostasis. Cuthbertson described the ebb and flow phases, later modified by Moore."}, {"topic": "Stress response to injury", "source": "ICC [154] + handout + LGW [154a]", "stem": "Which type of injury produces the highest level of hypermetabolism?", "correct": "Major burns", "distractors": ["Elective abdominal surgery", "Simple starvation", "Closed long bone fracture"], "exp": "Burns lead to the highest level of hypermetabolism, partly because of plasma loss and heavy evaporation from denuded skin. Simple starvation is the opposite: it is a hypometabolic state."}, {"topic": "Stress response to injury", "source": "ICC [154] + handout + LGW [154a]", "stem": "Which insult is associated with the highest level of protein catabolism?", "correct": "Infection (sepsis)", "distractors": ["Elective hernia repair", "Unstressed starvation", "Chemical injury"], "exp": "The lecture states that infection leads to the highest level of protein catabolism, while burns lead to the highest hypermetabolism. In unstressed starvation protein is spared because ketones supply energy."}, {"topic": "Stress response to injury", "source": "ICC [154] + handout + LGW [154a]", "stem": "The stress response to injury is controlled by three interacting systems. Which are they?", "correct": "Central nervous system, endocrine system and immune system", "distractors": ["Cardiovascular, respiratory and renal systems", "Endocrine system, liver and skeletal muscle", "Central nervous system, coagulation system and kidneys"], "exp": "Injury is signalled through the CNS, endocrine and immune systems, which talk to each other through nerve signals, hormones and the washout of local mediators such as cytokines."}, {"topic": "Stress response to injury", "source": "ICC [154] + handout + LGW [154a]", "stem": "A 30-year-old man is assessed 3 hours after severe blunt trauma. Which finding fits the ebb phase of the stress response?", "correct": "Reduced cardiac output, oxygen consumption and metabolic rate", "distractors": ["Raised resting energy expenditure with negative nitrogen balance", "Surge of insulin, growth hormone and IGF-I with brisk diuresis", "Increased oxygen consumption with fever and leukocytosis"], "exp": "The ebb phase is the early (less than 24 hours) hypometabolic phase aimed at immediate survival: vasoconstriction, blood shunted to vital organs, lower cardiac output, oxygen consumption and metabolic rate. Raised energy expenditure and negative nitrogen balance belong to the catabolic flow phase; the insulin, GH and IGF-I surge with diuresis belongs to anabolic recovery."}, {"topic": "Stress response to injury", "source": "ICC [154] + handout + LGW [154a]", "stem": "After major injury, when does the catabolic process of the flow phase usually peak?", "correct": "At about 48 to 72 hours", "distractors": ["Within the first 6 hours", "At about 5 to 10 days", "At about 1 month"], "exp": "Catabolism usually peaks at roughly 48 to 72 hours. If the insult resolves, the anabolic state follows, with surges of insulin, GH and IGF-I within 5 to 10 days."}, {"topic": "Stress response to injury", "source": "ICC [154] + handout + LGW [154a]", "stem": "A postoperative patient is found to have a negative nitrogen balance. What does this mean?", "correct": "Net loss of body protein", "distractors": ["Excess protein intake from feeding", "Failure of the kidneys to excrete urea", "Net gain of muscle mass in recovery"], "exp": "Negative nitrogen balance indicates net protein catabolism. In the flow phase, skeletal muscle and visceral protein are broken down to supply amino acids for gluconeogenesis, acute phase proteins and wound healing, which causes muscle loss."}, {"topic": "Stress response to injury", "source": "ICC [154] + handout + LGW [154a]", "stem": "During the anabolic recovery phase, the cells re-expand. Which electrolyte movement is expected?", "correct": "Potassium, magnesium and phosphate move from blood into cells", "distractors": ["Sodium and chloride move from the blood into the cells", "Potassium leaks out of the cells and into the blood", "Calcium and sodium are lost in large amounts in the urine"], "exp": "As protein and fluid return to the depleted intracellular space, electrochemical balance requires K+, Mg2+ and PO4 to move from blood into cells. Interstitial oedema is reabsorbed and the excess fluid is passed as a brisk diuresis."}, {"topic": "Stress response to injury", "source": "ICC [154] + handout + LGW [154a]", "stem": "Why do patients commonly retain sodium and water after an operation?", "correct": "Stress-related release of ADH (vasopressin) and aldosterone", "distractors": ["Reduced release of cortisol from the adrenal cortex", "Direct damage to the renal tubules by anaesthetic drugs", "Suppression of the renin angiotensin system"], "exp": "ADH from the posterior pituitary and aldosterone from the adrenal cortex (driven by ACTH, renin angiotensin and electrolyte levels) cause water and salt retention. This is a normal part of the homeostatic response to injury."}, {"topic": "Stress response to injury", "source": "ICC [154] + handout + LGW [154a]", "stem": "In uncomplicated major surgery the endocrine response lasts only 24 to 48 hours, yet protein catabolism may continue for up to a month. What keeps it going?", "correct": "Proinflammatory cytokines such as TNF-alpha, IL-1, IL-6 and IL-8", "distractors": ["Persistently raised catecholamines from the adrenal medulla", "Continued secretion of glucagon from the pancreas", "Persistently low thyroid hormone levels"], "exp": "The counter-regulatory hormones (cortisol, glucagon, catecholamines) only start protein breakdown. Its continuation for up to a month after major surgery is due to proinflammatory cytokines acting locally and through the blood and CNS."}, {"topic": "Stress response to injury", "source": "ICC [154] + handout + LGW [154a]", "stem": "What is the modern aim of perioperative care in ELECTIVE surgery?", "correct": "Reduce the need for a stress response by minimising the insult (minimal access surgery, enhanced recovery care)", "distractors": ["Boost the stress response artificially with aggressive resuscitation and early organ support in every patient", "Prolong the ebb phase by delaying feeding and mobilisation until the wound has healed", "Block the stress response completely with routine high dose steroids before the incision"], "exp": "In elective surgery the goal is to reduce the need for a stress response: minimal access surgery and stress free (enhanced recovery) care. In emergency surgery the goal is different: support the response by resuscitation, control the primary insult quickly (close the open loop) and provide organ support."}, {"topic": "Stress response to injury", "source": "ICC [154] + handout + LGW [154a]", "stem": "Which feature belongs to simple (unstressed) starvation rather than to stressed starvation?", "correct": "High ketone production that spares body protein", "distractors": ["Marked proteolysis with heavy urinary nitrogen loss", "Increased resting energy expenditure", "Strong mediator (cytokine) activation"], "exp": "In unstressed starvation, energy expenditure falls, fat is the main fuel and ketones spare protein; this can be kept up for a long time. In stressed starvation there is a short ebb phase then a marked hypermetabolic flow phase with catabolism, proteolysis and gluconeogenesis."}, {"topic": "Stress response to injury", "source": "ICC [154] + handout + LGW [154a]", "stem": "Which statement about circulating cortisol in a patient with severe sepsis is correct?", "correct": "It increases adrenergic receptors on cells and sensitises them to catecholamines", "distractors": ["It binds to steroid receptors located on the outer surface of the cell membrane", "It worsens the inflammatory response and delays its resolution", "Its rise bears no relation to the degree of stress the patient is under"], "exp": "Free cortisol can rise up to six times in critical illness. It binds intracellular receptors, increases alpha and beta adrenergic receptors and their sensitivity to catecholamines (supporting haemodynamic stability), suppresses inflammation, and rises in proportion to the stress."}, {"topic": "Stress response to injury", "source": "ICC [154] + handout + LGW [154a]", "stem": "Which humoral system is the earliest to be activated in response to injury?", "correct": "The complement cascade", "distractors": ["The interleukin-10 pathway", "The kinin system", "Colony stimulating factors"], "exp": "Complement is the earliest humoral system activated. The anaphylatoxins C3a and C5a trigger release of proinflammatory cytokines, with TNF-alpha and IL-1 as key mediators."}, {"topic": "Stress response to injury", "source": "ICC [154] + handout + LGW [154a]", "stem": "Which cytokine is a key mediator of the ANTI-inflammatory response?", "correct": "Interleukin-10", "distractors": ["Interleukin-1", "Interleukin-8", "Tumour necrosis factor alpha"], "exp": "IL-10 inhibits the proinflammatory cytokines. TNF-alpha and IL-1 are the key proinflammatory mediators, IL-6 induces T and B cells, and IL-8 recruits and activates inflammatory cells at the injury site."}, {"topic": "Stress response to injury", "source": "ICC [154] + handout + LGW [154a]", "stem": "A non-diabetic trauma patient in ICU has a blood glucose of 240 mg/dl. What is the main mechanism of this stress hyperglycaemia?", "correct": "Insulin resistance from counter-regulatory hormones plus increased glucose production", "distractors": ["Destruction of pancreatic beta cells by circulating proinflammatory cytokines", "Excess glucose absorption from the gut because of increased splanchnic blood flow", "Reduced glucagon secretion with failure of the liver to store glycogen"], "exp": "Catecholamines and cortisol suppress insulin release and cause peripheral insulin resistance, while glucagon drives glycogenolysis and gluconeogenesis. Because perioperative hyperglycaemia raises morbidity and mortality, glucose is controlled with an insulin infusion in ICU."}, {"topic": "Stress response to injury", "source": "ICC [154] + handout + LGW [154a]", "stem": "Which statement about multiple organ dysfunction syndrome (MODS) is true?", "correct": "A first insult primes inflammation, then later insults cause hyperinflammation", "distractors": ["It can only be diagnosed when an active infection has been documented by culture", "Its incidence has fallen steadily over the last decade because of better ICU care", "It shows consistent improvement after blood transfusion restores oxygen delivery"], "exp": "The two-event model: an initial insult primes the system, then further events cause dysfunctional hyperinflammation. MODS can occur without overt infection, has increased in incidence (more patients survive the initial illness), and transfusion may be harmful because of its immune effects."}, {"topic": "Stress response to injury", "source": "ICC [154] + handout + LGW [154a]", "stem": "Which statement about the stress response is FALSE?", "correct": "The changes of the stress response cannot be modified", "distractors": ["It is graded according to the severity of the injury", "Metabolism and nitrogen excretion rise in proportion to the stress", "It involves physiological, metabolic and immunological changes"], "exp": "The false statement is that it cannot be modified. In severe injury the response can be modified by good ICU care: attention to nutrition and preventing second insults such as ischaemia, infection, hypoxia and compartment syndrome."}, {"topic": "Homeostasis and shock", "source": "ICC [155] + LGW [155a]", "stem": "Which is the best definition of shock?", "correct": "An acute haemodynamic disturbance with a systemic state of low tissue perfusion", "distractors": ["A systolic blood pressure below 90 mmHg that lasts for more than one hour", "Inadequate perfusion that is localised to a single tissue or limb", "Loss of more than 40% of the circulating blood volume from any cause"], "exp": "Shock is defined by poor tissue perfusion and its cellular consequences, whatever the cause. Blood pressure and heart rate are relatively insensitive. Localised inadequate perfusion is ischaemia, not shock."}, {"topic": "Homeostasis and shock", "source": "ICC [155] + LGW [155a]", "stem": "Which form of shock is the most common and is, to some degree, a component of all the other forms?", "correct": "Hypovolaemic shock", "distractors": ["Cardiogenic shock", "Neurogenic shock", "Anaphylactic shock"], "exp": "Hypovolaemia is the most common form and contributes to the others. Absolute or relative hypovolaemia must be excluded or treated in any shocked patient, whatever the cause."}, {"topic": "Homeostasis and shock", "source": "ICC [155] + LGW [155a]", "stem": "A 24-year-old man arrives after a street fight with a profusely bleeding scalp laceration. He is fully conscious. HR 110/min, BP 85/55, RR 24/min. Which class of haemorrhagic shock does he show?", "correct": "At least class III, because he is already hypotensive", "distractors": ["Class I, because he is fully conscious", "Class II, because the pulse is below 120", "It cannot be classified without a haemoglobin result"], "exp": "A fall in blood pressure means compensation has failed, which places him in at least class III. Haemoglobin and haematocrit do not help in the acute phase."}, {"topic": "Homeostasis and shock", "source": "ICC [155] + LGW [155a]", "stem": "Why are haemoglobin and haematocrit unreliable for estimating blood loss in the first hour of acute bleeding?", "correct": "They fall only after transcapillary refill or IV fluids dilute the remaining blood", "distractors": ["The bone marrow releases new red cells into the blood within minutes of bleeding", "Red cells are lost much faster than plasma, so the haematocrit rises at first", "The laboratory assays become inaccurate when the patient is cold and shocked"], "exp": "Whole blood is lost, so the concentration stays the same at first. A drop appears only when fluid moves in from the tissues (transcapillary refill) or IV fluids are given."}, {"topic": "Homeostasis and shock", "source": "ICC [155] + LGW [155a]", "stem": "What explains the rapid breathing of a shocked patient?", "correct": "Metabolic acidosis and sympathetic drive raise ventilation to blow off carbon dioxide", "distractors": ["Pulmonary oedema caused by the fluid given during resuscitation stiffens the lungs", "Lactic acid causes a respiratory acidosis that directly depresses gas exchange", "Cortisol released in the stress response directly stimulates the respiratory centre"], "exp": "Underperfused tissue switches to anaerobic metabolism and produces lactic acid, giving metabolic (not respiratory) acidosis. The body compensates by increasing the respiratory rate and minute ventilation."}, {"topic": "Homeostasis and shock", "source": "ICC [155] + LGW [155a]", "stem": "Which principle governs resuscitation of a bleeding trauma patient?", "correct": "Low volume fluids, permissive hypotension, early RBCs : FFP : platelets at 1:1:1", "distractors": ["Large volumes of warmed crystalloid to bring the blood pressure quickly back to normal", "Packed red cells only, with plasma and platelets held back until coagulopathy is proven", "Vasopressors first to restore the pressure, with fluids only if there is no response"], "exp": "Too much fluid dilutes clotting factors, and raising the pressure may restart bleeding. The rule for haemorrhagic shock is STOP the bleeding and REPLACE the loss."}, {"topic": "Homeostasis and shock", "source": "ICC [155] + LGW [155a]", "stem": "A 47-year-old woman with gallstones presents with right upper abdominal pain, jaundice, fever and rigors. HR 126, BP 90/40, RR 28, temperature 39.5 C. What explains her wide pulse pressure?", "correct": "Vasodilatation lowers peripheral resistance, so the diastolic pressure falls", "distractors": ["Severe blood loss reduces the stroke volume, so the systolic pressure falls", "Intense peripheral vasoconstriction pushes the systolic pressure upward", "Sepsis damages the aortic valve and causes acute regurgitation"], "exp": "This is septic (distributive) shock from cholangitis. Endotoxin and immune mediators cause vasodilatation and relative hypovolaemia, so the diastolic pressure falls and the peripheries are warm, especially early on."}, {"topic": "Homeostasis and shock", "source": "ICC [155] + LGW [155a]", "stem": "In the initial sepsis bundle, what must be done BEFORE the first dose of antibiotics?", "correct": "Take blood cultures", "distractors": ["Wait for the lactate result", "Obtain a CT scan to find the source", "Start a vasopressor infusion"], "exp": "The bundle: oxygen, IV access with crystalloid (30 ml/kg), urinary catheter, blood cultures BEFORE antibiotics, empirical antibiotics, and a lactate level. Vasopressors are considered if hypotension persists after fluids."}, {"topic": "Homeostasis and shock", "source": "ICC [155] + LGW [155a]", "stem": "For the woman with septic shock due to cholangitis, how is the source of sepsis best controlled?", "correct": "Urgent drainage of the common bile duct by ERCP", "distractors": ["Antibiotics alone for 2 weeks", "Elective cholecystectomy after 6 weeks", "Percutaneous drainage of the gallbladder only"], "exp": "The two pillars of septic shock management are resuscitation (with vasopressors if needed) and source control. In cholangitis the obstructed CBD must be drained, by urgent ERCP. Antibiotics are then adjusted to the culture result."}, {"topic": "Homeostasis and shock", "source": "ICC [155] + LGW [155a]", "stem": "A 6-year-old boy with a known nut allergy develops facial swelling, dyspnoea and wheeze after eating a peanut butter sandwich. BP 78/40, HR 146. Which treatment is life saving?", "correct": "Intramuscular adrenaline", "distractors": ["Intravenous antihistamine", "Intravenous corticosteroid", "Nebulised salbutamol alone"], "exp": "This is anaphylactic shock. IM adrenaline is life saving. Oxygen, early thought about intubation (laryngeal oedema), IV access and crystalloids are given; steroids and antihistamines are helpful additions, not the first line."}, {"topic": "Homeostasis and shock", "source": "ICC [155] + LGW [155a]", "stem": "A 74-year-old man after a car accident has chest pain and breathlessness. HR 88, BP 100/85, RR 24. Why can shock NOT be excluded from these numbers?", "correct": "He may normally be hypertensive, and beta blockers can hide a tachycardia", "distractors": ["Elderly patients are unable to develop a tachycardia in response to bleeding", "A narrow pulse pressure with a normal heart rate always excludes shock", "Shock can only be diagnosed once the systolic pressure is below 80 mmHg"], "exp": "Vital signs must be compared with the patient's usual values. All perfusion parameters, drug history (beta blockers, antiplatelets, anticoagulants), neck veins, ECG and cardiac enzymes should be assessed. In trauma, assume haemorrhagic shock until proven otherwise."}, {"topic": "Homeostasis and shock", "source": "ICC [155] + LGW [155a]", "stem": "A trauma patient in shock deteriorates after a 2 litre fluid challenge and the CVP is RISING. Which causes should be suspected first?", "correct": "Tension pneumothorax, cardiac tamponade or cardiac failure", "distractors": ["Continuing intra-abdominal bleeding from a solid organ", "An inadequate volume of fluid given during the challenge", "Neurogenic shock from an unrecognised spinal cord injury"], "exp": "Non-responders with a rising CVP have a pump or obstructive problem: the killers are tension pneumothorax, cardiac tamponade and cardiac failure. A LOW CVP with no improvement means continued losses and need for exploration."}, {"topic": "Homeostasis and shock", "source": "ICC [155] + LGW [155a]", "stem": "A patient in mild shock improves after 2 litres of Ringer's lactate but soon deteriorates again (transient responder). What does this suggest?", "correct": "Continuing losses, under-replacement or a failing heart", "distractors": ["The shock has been corrected and monitoring can stop", "The diagnosis must be anaphylaxis rather than bleeding", "Too much fluid has been given and diuretics are needed"], "exp": "Responders improve definitely. Transient responders suggest ongoing moderate loss (bleeding or fluid shifts), inadequate replacement or a failing heart. Non-responders in trauma suggest tension pneumothorax or tamponade."}, {"topic": "Homeostasis and shock", "source": "ICC [155] + LGW [155a]", "stem": "Which haemodynamic picture matches the early (hyperdynamic) stage of septic shock?", "correct": "High cardiac output, low peripheral resistance, warm flushed skin, rapid capillary refill", "distractors": ["Low cardiac output, high peripheral resistance, cold pale sweaty skin, slow capillary refill", "Low cardiac output, raised neck veins, cold and possibly cyanosed skin, slow capillary refill", "Low cardiac output, low peripheral resistance, urticarial rash with bronchospasm"], "exp": "Early septic shock is warm shock: vasodilatation with a high but ineffective cardiac output. Cold pale sweaty skin with high resistance fits hypovolaemic shock; raised neck veins with a cold periphery fits cardiogenic shock; rash and bronchospasm fit anaphylaxis."}, {"topic": "Homeostasis and shock", "source": "ICC [155] + LGW [155a]", "stem": "In which type of shock is the mixed venous oxygen saturation HIGH?", "correct": "Septic shock", "distractors": ["Hypovolaemic shock", "Cardiogenic shock", "Haemorrhagic shock"], "exp": "In sepsis the tissues cannot extract and use oxygen (microcirculatory shunting and mitochondrial dysfunction), so venous blood returns still rich in oxygen. In hypovolaemic and cardiogenic shock delivery is low and extraction is high, so the saturation is low."}, {"topic": "Homeostasis and shock", "source": "ICC [155] + LGW [155a]", "stem": "Which three factors form the \"lethal triad\" in bleeding trauma patients?", "correct": "Hypothermia, acidosis and coagulopathy", "distractors": ["Hypoxia, hypercarbia and hypotension", "Hypothermia, alkalosis and anaemia", "Tachycardia, hypotension and oliguria"], "exp": "Preventing hypothermia, acidaemia and coagulopathy is essential in haemorrhagic shock, together with volume replacement using blood products and timely control of bleeding."}, {"topic": "Homeostasis and shock", "source": "ICC [155] + LGW [155a]", "stem": "After prolonged shock, circulation is restored and the patient suddenly worsens. Which statement about ischaemia reperfusion injury is correct?", "correct": "Acid, potassium and activated neutrophils flush back into the circulation and injure distant organs", "distractors": ["It is reliably prevented by giving sodium bicarbonate and calcium just before the circulation is restored", "It stays confined to the limb or organ that was ischaemic and does not affect distant organs", "It lowers the serum potassium because recovering cells rapidly take potassium up from the blood"], "exp": "Reperfusion returns an acid and potassium load plus activated cellular and humoral elements, causing myocardial depression, vasodilatation, further hypotension and endothelial injury in distant organs (multi-organ failure). The only current protection is to shorten and limit hypoperfusion."}, {"topic": "Homeostasis and shock", "source": "ICC [155] + LGW [155a]", "stem": "Which finding separates neurogenic shock from the other types of shock?", "correct": "Bradycardia from loss of sympathetic outflow", "distractors": ["Marked tachycardia with cold sweaty skin", "Urticarial rash with bronchospasm", "Raised neck veins with a cold periphery"], "exp": "Neurogenic shock is a low resistance (distributive) shock caused by loss of sympathetic outflow, so the expected compensatory tachycardia is missing."}, {"topic": "Homeostasis and shock", "source": "ICC [155] + LGW [155a]", "stem": "When tissue perfusion falls, which sequence occurs inside the cells?", "correct": "Anaerobic metabolism, lactic acid build-up, then sodium potassium pump failure and cell lysis", "distractors": ["A switch to aerobic metabolism, excess carbon dioxide production and a respiratory acidosis", "Increased ATP production, which overloads the sodium potassium pump and shrinks the cell", "Early uptake of potassium by the cells, which causes hypokalaemia and membrane stabilisation"], "exp": "The product of aerobic respiration is carbon dioxide; the product of anaerobic respiration is lactic acid, giving metabolic acidosis. When glucose runs out the Na/K pump fails, lysosomes release enzymes, cells lyse and potassium is released into the blood."}, {"topic": "Surgical infection", "source": "ICC [110] Surgical infection", "stem": "What is the common thread that makes an infection a \"surgical\" infection?", "correct": "It stems from, or causes, an anatomical problem that must be corrected for it to resolve", "distractors": ["It always follows a surgical operation carried out in a hospital operating theatre", "It is always caused by organisms that are resistant to the common antibiotics", "It can never resolve unless a full course of systemic antibiotics is given"], "exp": "Surgical infections need physical treatment: drainage, debridement, removing an appendix, closing a perforation, removing an infected prosthesis, ERCP for a CBD stone or a percutaneous drain. Some, like a subcutaneous abscess or superficial SSI, may resolve with drainage alone."}, {"topic": "Surgical infection", "source": "ICC [110] Surgical infection", "stem": "Which term means the mere presence of micro-organisms in tissues, without adverse consequences?", "correct": "Contamination", "distractors": ["Infection", "Sepsis", "Septicaemia"], "exp": "Contamination is simple presence of organisms. Infection is their proliferation in tissue with adverse physiological consequences. Sepsis is when infection triggers a poorly regulated inflammatory response that becomes systemic."}, {"topic": "Surgical infection", "source": "ICC [110] Surgical infection", "stem": "How does Sepsis-3 (2016) define sepsis?", "correct": "Life-threatening organ dysfunction from a dysregulated host response to infection", "distractors": ["A documented infection together with at least two of the four SIRS criteria", "Positive blood cultures together with a temperature above 38 C or below 36 C", "Infection with hypotension that needs vasopressors despite adequate fluids"], "exp": "Sepsis-3 abandoned the SIRS criteria and removed the term \"severe sepsis\", so sepsis without organ dysfunction no longer exists as a category. Infection plus SIRS was the older Sepsis-1 (1991) definition."}, {"topic": "Surgical infection", "source": "ICC [110] Surgical infection", "stem": "Which of the following is NOT one of the three qSOFA criteria?", "correct": "Temperature above 38 C", "distractors": ["Raised respiratory rate (22/min or more)", "Altered mental status", "Low systolic blood pressure (100 mmHg or less)"], "exp": "qSOFA is a bedside screen with three items: respiratory rate, mental status and systolic pressure. A score of 2 starts the sepsis pathway. Its weakness is poor sensitivity for early sepsis. Temperature belongs to the older SIRS criteria."}, {"topic": "Surgical infection", "source": "ICC [110] Surgical infection", "stem": "A patient with pancreatitis has HR 104/min, RR 26/min, temperature 37.4 C and WBC 9,000. Does this meet the SIRS criteria?", "correct": "Yes, two criteria are present: heart rate above 90 and respiratory rate above 20", "distractors": ["No, because a temperature above 38 C or below 36 C is compulsory for SIRS", "No, because at least three of the four criteria are needed for SIRS", "No, because SIRS can only be diagnosed when infection has been proven"], "exp": "SIRS needs 2 of: respiratory rate above 20 (or low PaCO2), heart rate above 90, temperature above 38 or below 36, and WBC above 12,000, below 3,000 or more than 10% band forms. SIRS can be caused by non-infectious conditions such as pancreatitis, trauma and transfusion reaction."}, {"topic": "Surgical infection", "source": "ICC [110] Surgical infection", "stem": "Under Sepsis-3, how is septic shock defined?", "correct": "Vasopressors needed to keep MAP above 65 mmHg despite fluids, with lactate above 2 mmol/L", "distractors": ["A systolic pressure below 90 mmHg on arrival in a patient with suspected infection", "Sepsis with failure of two or more organ systems on the SOFA score", "Sepsis with a qSOFA score of 2 or more and a positive blood culture"], "exp": "Both parts are required: vasopressor need after adequate fluid resuscitation and a raised lactate. A SOFA score of 2 or more identifies organ dysfunction and is linked to a 10% or greater rise in mortality."}, {"topic": "Surgical infection", "source": "ICC [110] Surgical infection", "stem": "What is endotoxin?", "correct": "Lipopolysaccharide from the Gram-negative cell wall, released when the bacteria lyse", "distractors": ["A protein toxin actively secreted by living Gram-positive bacteria into the tissues", "An enzyme such as hyaluronidase that dissolves connective tissue and aids spread", "A toxin that travels along nerves to the central nervous system, like tetanospasmin"], "exp": "LPS stimulates endothelial cells and macrophages to release cytokines that drive inflammation and septic shock. The equivalent molecule in Gram-positive bacteria is lipoteichoic acid. Tetanospasmin is an exotoxin; hyaluronidase and streptokinase damage connective tissue and help spread."}, {"topic": "Surgical infection", "source": "ICC [110] Surgical infection", "stem": "A postoperative patient on prolonged broad-spectrum antibiotics develops severe diarrhoea. Which organism is the likely cause?", "correct": "Clostridium difficile", "distractors": ["Staphylococcus epidermidis", "Klebsiella", "Streptococcus pyogenes"], "exp": "Broad-spectrum antibiotics wipe out commensals and allow C. difficile to take over the colon, causing pseudomembranous colitis, which can be life threatening. Klebsiella colonising the upper airway is linked to ventilator associated pneumonia."}, {"topic": "Surgical infection", "source": "ICC [110] Surgical infection", "stem": "In MODS, organs tend to fail in a predictable order. Which organ system usually fails FIRST?", "correct": "The lungs", "distractors": ["The kidneys", "The liver", "The heart"], "exp": "The usual sequence is pulmonary failure first (ARDS, non-cardiogenic pulmonary oedema from increased permeability), then hepatic, intestinal, renal and finally cardiac failure."}, {"topic": "Surgical infection", "source": "ICC [110] Surgical infection", "stem": "What is the approximate mortality of MODS when THREE organs have failed?", "correct": "More than 90%", "distractors": ["About 20 to 30%", "About 40 to 50%", "About 60 to 70%"], "exp": "Mortality follows the number of failing organs: about 40% with one, 60% with two and more than 90% with three."}, {"topic": "Surgical infection", "source": "ICC [110] Surgical infection", "stem": "Which term describes septic emboli circulating in the blood and lodging in organs to cause metastatic abscesses?", "correct": "Pyaemia", "distractors": ["Bacteraemia", "Toxaemia", "Septicaemia"], "exp": "Bacteraemia is transient circulation of a few bacteria without toxic features. Toxaemia is circulating toxins. Septicaemia is circulation and multiplication of many virulent bacteria and their toxins with a systemic response. Pyaemia is septic emboli with metastatic abscesses."}, {"topic": "Surgical infection", "source": "ICC [110] Surgical infection", "stem": "An abscess with dead tissue does not improve on the correct antibiotic. What is the principle behind the next step?", "correct": "Antibiotics do not work once tissue is dead, so it must be drained or debrided", "distractors": ["A second antibiotic should be added and the patient observed for another week", "The antibiotic dose should be doubled to improve penetration into the abscess", "Steroids should be added to reduce the inflammation around the abscess wall"], "exp": "Antibiotics tip the balance toward the host only in living, perfused tissue. Surgery reduces the bacterial load (incision and drainage) and improves the local environment (debridement)."}, {"topic": "Surgical infection", "source": "ICC [110] Surgical infection", "stem": "Which antibiotic works by disrupting nucleic acids?", "correct": "Metronidazole", "distractors": ["A carbapenem", "Clindamycin", "An aminoglycoside"], "exp": "Nucleic acid disrupters: fluoroquinolones, metronidazole and trimethoprim-sulfamethoxazole. Beta-lactams (penicillins, cephalosporins, carbapenems, monobactams) act on the cell wall. Aminoglycosides, tetracyclines, clindamycin and linezolid inhibit protein synthesis."}, {"topic": "Surgical infection", "source": "ICC [110] Surgical infection", "stem": "Seven days after an anterior resection a patient develops an intra-abdominal abscess from an anastomotic leak. How is this infection classified, and why does it matter?", "correct": "Nosocomial: resistant organisms and reduced immunity are more likely", "distractors": ["Community acquired: the bacteria come from the patient's own bowel", "Community acquired: if it only shows itself after discharge home", "Contamination only: the original operation was clean surgery"], "exp": "Nosocomial infections arise as a consequence of, or during, treatment. They may appear after discharge: about 70% of postoperative infections present in the community. Peritonitis from a perforated diverticulum before admission is community acquired."}, {"topic": "Surgical infection", "source": "ICC [110] Surgical infection", "stem": "How can previously sensitive bacteria acquire resistance to antibiotics from other bacteria?", "correct": "By transfer of plasmids", "distractors": ["By release of endotoxin", "By forming an abscess wall", "By producing hyaluronidase"], "exp": "Resistance genes can be passed between bacteria on plasmids. Inappropriate antibiotic use encourages more virulent and resistant organisms, one reason the incidence of sepsis is rising."}, {"topic": "Principles of surgical oncology", "source": "ICC [123] Principles of oncology", "stem": "Normal cells can divide only a limited number of times (about 40 to 60). How do cancer cells become \"immortal\"?", "correct": "They use telomerase to rebuild the telomere at each cell cycle", "distractors": ["They switch off every tumour suppressor gene in the genome", "They stop needing a blood supply once they reach 1 cm", "They lengthen the cell cycle so that telomeres wear out slowly"], "exp": "Telomere shortening acts as a molecular clock that ends a cell line. Telomerase rebuilds the telomere each cycle, so there is no shortening and the lineage never dies."}, {"topic": "Principles of surgical oncology", "source": "ICC [123] Principles of oncology", "stem": "Which mathematical model is now believed to best describe tumour growth?", "correct": "Gompertzian: exponential at first, then slowing as the tumour enlarges", "distractors": ["Exponential: the doubling time stays constant throughout the disease", "Linear: a fixed number of cells is added in each unit of time", "Stepwise: short bursts of growth separated by long resting periods"], "exp": "Early growth is exponential, but the rate slows as the tumour grows, probably from problems with nutrition and oxygen: tumour cells compete with host tissues and with each other."}, {"topic": "Principles of surgical oncology", "source": "ICC [123] Principles of oncology", "stem": "During invasion, epithelial cancer cells become mobile and behave like mesenchymal cells. What is this called?", "correct": "Epithelial mesenchymal transition", "distractors": ["Loss of contact inhibition", "Escape from immune surveillance", "Anaplastic dedifferentiation"], "exp": "Invasion uses three mechanisms: rising interstitial pressure with loss of contact inhibition; dissolving the extracellular matrix with collagenases and proteases and detaching through altered integrins; and increased motility, where epithelial cells act like mesenchymal cells (EMT)."}, {"topic": "Principles of surgical oncology", "source": "ICC [123] Principles of oncology", "stem": "Breakdown of immune surveillance allows tumours to develop. Which cancers are associated with HIV/AIDS?", "correct": "Non-Hodgkin lymphoma, Kaposi sarcoma, invasive cervical cancer", "distractors": ["Colorectal cancer, gastric cancer and pancreatic cancer", "Seminoma, medullary thyroid cancer and osteosarcoma", "Basal cell carcinoma, laryngeal cancer and breast cancer"], "exp": "HIV/AIDS is linked to NHL, Kaposi sarcoma and invasive cervical cancer. Immunosuppression after transplantation is linked to Hodgkin disease, Kaposi sarcoma and cancers of the skin, oropharynx and bone."}, {"topic": "Principles of surgical oncology", "source": "ICC [123] Principles of oncology", "stem": "According to the current concept of cancer spread, what does involvement of the regional lymph nodes mean?", "correct": "It is an indicator that widespread dissemination has probably already occurred", "distractors": ["It is simply an orderly stage before blood spread, so the disease is still regional", "It proves the tumour is of low grade", "It means surgery has no role"], "exp": "Malignant cells can enter both lymphatics and blood vessels from the earliest stages, producing micrometastases. Consequences: need for systemic treatment, rethinking of very radical local surgery, and a new meaning of cure (a normal lifespan without further clinical disease)."}, {"topic": "Principles of surgical oncology", "source": "ICC [123] Principles of oncology", "stem": "Which biopsy method gives a CYTOLOGICAL diagnosis only, not a histological one?", "correct": "Fine needle aspiration", "distractors": ["Core (wide bore) needle biopsy", "Incisional biopsy", "Excisional biopsy"], "exp": "FNAC gives cells (cellular pathology). Core needle biopsy gives tissue for histology and tissue markers. The biopsy method should be chosen with multidisciplinary input, because a wrong choice can compromise later surgery."}, {"topic": "Principles of surgical oncology", "source": "ICC [123] Principles of oncology", "stem": "A tumour is reported as grade 3. What does this mean?", "correct": "Poorly differentiated or anaplastic (high grade)", "distractors": ["Well differentiated tumour cells (low grade)", "Spread to the regional lymph nodes (N stage)", "A primary tumour larger than 3 cm (T stage)"], "exp": "Grading describes differentiation: grade 1 well, grade 2 moderately, grade 3 poorly differentiated/anaplastic. Staging (TNM clinically, pTNM after surgery and pathology) describes extent. Both guide prognosis and treatment."}, {"topic": "Principles of surgical oncology", "source": "ICC [123] Principles of oncology", "stem": "Treating a patient who has a premalignant condition so that cancer does not develop is which level of prophylaxis?", "correct": "Secondary prophylaxis", "distractors": ["Primary prophylaxis", "Tertiary prophylaxis", "Palliative care"], "exp": "Primary: an otherwise healthy person. Secondary: people with premalignant conditions. Tertiary: avoiding second tumours in people cured of their first cancer."}, {"topic": "Principles of surgical oncology", "source": "ICC [123] Principles of oncology", "stem": "Which drug is used as chemoprevention to reverse oral leukoplakia?", "correct": "13-cis-retinoic acid", "distractors": ["Tamoxifen", "Nicotinamide (vitamin B3)", "Flutamide"], "exp": "Chemoprevention examples in the lecture: tamoxifen for breast cancer, nicotinamide for non-melanoma skin cancer, and 13-cis-retinoic acid to reverse leukoplakia. Flutamide is an anti-androgen used to treat prostate cancer."}, {"topic": "Principles of surgical oncology", "source": "ICC [123] Principles of oncology", "stem": "A healthy person is found to carry an inherited CDH1 gene mutation. Which risk reducing operation applies?", "correct": "Total gastrectomy", "distractors": ["Total thyroidectomy", "Total colectomy", "Subcutaneous mastectomy"], "exp": "Risk reducing surgery: CDH1 mutation to total gastrectomy; MEN2 to total thyroidectomy; BRCA positive to mastectomy; familial polyposis or ulcerative colitis to colectomy."}, {"topic": "Principles of surgical oncology", "source": "ICC [123] Principles of oncology", "stem": "Radiotherapy is given BEFORE surgery for a rectal adenocarcinoma to shrink it and help achieve a clear margin. What is this setting called?", "correct": "Neoadjuvant therapy", "distractors": ["Adjuvant therapy", "Primary therapy", "Palliative therapy"], "exp": "Neoadjuvant: before surgery to downsize the tumour. Adjuvant: after curative surgery when relapse risk is high (node positive breast cancer; radiotherapy after lumpectomy). Primary: used alone (chemotherapy for leukaemia and lymphoma; radiotherapy for laryngeal cancer, seminoma, localised Hodgkin disease)."}, {"topic": "Principles of surgical oncology", "source": "ICC [123] Principles of oncology", "stem": "What is brachytherapy?", "correct": "The radiation source is placed near or inside the target tissue", "distractors": ["An external beam is delivered from a machine at a distance from the patient", "A radioactive isotope such as iodine is swallowed and taken up by the tumour", "A light source activates a photosensitising drug to produce free radicals"], "exp": "Routes of radiotherapy: systemic (oral radioactive iodine), teletherapy (external beam) and brachytherapy (source near or within the tissue). The light activated drug describes photodynamic therapy."}, {"topic": "Principles of surgical oncology", "source": "ICC [123] Principles of oncology", "stem": "BCG instilled for superficial bladder cancer is an example of which treatment?", "correct": "Non-specific active immunotherapy", "distractors": ["Passive immunotherapy with cytokines", "Targeted therapy against a growth factor receptor", "Gene therapy"], "exp": "Active immunotherapy is non-specific (BCG) or specific (vaccines from tumour cells or antigen presenting cells). Passive immunotherapy uses cytokines such as interferon alpha. Blocking HER2 in breast cancer is targeted (biological) therapy."}, {"topic": "Principles of surgical oncology", "source": "ICC [123] Principles of oncology", "stem": "In which cancers is sentinel lymph node biopsy used as part of surgery with curative intent?", "correct": "Breast cancer and melanoma", "distractors": ["Oesophageal and gastric cancer", "Pancreatic and colorectal cancer", "Lymphoma and leukaemia"], "exp": "Formal lymphadenectomy is done for oesophageal, gastric, pancreatic and colorectal cancer. Sentinel node biopsy is used for breast cancer and melanoma. In lymphoma, a lymph node biopsy is diagnostic, not curative."}, {"topic": "Principles of surgical oncology", "source": "ICC [123] Principles of oncology", "stem": "Removing metastases (metastasectomy) can be part of curative treatment. Which example is given in the lecture?", "correct": "Liver metastases from colorectal cancer", "distractors": ["Brain metastases from lung cancer", "Bone metastases from prostate cancer", "Peritoneal deposits from gastric cancer"], "exp": "Examples: hepatic metastases of colorectal cancer and pulmonary metastases from soft tissue sarcoma. Requirements: an adequate disease free interval, a suitable organ, and the ability to leave the patient tumour free with acceptable morbidity and mortality."}, {"topic": "Vascular anatomy and physiology", "source": "[177] Vascular anatomy and physiology + handout", "stem": "What is the difference between serum and plasma?", "correct": "Serum is plasma without the clotting factors", "distractors": ["Serum contains the white cells and platelets", "Serum is plasma with the proteins removed", "Serum is another name for the buffy coat"], "exp": "After centrifuging, red cells make up about 45% of blood volume (the haematocrit), the buffy coat (white cells and platelets) slightly less than 1%, and plasma about 55%."}, {"topic": "Vascular anatomy and physiology", "source": "[177] Vascular anatomy and physiology + handout", "stem": "At rest, where is most of the blood volume found, and what are these vessels called?", "correct": "In the veins (about 64%), the capacitance vessels", "distractors": ["In the large arteries, the conducting vessels", "In the capillaries, the exchange vessels", "In the heart and lungs, the central reservoir"], "exp": "Veins are distensible and numerous, with a poorly developed media, so they act as the blood reservoir. This is why venous return is the key to cardiac output in hypovolaemia."}, {"topic": "Vascular anatomy and physiology", "source": "[177] Vascular anatomy and physiology + handout", "stem": "Which vessels are responsible for most of the vascular resistance?", "correct": "Small muscular arteries and arterioles", "distractors": ["Large elastic arteries such as the aorta", "Capillaries", "Veins and venules"], "exp": "Small arteries and arterioles provide about 47% of vascular resistance. The contraction state of their medial smooth muscle sets vessel calibre and therefore blood flow and blood pressure."}, {"topic": "Vascular anatomy and physiology", "source": "[177] Vascular anatomy and physiology + handout", "stem": "What are the three branches of the aortic arch, in order?", "correct": "Brachiocephalic trunk, left common carotid artery, left subclavian artery", "distractors": ["Right subclavian, right common carotid, left common carotid", "Brachiocephalic trunk, left vertebral artery, left subclavian artery", "Right and left coronary arteries, then brachiocephalic trunk"], "exp": "The brachiocephalic trunk divides into the right subclavian and right common carotid arteries. The coronary arteries arise from the ascending aorta, not the arch."}, {"topic": "Vascular anatomy and physiology", "source": "[177] Vascular anatomy and physiology + handout", "stem": "In a high speed deceleration injury, where does blunt traumatic rupture of the aorta typically occur?", "correct": "Just below the origin of the left subclavian artery", "distractors": ["At the aortic root above the valve", "At the aortic hiatus of the diaphragm", "At the bifurcation into the common iliac arteries"], "exp": "The segment just beyond the left subclavian origin is a frequent site of traumatic rupture in decelerating injuries and also a site of aortic dissection in hypertensive patients."}, {"topic": "Vascular anatomy and physiology", "source": "[177] Vascular anatomy and physiology + handout", "stem": "Which statement about the arterial supply of the brain is correct?", "correct": "The vertebral arteries form the basilar artery; cerebral arteries are mostly end arteries", "distractors": ["The brain is supplied only by the internal carotid arteries, with no vertebral contribution", "The basilar artery is formed by the union of the two internal carotid arteries", "Rich anastomoses fully compensate when any single cerebral artery is occluded"], "exp": "The internal carotid and vertebrobasilar systems meet at the circle of Willis, but the arteries supplying the brain tissue are end arteries. This is why cerebral perfusion must be protected during major haemorrhage."}, {"topic": "Vascular anatomy and physiology", "source": "[177] Vascular anatomy and physiology + handout", "stem": "What is the most common cause of subarachnoid haemorrhage?", "correct": "Rupture of a saccular (berry) aneurysm", "distractors": ["Hypertensive intracerebral bleed", "Embolus from the heart", "Atheroma at the carotid bifurcation"], "exp": "Berry aneurysms occur at arterial branch points; about 85% lie between the anterior cerebral, internal carotid and middle cerebral branches. Most strokes overall (70 to 80%) are ischaemic, from thrombosis or embolism."}, {"topic": "Vascular anatomy and physiology", "source": "[177] Vascular anatomy and physiology + handout", "stem": "A patient has sudden right arm weakness that recovers fully within 40 minutes. What is the most common site of the responsible atheroma?", "correct": "The bifurcation of the common carotid artery", "distractors": ["The origin of the common carotid artery", "The basilar artery", "The circle of Willis"], "exp": "A TIA is a focal deficit lasting less than 24 hours (usually 15 minutes to 1 hour), most often from emboli arising in the heart, carotid or cerebral vessels. Atheroma at the common carotid bifurcation is the most common site. A deficit lasting more than 24 hours is a stroke."}, {"topic": "Vascular anatomy and physiology", "source": "[177] Vascular anatomy and physiology + handout", "stem": "Which coronary artery is most often occluded in myocardial infarction, and which area does it affect?", "correct": "Left anterior descending: anterior and apical left ventricle, anterior two thirds of the septum", "distractors": ["Right coronary: anterior wall of the left ventricle and the anterior two thirds of the septum", "Circumflex: most of the right ventricle together with the sinuatrial node", "Left anterior descending: posterior left ventricular wall and posterior third of the septum"], "exp": "The proximal LAD accounts for 40 to 50% of occlusions. The right coronary (30 to 40%) affects the posterior left ventricular wall and posterior third of the septum. Infarction begins in the subendocardium, the most poorly perfused layer, about 20 to 30 minutes after occlusion."}, {"topic": "Vascular anatomy and physiology", "source": "[177] Vascular anatomy and physiology + handout", "stem": "Which artery supplies the midgut?", "correct": "Superior mesenteric artery", "distractors": ["Coeliac trunk", "Inferior mesenteric artery", "Internal iliac artery"], "exp": "Foregut (lower oesophagus to the middle of the second part of the duodenum): coeliac trunk. Midgut (to the right two thirds of the transverse colon): superior mesenteric artery. Hindgut (from there to the anus): inferior mesenteric artery."}, {"topic": "Vascular anatomy and physiology", "source": "[177] Vascular anatomy and physiology + handout", "stem": "A patient with chronic liver disease vomits blood from dilated veins. At which sites do the portal and systemic venous systems connect?", "correct": "The lower oesophagus and the rectum", "distractors": ["The stomach fundus and the spleen", "The duodenum and the pancreas", "The gallbladder and the appendix"], "exp": "Portal blood from the gut, pancreas, gallbladder and spleen passes through the liver sinusoids, then the hepatic veins to the IVC. In portal hypertension the portosystemic anastomoses at the lower oesophagus (varices) and rectum (rectal varices) dilate."}, {"topic": "Vascular anatomy and physiology", "source": "[177] Vascular anatomy and physiology + handout", "stem": "Where does the thoracic duct return lymph to the blood?", "correct": "At the junction of the left internal jugular and left subclavian veins", "distractors": ["Into the superior vena cava directly", "At the junction of the right internal jugular and right subclavian veins", "Into the azygos vein"], "exp": "The thoracic duct carries about 75 to 80% of the body's lymph. The much smaller right lymphatic duct drains the right upper quadrant to the matching site on the right. Lymphatics return about 3.5 to 4 litres of fluid a day."}, {"topic": "Vascular anatomy and physiology", "source": "[177] Vascular anatomy and physiology + handout", "stem": "Why does a scalp laceration bleed so heavily?", "correct": "Tough connective tissue under the skin holds the cut arteries open", "distractors": ["The scalp is supplied directly by the internal carotid artery", "Scalp veins have no valves, so blood flows back from the skull", "Arterial pressure in the scalp is higher than in other skin"], "exp": "The scalp is supplied by branches of the external carotid artery, such as the superficial temporal artery. The dense connective tissue keeps cut vessels open, so direct compression is the first step."}, {"topic": "Vascular anatomy and physiology", "source": "[177] Vascular anatomy and physiology + handout", "stem": "During major haemorrhage the circulation is redistributed. Which organs are preferentially protected, and which beds lose flow?", "correct": "Brain and myocardium are protected; skin and portal beds get less", "distractors": ["Kidneys and gut are protected; the brain and skin receive less", "Skin and skeletal muscle are protected; the heart receives less", "All vascular beds lose flow equally until the pressure is restored"], "exp": "Sequence: haemorrhage, reduced venous return, reduced stroke volume and cardiac output, reduced arterial pressure, compensatory vasoconstriction, and preferential preservation of brain and heart perfusion. This is why the skin becomes cool and pale."}];
const KEY = "hesham_y3_w00A_best";
const $ = id => document.getElementById(id);
const topics = [...new Set(BANK.map(q => q.topic))];
let mode = "practice", count = 0, set = [], idx = 0, answers = [], tick = null, left = 0;

function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function esc(s){return s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]))}
function best(){try{return JSON.parse(localStorage.getItem(KEY))||{}}catch(e){return {}}}
function saveBest(b){try{localStorage.setItem(KEY,JSON.stringify(b))}catch(e){}}
function show(id){["start","quiz","done"].forEach(s=>$(s).classList.toggle("hidden",s!==id));window.scrollTo(0,0)}

function drawStart(){
  const b = best();
  $("topics").innerHTML = topics.map((t,i)=>{
    const n = BANK.filter(q=>q.topic===t).length;
    const last = b[t]!=null ? "best "+b[t]+"%" : "not tried yet";
    return `<label class="topic"><input type="checkbox" value="${i}" checked><span class="name">${esc(t)}</span><span class="meta">${n} questions, ${last}</span></label>`;
  }).join("");
  setNote();
}
function setNote(){
  $("modeNote").textContent = mode==="practice"
    ? "Practice: you see the right answer and the explanation after each question."
    : "Exam: timed at 72 seconds per question, like the real paper. Answers and explanations come at the end.";
}
function pick(group, btn, attr){[...$(group).children].forEach(b=>b.setAttribute("aria-pressed", b===btn));return btn.dataset[attr]}
$("count").onclick = e => {if(e.target.tagName==="BUTTON") count = +pick("count", e.target, "n")};
$("mode").onclick = e => {if(e.target.tagName==="BUTTON"){mode = pick("mode", e.target, "m"); setNote()}};

function begin(pool){
  set = pool.map(q => ({q, opts: shuffle([q.correct, ...q.distractors])}));
  idx = 0; answers = new Array(set.length).fill(null);
  $("qt").textContent = set.length;
  $("strip").innerHTML = set.map(()=>"<i></i>").join("");
  clearInterval(tick);
  if(mode==="exam"){
    left = set.length*72; $("timer").classList.remove("hidden"); paintTimer();
    tick = setInterval(()=>{left--; paintTimer(); if(left<=0) finish()},1000);
  } else $("timer").classList.add("hidden");
  show("quiz"); drawQ();
}
function paintTimer(){const m=Math.floor(left/60),s=left%60;$("timer").textContent=m+":"+String(s).padStart(2,"0");$("timer").classList.toggle("low",left<60)}

$("go").onclick = () => {
  const chosen = [...document.querySelectorAll("#topics input:checked")].map(i=>topics[+i.value]);
  if(!chosen.length){alert("Pick at least one lecture.");return}
  let pool = shuffle(BANK.filter(q=>chosen.includes(q.topic)));
  if(count && count<pool.length) pool = pool.slice(0,count);
  begin(pool);
};

function drawQ(){
  const {q,opts} = set[idx]; let sel = null, locked = false;
  $("qn").textContent = idx+1; $("qtag").textContent = q.topic; $("stem").textContent = q.stem; $("exp").innerHTML = "";
  [...$("strip").children].forEach((el,i)=>{
    const a = answers[i];
    el.className = i===idx ? "now" : a==null ? "" : mode==="exam" ? "done" : (a===set[i].q.correct ? "ok" : "no");
  });
  const nx = $("next"); nx.disabled = true;
  nx.textContent = mode==="practice" ? "Check answer" : (idx===set.length-1 ? "Finish exam" : "Next question");
  $("opts").innerHTML = opts.map((o,i)=>`<button class="opt" data-i="${i}"><span class="k">${"ABCDE"[i]}</span><span>${esc(o)}</span></button>`).join("");
  const btns = [...$("opts").children];
  btns.forEach(b => b.onclick = () => {
    if(locked) return; sel = opts[+b.dataset.i];
    btns.forEach(x=>x.classList.toggle("sel",x===b)); nx.disabled = false;
  });
  nx.onclick = () => {
    if(mode==="practice" && !locked){
      locked = true; answers[idx] = sel; const ok = sel===q.correct;
      btns.forEach(b=>{const o=opts[+b.dataset.i]; b.disabled=true; b.classList.remove("sel");
        if(o===q.correct) b.classList.add("right"); else if(o===sel) b.classList.add("bad")});
      $("exp").innerHTML = `<div class="exp ${ok?"":"no"}"><b class="verdict">${ok?"Correct.":"Not this time."}</b>${esc(q.exp)}<span class="src">From: ${esc(q.source)}</span></div>`;
      $("strip").children[idx].className = ok?"ok":"no";
      nx.textContent = idx===set.length-1 ? "See my result" : "Next question";
      return;
    }
    if(mode==="exam") answers[idx] = sel;
    if(idx===set.length-1) finish(); else {idx++; drawQ(); window.scrollTo(0,0)}
  };
}
$("quit").onclick = () => {if(confirm("End the quiz now and see your result?")) finish()};

function finish(){
  clearInterval(tick);
  const total = set.length, right = set.filter((s,i)=>answers[i]===s.q.correct).length;
  const pct = Math.round(100*right/total);
  $("score").textContent = right+" / "+total;
  $("scoreNote").textContent = pct+"%. " + (pct>=85 ? "Strong. Keep these lectures warm with a short retry next week."
    : pct>=65 ? "Good base. Go through the review list below, then retry the missed ones."
    : "Read the high yield sheet for the weak lectures first, then come back.");
  const b = best();
  $("byTopic").innerHTML = topics.filter(t=>set.some(s=>s.q.topic===t)).map(t=>{
    const items = set.map((s,i)=>[s,i]).filter(([s])=>s.q.topic===t);
    const r = items.filter(([s,i])=>answers[i]===s.q.correct).length, p = Math.round(100*r/items.length);
    if(items.length>=5 && (b[t]==null || p>b[t])) b[t]=p;
    return `<div class="row"><span>${esc(t)}</span><strong>${r} / ${items.length}</strong><div class="track"><span class="${p<65?"weak":""}" style="width:${p}%"></span></div></div>`;
  }).join("");
  saveBest(b);
  const missed = set.map((s,i)=>[s,i]).filter(([s,i])=>answers[i]!==s.q.correct);
  $("retry").classList.toggle("hidden", !missed.length);
  $("revTitle").textContent = missed.length ? "Questions to review ("+missed.length+")" : "Nothing to review. All correct.";
  $("reviews").innerHTML = missed.map(([s,i])=>`<div class="review"><span class="tag">${esc(s.q.topic)}</span>
    <div class="stem">${esc(s.q.stem)}</div>
    <p class="you">${answers[i]==null?"You left this one blank.":"You chose: "+esc(answers[i])}</p>
    <p class="ans">Answer: ${esc(s.q.correct)}</p><p>${esc(s.q.exp)}</p></div>`).join("");
  $("retry").onclick = () => {mode="practice"; begin(shuffle(missed.map(([s])=>s.q)))};
  show("done");
}
$("home").onclick = () => {[...$("mode").children].forEach(b=>b.setAttribute("aria-pressed", b.dataset.m===mode)); drawStart(); show("start")};
drawStart();
</script>
