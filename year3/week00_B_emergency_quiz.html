<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Year 3 Week 00 B: Emergency quiz</title>
<style>
:root{
  --paper:#EEF4F2; --card:#FFFFFF; --ink:#0F2A33; --soft:#4C666E; --line:#C9D8D4;
  --scrub:#1B7567; --scrub-dark:#125548; --scrub-tint:#DCEEEA;
  --wrong:#B23A30; --wrong-tint:#F7E3E0; --amber:#B7790C;
  --ui:"Avenir Next","Segoe UI",system-ui,-apple-system,Roboto,sans-serif;
  --read:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
}
@media (prefers-color-scheme:dark){
  :root{--paper:#0C1F25;--card:#132E36;--ink:#E6F0EE;--soft:#9DB5B8;--line:#27474F;
  --scrub:#4FB8A5;--scrub-dark:#7FD3C3;--scrub-tint:#17403F;--wrong:#E8867C;--wrong-tint:#42211F;--amber:#E0A93F;}
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--ui);line-height:1.5;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
.wrap{max-width:760px;margin:0 auto;padding:20px 18px 60px}
h1{font-family:var(--read);font-weight:600;font-size:2rem;line-height:1.15;margin:18px 0 6px;letter-spacing:-.01em}
h2{font-size:1.05rem;margin:26px 0 10px}
p.lead{color:var(--soft);margin:0 0 8px;max-width:60ch}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible,label:focus-within{outline:3px solid var(--amber);outline-offset:2px}
.hidden{display:none!important}

/* start screen */
.topic{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);
  border-radius:10px;padding:13px 14px;margin-bottom:8px}
.topic input{width:22px;height:22px;accent-color:var(--scrub);flex:none}
.topic .name{flex:1;font-weight:600}
.topic .meta{color:var(--soft);font-size:.86rem;white-space:nowrap}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--card)}
.seg button{flex:1;border:0;background:none;padding:12px 8px;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--scrub);color:#fff;font-weight:600}
.note{color:var(--soft);font-size:.9rem;margin:8px 0 0}
.primary{display:block;width:100%;margin-top:26px;border:0;border-radius:12px;background:var(--scrub);
  color:#fff;font-weight:700;font-size:1.08rem;padding:16px}
.primary:active{background:var(--scrub-dark)}
.primary:disabled{opacity:.45}
.ghost{background:none;border:1px solid var(--line);border-radius:10px;padding:11px 16px}

/* count strip: one mark per question */
.strip{display:flex;gap:2px;margin:6px 0 18px;height:12px}
.strip i{flex:1;border-radius:2px;background:var(--line);min-width:2px}
.strip i.ok{background:var(--scrub)} .strip i.no{background:var(--wrong)}
.strip i.done{background:var(--soft)} .strip i.now{background:var(--amber);transform:scaleY(1.5)}
.bar{display:flex;justify-content:space-between;align-items:center;gap:12px;color:var(--soft);font-size:.92rem}
.bar strong{color:var(--ink)}
.timer{font-variant-numeric:tabular-nums;font-weight:700;color:var(--ink)}
.timer.low{color:var(--wrong)}

/* question */
.tag{display:inline-block;background:var(--scrub-tint);color:var(--scrub-dark);border-radius:6px;
  padding:3px 9px;font-size:.82rem;font-weight:600}
.stem{font-family:var(--read);font-size:1.28rem;line-height:1.5;margin:14px 0 18px;max-width:62ch}
.opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;background:var(--card);
  border:1.5px solid var(--line);border-radius:12px;padding:14px;margin-bottom:10px;min-height:54px}
.opt .k{flex:none;width:28px;height:28px;border-radius:50%;border:1.5px solid var(--line);
  display:grid;place-items:center;font-weight:700;font-size:.88rem;color:var(--soft)}
.opt.sel{border-color:var(--scrub);background:var(--scrub-tint)}
.opt.sel .k{background:var(--scrub);border-color:var(--scrub);color:#fff}
.opt.right{border-color:var(--scrub);background:var(--scrub-tint)}
.opt.right .k{background:var(--scrub);border-color:var(--scrub);color:#fff}
.opt.bad{border-color:var(--wrong);background:var(--wrong-tint)}
.opt.bad .k{background:var(--wrong);border-color:var(--wrong);color:#fff}
.opt:disabled{cursor:default;color:inherit;opacity:1}
.exp{border-left:4px solid var(--scrub);background:var(--card);border-radius:0 10px 10px 0;
  padding:14px 16px;margin:16px 0 0}
.exp.no{border-left-color:var(--wrong)}
.exp b.verdict{display:block;margin-bottom:4px}
.exp .src{display:block;margin-top:8px;color:var(--soft);font-size:.86rem}
.actions{display:flex;gap:10px;margin-top:20px}
.actions .primary{margin-top:0}

/* results */
.score{font-family:var(--read);font-size:3.2rem;line-height:1;margin:10px 0 4px}
.row{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center;margin-bottom:12px}
.row .track{grid-column:1/-1;height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.row .track span{display:block;height:100%;background:var(--scrub)}
.row .track span.weak{background:var(--wrong)}
.review{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:10px}
.review .stem{font-size:1.06rem;margin:8px 0 10px}
.review p{margin:4px 0}
.review .you{color:var(--wrong)} .review .ans{color:var(--scrub-dark);font-weight:600}
@media (max-width:480px){h1{font-size:1.6rem}.stem{font-size:1.14rem}}
@media (prefers-reduced-motion:no-preference){.strip i{transition:background .2s,transform .2s}}
</style>
</head>
<body>
<div class="wrap">

<section id="start">
  <h1>Emergency medicine, week 00</h1>
  <p class="lead">Year 3, batch B. Questions are written from your own lecture slides and their clinical cases. Options are shuffled every time.</p>

  <h2>Pick the lectures</h2>
  <div id="topics"></div>

  <h2>How many questions</h2>
  <div class="seg" id="count">
    <button data-n="15">15</button><button data-n="30">30</button><button data-n="0" aria-pressed="true">All</button>
  </div>

  <h2>How to answer</h2>
  <div class="seg" id="mode">
    <button data-m="practice" aria-pressed="true">Practice</button><button data-m="exam">Exam</button>
  </div>
  <p class="note" id="modeNote"></p>

  <button class="primary" id="go">Start quiz</button>
</section>

<section id="quiz" class="hidden">
  <div class="bar"><span>Question <strong id="qn"></strong> of <strong id="qt"></strong></span>
    <span class="timer hidden" id="timer"></span>
    <button class="ghost" id="quit">End quiz</button></div>
  <div class="strip" id="strip"></div>
  <span class="tag" id="qtag"></span>
  <div class="stem" id="stem"></div>
  <div id="opts"></div>
  <div id="exp"></div>
  <div class="actions"><button class="primary" id="next" disabled>Check answer</button></div>
</section>

<section id="done" class="hidden">
  <h1>Your result</h1>
  <div class="score" id="score"></div>
  <p class="lead" id="scoreNote"></p>
  <h2>By lecture</h2>
  <div id="byTopic"></div>
  <div class="actions">
    <button class="primary" id="retry">Retry the ones I missed</button>
    <button class="ghost" id="home">Back to start</button>
  </div>
  <h2 id="revTitle">Questions to review</h2>
  <div id="reviews"></div>
</section>

</div>
<script>
const BANK = [{"topic": "Oxygen and hypoxia", "source": "VM-EM002.1 Oxygen and hypoxia", "stem": "What does the \"oxygen cascade\" describe?", "correct": "The progressive fall in PO2 from the atmosphere down to the mitochondria", "distractors": ["The progressive rise in PO2 from the alveoli to the arterial blood", "The stepwise binding of four oxygen molecules to one haemoglobin", "The increase in oxygen content that follows a rise in haemoglobin"], "exp": "Oxygen moves down a partial pressure gradient, from high PO2 to low PO2. In the lungs it is humidified, mixed with other gases and exchanged with CO2; in the tissues it is continuously extracted and consumed. So PO2 falls at every step: atmosphere, alveoli, blood, tissue, mitochondria."}, {"topic": "Oxygen and hypoxia", "source": "VM-EM002.1 Oxygen and hypoxia", "stem": "Which law states that the total pressure of a gas mixture equals the sum of the partial pressures of its gases?", "correct": "Dalton's law", "distractors": ["Boyle's law", "Henry's law", "Fick's law"], "exp": "Dalton's law explains the partial pressure of oxygen in air: oxygen is about 21% of atmospheric air, so it contributes about 21% of the total pressure."}, {"topic": "Oxygen and hypoxia", "source": "VM-EM002.1 Oxygen and hypoxia", "stem": "How is most oxygen carried in the blood?", "correct": "Bound reversibly to haemoglobin, with very little dissolved in plasma", "distractors": ["Dissolved in the plasma, with very little bound to haemoglobin", "Bound irreversibly to haemoglobin until it reaches the mitochondria", "Carried in equal amounts by haemoglobin and by plasma proteins"], "exp": "Adult haemoglobin (HbA) has 2 alpha and 2 beta chains and binds 4 oxygen molecules. The binding is reversible: oxygen is picked up in the lungs and released in the tissues. Dissolved oxygen is only a small contribution (0.003 x PaO2)."}, {"topic": "Oxygen and hypoxia", "source": "VM-EM002.1 Oxygen and hypoxia", "stem": "Patient A has Hb 15 g/dL and SpO2 98%. Patient B has Hb 7 g/dL and SpO2 98%. Who carries more oxygen in the blood, and why?", "correct": "Patient A, because oxygen content depends on haemoglobin too", "distractors": ["Both carry the same, because the oxygen saturation is identical", "Patient B, because a low haemoglobin binds oxygen more tightly", "It cannot be known without measuring the PaO2 in both patients"], "exp": "CaO2 = (1.34 x Hb x SaO2) + (0.003 x PaO2). With the same saturation, the patient with half the haemoglobin carries roughly half the oxygen. Key message: a normal SpO2 does not always mean normal oxygen delivery."}, {"topic": "Oxygen and hypoxia", "source": "VM-EM002.1 Oxygen and hypoxia", "stem": "Oxygen delivery (DO2) to the tissues equals which of the following?", "correct": "Arterial oxygen content multiplied by cardiac output", "distractors": ["Oxygen saturation multiplied by the respiratory rate", "Haemoglobin multiplied by the inspired oxygen fraction", "Arterial PO2 multiplied by the mean arterial pressure"], "exp": "DO2 = CaO2 x cardiac output. So delivery falls if haemoglobin is low, saturation is low, or cardiac output is low. In haemorrhagic shock the lungs may work normally and the tissues still starve: oxygenation is not only a lung problem."}, {"topic": "Oxygen and hypoxia", "source": "VM-EM002.1 Oxygen and hypoxia", "stem": "What is the difference between hypoxaemia and hypoxia?", "correct": "Hypoxaemia is low oxygen in arterial blood; hypoxia is too little oxygen in the tissues", "distractors": ["Hypoxaemia is too little oxygen in the tissues; hypoxia is low oxygen in arterial blood", "They mean exactly the same thing, so the two words can be used interchangeably", "Hypoxaemia is a low haemoglobin concentration; hypoxia is a low oxygen saturation"], "exp": "They are not the same. Hypoxaemia can cause hypoxia (for example pneumonia), but hypoxia can exist with a normal PaO2 and SpO2, as in severe anaemia, shock and cyanide poisoning."}, {"topic": "Oxygen and hypoxia", "source": "VM-EM002.1 Oxygen and hypoxia", "stem": "In cyanide poisoning, oxygen reaches the tissues but the cells cannot use it. Which type of hypoxia is this?", "correct": "Histotoxic hypoxia", "distractors": ["Hypoxic hypoxia", "Anaemic hypoxia", "Circulatory hypoxia"], "exp": "The four types: hypoxic (low PaO2, a lung or inspired gas problem), anaemic (low haemoglobin or haemoglobin that cannot carry oxygen), circulatory or ischaemic (low cardiac output, as in shock), and histotoxic (cells cannot use oxygen). In histotoxic hypoxia the SpO2 may be normal."}, {"topic": "Oxygen and hypoxia", "source": "VM-EM002.1 Oxygen and hypoxia", "stem": "A patient with pulmonary fibrosis is hypoxaemic. Which mechanism of hypoxaemia does fibrosis represent?", "correct": "Diffusion impairment across the alveolar capillary membrane", "distractors": ["Hypoventilation from a depressed respiratory centre", "Low inspired oxygen from a fall in barometric pressure", "A pure shunt through lung that is not ventilated at all"], "exp": "The four respiratory causes of hypoxaemia: low inspired O2 (altitude), hypoventilation (central such as opioids, airway obstruction, neuromuscular such as spinal cord injury, chest wall such as obesity), diffusion impairment (fibrosis, pulmonary oedema) and V/Q mismatch or shunt."}, {"topic": "Oxygen and hypoxia", "source": "VM-EM002.1 Oxygen and hypoxia", "stem": "What is the difference between V/Q mismatch and shunt?", "correct": "In V/Q mismatch airflow is restricted with normal perfusion; in shunt blood passes lung that is not ventilated at all", "distractors": ["In V/Q mismatch blood passes lung that is not ventilated at all; in shunt airflow is only restricted", "In V/Q mismatch the perfusion is absent with normal airflow; in shunt both airflow and perfusion are absent", "In V/Q mismatch the diffusion membrane is thickened; in shunt the barometric pressure is reduced"], "exp": "V/Q mismatch: restricted airflow with normal perfusion. Shunt: airflow is bypassed completely, so blood flows past entirely non-ventilated lung and returns without picking up oxygen."}, {"topic": "Oxygen and hypoxia", "source": "VM-EM002.1 Oxygen and hypoxia", "stem": "A patient with an opioid overdose has SpO2 96% on oxygen and a respiratory rate of 6/min. Which statement is correct?", "correct": "He is not safe: the saturation is corrected but hypoventilation remains", "distractors": ["He is safe: a saturation of 96% proves that his ventilation is adequate", "He is safe as long as the oxygen flow is kept running at the same rate", "He is not safe: the pulse oximeter is always wrong in opioid overdose"], "exp": "This is the opioid paradox. Oxygenation (is enough oxygen entering the blood?) and ventilation (is the patient moving enough air and removing CO2?) are separate processes. Supplemental oxygen can mask a fatal hypoventilation. Oxygen does not equal ventilation."}, {"topic": "Oxygen and hypoxia", "source": "VM-EM002.1 Oxygen and hypoxia", "stem": "Why can a patient with carbon monoxide poisoning show SpO2 98% while the tissues are suffocating?", "correct": "Pulse oximetry cannot tell oxyhaemoglobin from carboxyhaemoglobin", "distractors": ["Carbon monoxide raises the amount of oxygen dissolved in plasma", "Carbon monoxide increases cardiac output and oxygen delivery", "Pulse oximetry measures the PaCO2, which stays normal"], "exp": "This is the carbon monoxide trap. The oximeter also does NOT measure PaCO2 or pH, haemoglobin concentration (so it misses anaemic hypoxia) or cardiac output (so it misses ischaemic hypoxia). SpO2 is important, but it is not the whole patient."}, {"topic": "Oxygen and hypoxia", "source": "VM-EM002.1 Oxygen and hypoxia", "stem": "A 70-year-old man with COPD has SpO2 82%. Which oxygen saturation target is appropriate?", "correct": "88 to 92%, with blood gases checked", "distractors": ["94 to 98%, the same as any adult", "100%, using uncontrolled high flow", "80 to 85%, to protect his drive"], "exp": "Oxygen is a drug: prescribe, target, monitor. Target 94 to 98% for most acutely ill adults and 88 to 92% for patients at risk of hypercapnic respiratory failure. Do not give uncontrolled high oxygen indefinitely in COPD, but never delay treatment of life threatening hypoxaemia: correct it first, assess ABCDE, treat the cause, then titrate."}, {"topic": "Oxygen and hypoxia", "source": "VM-EM002.1 Oxygen and hypoxia", "stem": "Which device delivers a prescribed, fixed oxygen concentration whatever the patient's breathing pattern?", "correct": "Venturi (HAFOE) mask", "distractors": ["Nasal prongs", "Simple variable performance mask", "Hudson mask with non-rebreathing bag"], "exp": "The Venturi mask (High Air Flow Oxygen Enrichment) is a fixed performance device. Nasal prongs at 2 L/min give about 24 to 35%. A variable performance mask gives about 35 to 60%. A non-rebreathing bag mask gives 60 to 80% or more and is for short term use."}, {"topic": "Oxygen and hypoxia", "source": "VM-EM002.1 Oxygen and hypoxia", "stem": "According to the lecture, what is the only way to deliver 100% oxygen?", "correct": "An anaesthetic mask with a circuit", "distractors": ["A Venturi mask at its highest setting", "A Hudson mask with a non-rebreathing bag", "Nasal prongs at the highest flow rate"], "exp": "A non-rebreathing bag mask reaches 60 to 80% or more, but not 100%. Only a tight fitting anaesthetic mask with a circuit delivers 100% oxygen."}, {"topic": "Oxygen and hypoxia", "source": "VM-EM002.1 Oxygen and hypoxia", "stem": "Which sign of inadequate oxygenation does the lecture call unreliable?", "correct": "Cyanosis", "distractors": ["Increased respiratory rate", "Increased pulse rate", "Confusion or agitation"], "exp": "Signs of inadequate oxygenation: raised respiratory rate, raised pulse rate, confusion, agitation or reduced conscious level, and cyanosis, which is unreliable. Monitoring uses clinical observation, pulse oximetry and arterial blood gases."}, {"topic": "Oxygen and hypoxia", "source": "VM-EM002.1 Oxygen and hypoxia", "stem": "Which of the following is a recognised danger of oxygen therapy?", "correct": "Respiratory depression (CO2 narcosis)", "distractors": ["Respiratory alkalosis with tetany", "Hyperchloraemic metabolic acidosis", "Left shift of the dissociation curve"], "exp": "Dangers of oxygen: toxicity to lung, brain and eye; respiratory depression (CO2 narcosis); drying effect; and fire hazard. Facial burns and deaths have been reported when patients smoke during oxygen therapy."}, {"topic": "Oxygen and hypoxia", "source": "VM-EM002.1 Oxygen and hypoxia", "stem": "Which change shifts the oxyhaemoglobin dissociation curve to the RIGHT, so that oxygen is released more easily to the tissues?", "correct": "A rise in PCO2, hydrogen ions, temperature or 2,3-DPG", "distractors": ["A fall in PCO2, hydrogen ions, temperature or 2,3-DPG", "The presence of fetal haemoglobin or carboxyhaemoglobin", "A rise in pH together with a fall in body temperature"], "exp": "Right shift means lower oxygen affinity and more unloading: raised PCO2, H+ (lower pH), temperature and DPG. Left shift means higher affinity and less unloading: the opposite changes, plus methaemoglobin, carboxyhaemoglobin and fetal haemoglobin. The normal P50 is about 27 mmHg."}, {"topic": "Hydration assessment", "source": "VM-EM003.1 Hydration assessment", "stem": "In the WIPER opening of the fluid balance examination, how should the patient be positioned?", "correct": "Reclined at 45 degrees", "distractors": ["Lying completely flat", "Sitting upright at 90 degrees", "Lying on the left side"], "exp": "WIPER: Wash hands, Introduce yourself, ask Permission, Expose (remove top and bottom, leave underwear), Reposition at 45 degrees. The patient is laid flat only later, for the abdomen."}, {"topic": "Hydration assessment", "source": "VM-EM003.1 Hydration assessment", "stem": "When checking for a postural drop, how long should you wait after standing the patient before taking the blood pressure?", "correct": "3 minutes", "distractors": ["30 seconds", "1 minute", "10 minutes"], "exp": "Take the lying blood pressure, stand the patient, wait 3 minutes, then measure again. If the patient is too dizzy to stand, compare lying and sitting."}, {"topic": "Hydration assessment", "source": "VM-EM003.1 Hydration assessment", "stem": "Which result counts as a significant postural drop in blood pressure?", "correct": "A fall of more than 20 mmHg systolic or more than 10 mmHg diastolic", "distractors": ["A fall of more than 10 mmHg systolic or more than 20 mmHg diastolic", "A fall of more than 5 mmHg systolic or more than 5 mmHg diastolic", "Any fall in systolic pressure with a rise in the heart rate"], "exp": "A postural drop (more than 20 systolic or more than 10 diastolic) suggests hypovolaemia. The matching questions in the history are: do you feel thirsty, do you feel dizzy on standing, any vomiting or diarrhoea?"}, {"topic": "Hydration assessment", "source": "VM-EM003.1 Hydration assessment", "stem": "In the lecture, above what vertical height is the JVP considered raised?", "correct": "More than 4 cm", "distractors": ["More than 1 cm", "More than 2 cm", "More than 8 cm"], "exp": "The JVP is an estimate of central venous pressure and is raised if more than 4 cm in vertical height. In the example of a normal patient it was 3 cm above the sternal angle; in the fluid overloaded patient it was 8 cm; in the dehydrated patient it was not visible."}, {"topic": "Hydration assessment", "source": "VM-EM003.1 Hydration assessment", "stem": "During abdominojugular reflux testing, the JVP stays visible for more than 15 seconds. What does this suggest?", "correct": "Right heart failure", "distractors": ["Dehydration", "Normal venous pressure", "Aortic stenosis"], "exp": "Pressure on the abdomen normally raises the JVP only briefly. If it stays up for more than 15 seconds this points to right heart failure. Large v waves point to tricuspid regurgitation and fluid overload."}, {"topic": "Hydration assessment", "source": "VM-EM003.1 Hydration assessment", "stem": "Which set of findings matches DEHYDRATION?", "correct": "BP 95/60, HR 110, cool peripheries, capillary refill 4 seconds, JVP not visible, urine 20 ml/hr", "distractors": ["BP 140/85, HR 70, warm peripheries, oedema to mid calf and sacrum, JVP 8 cm, urine 50 ml/hr", "BP 120/80, HR 72, warm peripheries, capillary refill under 2 seconds, JVP 3 cm, moist mouth", "BP 140/85, RR 30, SpO2 94%, bibasal crepitations, moderate ascites and agitation"], "exp": "Dehydration: low pressure, tachycardia, cool peripheries, slow capillary refill, invisible JVP, clear chest, oliguria and drowsiness. Fluid overload: raised pressure, tachypnoea, lower saturation, peripheral and sacral oedema, JVP 8 cm, bibasal crepitations and ascites."}, {"topic": "Hydration assessment", "source": "VM-EM003.1 Hydration assessment", "stem": "Which finding on chest and back examination points to fluid OVERLOAD?", "correct": "A third heart sound with crackles at the lung bases and sacral oedema", "distractors": ["Reduced central skin turgor with a central capillary refill of 4 seconds", "Vesicular breath sounds with normal heart sounds and no added sounds", "A dry arm pit with sunken eyes and a thready peripheral pulse"], "exp": "On the chest you check central skin turgor and central capillary refill (dehydration), then listen for a third heart sound or tricuspid regurgitation and for basal crackles, and look at the sacrum for oedema (overload)."}, {"topic": "Hydration assessment", "source": "VM-EM003.1 Hydration assessment", "stem": "After finishing the fluid balance examination, which set of requests completes the assessment?", "correct": "Observation chart, fluid balance chart, daily weights, U&E and urinary sodium", "distractors": ["Chest X-ray, ECG, echocardiogram, and bloods for cardiac enzymes and troponin", "Observation chart, blood cultures, serum lactate, and a urinary catheter", "Arterial blood gas, CT of the abdomen, daily weights, and a stool chart"], "exp": "To finish: look at the observation chart and the fluid balance chart, ask for daily weights, and send FBC (if bleeding or infection is suspected), U&E (creatinine clearance, sodium), LFT (albumin) and urinary sodium."}, {"topic": "Hydration assessment", "source": "VM-EM003.1 Hydration assessment", "stem": "Using the lecture's method, what is the total daily maintenance fluid for a 70 kg adult?", "correct": "About 2680 ml (urine 1680 ml plus other losses 1000 ml)", "distractors": ["About 1000 ml (urine 500 ml plus other losses 500 ml)", "About 1680 ml (urine output only, other losses ignored)", "About 4200 ml (urine 3200 ml plus other losses 1000 ml)"], "exp": "Other losses are about 1000 ml: sweat 500, faeces 250, breathing 250. Urine output is 1 ml/kg/hr, so 70 ml/hr x 24 = 1680 ml. Total 2680 ml. This agrees with the NICE figure of 25 to 30 ml/kg/day."}, {"topic": "Hydration assessment", "source": "VM-EM003.1 Hydration assessment", "stem": "According to the lecture, how much of 1000 ml of 5% glucose stays in the intravascular compartment?", "correct": "About 111 ml (one ninth)", "distractors": ["About 333 ml (one third)", "About 667 ml (two thirds)", "All 1000 ml"], "exp": "Glucose is metabolised, leaving water that spreads through all compartments: two thirds (667 ml) goes into the cells and one third (333 ml) stays extracellular. Of that, one third (111 ml) stays in the vessels. That is why 5% glucose is useless for resuscitation."}, {"topic": "Hydration assessment", "source": "VM-EM003.1 Hydration assessment", "stem": "According to the lecture, how much of 1000 ml of 0.9% saline stays in the intravascular compartment?", "correct": "About 333 ml (one third)", "distractors": ["About 111 ml (one ninth)", "About 667 ml (two thirds)", "All 1000 ml"], "exp": "Saline stays in the extracellular space: none enters the cells. Two thirds (667 ml) moves into the interstitial fluid and one third (333 ml) remains in the vessels, where it supports blood pressure."}, {"topic": "Hydration assessment", "source": "VM-EM003.1 Hydration assessment", "stem": "According to the lecture, which fluid stays entirely in the intravascular compartment after infusion?", "correct": "Gelofusine (a colloid)", "distractors": ["Hartmann's solution", "0.9% sodium chloride", "5% glucose"], "exp": "The lecture's scheme: Gelofusine 100% intravascular, saline one third, glucose one ninth. Note that the Fluids lecture adds that modern NICE guidance still prefers balanced crystalloids, because synthetic colloids carry risks of kidney injury and allergy."}, {"topic": "Hydration assessment", "source": "VM-EM003.1 Hydration assessment", "stem": "A hypovolaemic adult needs fluid resuscitation. What is the correct first prescription under NICE guidance?", "correct": "500 ml of crystalloid (sodium 130 to 154 mmol/L) over 15 minutes", "distractors": ["1000 ml of 5% glucose given over 8 hours, then a repeat U&E", "250 ml of 4% gelatin colloid given over 60 minutes, then reassess", "2000 ml of crystalloid as one rapid bolus before any reassessment"], "exp": "Identify the deficit, give a 500 ml crystalloid bolus over 15 minutes, reassess, then give further boluses of 250 to 500 ml. Seek expert help if there are signs of shock or if more than 2000 ml has been given."}, {"topic": "Hydration assessment", "source": "VM-EM003.1 Hydration assessment", "stem": "Why are the patient's legs raised to 45 degrees during the assessment?", "correct": "To see whether pulse and pressure improve, predicting a response to fluid", "distractors": ["To drain oedema from the legs before the ankle circumference is measured", "To bring out a postural drop that was not present when the patient stood", "To make the JVP easier to see and measure at the root of the neck"], "exp": "A passive leg raise returns blood from the legs to the heart, like a small reversible fluid bolus. If pulse and pressure improve, the patient is likely to respond to fluid."}, {"topic": "Hydration assessment", "source": "VM-EM003.1 Hydration assessment", "stem": "In the NICE 5 Rs, which of the following is a cause of REDISTRIBUTION rather than of fluid loss needing replacement?", "correct": "Severe sepsis with gross oedema", "distractors": ["Vomiting and diarrhoea", "Pancreatic or jejunal fistula", "Polyuria"], "exp": "Replacement covers real losses: vomiting, diarrhoea, biliary drainage, haemorrhage, sweating and fever, fistula or stoma loss, polyuria. Redistribution means fluid in the wrong place: gross oedema, severe sepsis, sodium disorders, renal, liver and cardiac impairment, postoperative fluid retention, malnourishment and refeeding."}, {"topic": "Fluids and electrolytes", "source": "VM-EM003.1 Fluids and electrolytes", "stem": "In a 70 kg adult, how is the 42 litres of total body water divided?", "correct": "28 L intracellular and 14 L extracellular (11 L interstitial, 3 L plasma)", "distractors": ["14 L intracellular and 28 L extracellular (25 L interstitial, 3 L plasma)", "21 L intracellular and 21 L extracellular (14 L interstitial, 7 L plasma)", "28 L intracellular and 14 L extracellular (3 L interstitial, 11 L plasma)"], "exp": "Total body water is about 60% of body weight (range 45 to 75% with age, sex and body fat). ICF is 40% of body weight (two thirds of TBW). ECF is 20% (one third), split into interstitial fluid (three quarters, 11 L) and plasma (one quarter, 3 L)."}, {"topic": "Fluids and electrolytes", "source": "VM-EM003.1 Fluids and electrolytes", "stem": "In the simplified basal water balance of 2400 ml per day, which item supplies about 400 ml of the INPUT?", "correct": "Water produced by metabolism", "distractors": ["Water taken in food", "Water taken as drinks", "Water absorbed from the colon"], "exp": "Input: oral fluids 1500, food 500, metabolism 400. Output: urine 1500, skin 500, lungs 400, plus a small amount in stool."}, {"topic": "Fluids and electrolytes", "source": "VM-EM003.1 Fluids and electrolytes", "stem": "By how much do insensible water losses rise for every 1 C rise in core temperature above 37 C?", "correct": "About 10%", "distractors": ["About 1%", "About 25%", "About 50%"], "exp": "Insensible loss is the unmeasured loss of pure water through the skin (not sweating) and the respiratory tract, about 0.5 ml/kg/hr or 500 to 1000 ml a day. It rises about 10% per degree of fever, and also with tachypnoea, open abdominal surgery and burns."}, {"topic": "Fluids and electrolytes", "source": "VM-EM003.1 Fluids and electrolytes", "stem": "Which statement about sodium and potassium is correct?", "correct": "Sodium is the main extracellular cation (140 mmol/L); potassium is mainly intracellular (150 mmol/L)", "distractors": ["Potassium is the main extracellular cation (140 mmol/L); sodium is mainly intracellular (150 mmol/L)", "Sodium and potassium are both mainly extracellular and both cross the cell membrane freely", "Sodium needs are about 10 mmol/kg/day, while potassium needs are about 1 mmol/kg/day"], "exp": "Sodium is kept out of cells by the Na-K-ATPase. Potassium is predominantly intracellular. The daily need for each is about 1 mmol/kg/day."}, {"topic": "Fluids and electrolytes", "source": "VM-EM003.1 Fluids and electrolytes", "stem": "What are the NICE 5 Rs of intravenous fluid therapy?", "correct": "Resuscitation, Routine maintenance, Replacement, Redistribution, Reassessment", "distractors": ["Resuscitation, Rehydration, Restriction, Redistribution, Reassessment", "Recognition, Routine maintenance, Replacement, Referral, Review", "Resuscitation, Routine maintenance, Reperfusion, Recovery, Reassessment"], "exp": "The 5 Rs framework (NICE, intravenous fluid therapy in adults in hospital) is a structured way to prescribe fluids safely: ask which of the Rs the patient needs, and always reassess."}, {"topic": "Fluids and electrolytes", "source": "VM-EM003.1 Fluids and electrolytes", "stem": "Which prescription matches NICE routine maintenance requirements for 24 hours?", "correct": "Water 25 to 30 ml/kg, sodium and potassium about 1 mmol/kg each, glucose 50 to 100 g", "distractors": ["Water 50 to 60 ml/kg, sodium and potassium about 3 mmol/kg each, glucose 200 g", "Water 10 to 15 ml/kg, sodium about 5 mmol/kg, no potassium, glucose 50 to 100 g", "Water 25 to 30 ml/kg, sodium about 1 mmol/kg, no potassium and no glucose at all"], "exp": "Maintenance is for patients who cannot meet their needs orally or enterally but are otherwise stable with no ongoing losses. The glucose prevents starvation ketosis. If fluids are needed for more than 3 days, NG or enteral feeding is preferable."}, {"topic": "Fluids and electrolytes", "source": "VM-EM003.1 Fluids and electrolytes", "stem": "Using the 4-2-1 rule, what is the hourly maintenance fluid rate for a child weighing 25 kg?", "correct": "65 ml/hr", "distractors": ["45 ml/hr", "75 ml/hr", "100 ml/hr"], "exp": "Holliday-Segar: 4 ml/kg/hr for the first 10 kg (40), 2 ml/kg/hr for the second 10 kg (20), 1 ml/kg/hr for each kg above 20 (5). Total 65 ml/hr."}, {"topic": "Fluids and electrolytes", "source": "VM-EM003.1 Fluids and electrolytes", "stem": "A patient is losing large volumes through a nasogastric tube. Which replacement fluid best matches the loss?", "correct": "0.9% sodium chloride with added potassium", "distractors": ["5% glucose with no added electrolytes", "Hartmann's solution with added bicarbonate", "4% gelatin colloid with added calcium"], "exp": "Match the fluid to what is being lost. Gastric juice is rich in H+, chloride (about 140 mmol/L) and potassium, with no bicarbonate, so use saline with KCl. Diarrhoea and ileostomy losses are rich in bicarbonate and potassium, so use a balanced crystalloid such as Hartmann's."}, {"topic": "Fluids and electrolytes", "source": "VM-EM003.1 Fluids and electrolytes", "stem": "What is \"third spacing\"?", "correct": "Fluid shifting out of vessels and cells into areas where it cannot be used", "distractors": ["Fluid moving from the interstitial space back into the vessels in recovery", "Fluid lost from the body through a fistula, a stoma or a surgical drain", "Fluid moving from the vessels into the cells after 5% glucose is given"], "exp": "This is the Redistribution R: the patient may be intravascularly depleted while grossly oedematous. Common causes are sepsis, decompensated cirrhosis, heart failure, nephrotic syndrome and major abdominal surgery."}, {"topic": "Fluids and electrolytes", "source": "VM-EM003.1 Fluids and electrolytes", "stem": "Which test results support a diagnosis of dehydration?", "correct": "Raised haematocrit, urea and albumin, with urine osmolality above 500 and urine sodium 15 or less", "distractors": ["Low haematocrit, urea and albumin, with urine osmolality below 300 and urine sodium above 40", "Raised haematocrit and albumin, with a dilute urine of specific gravity below 1.005", "Normal haematocrit and urea, with urine osmolality below 100 and urine sodium above 100"], "exp": "The blood becomes concentrated and the kidney holds on to water and sodium: urine specific gravity 1.020 or more, osmolality above 500, sodium 15 mmol/L or less. Clinical signs: reduced turgor, dry mucosae, tachycardia, hypotension, oliguria and low CVP."}, {"topic": "Fluids and electrolytes", "source": "VM-EM003.1 Fluids and electrolytes", "stem": "What does the oesophageal Doppler measure to guide fluid administration?", "correct": "Stroke volume and its response to a fluid challenge", "distractors": ["Central venous pressure and its response to diuretics", "Urine output and its response to a fluid challenge", "Plasma osmolality and its response to 5% glucose"], "exp": "The probe measures blood flow by ultrasound. Give a fluid challenge: if stroke volume rises, give more; if it does not, stop and monitor. The aim is just enough fluid to keep the vessels filled, without excess."}, {"topic": "Fluids and electrolytes", "source": "VM-EM003.1 Fluids and electrolytes", "stem": "Why is 0.9% saline no longer the first choice resuscitation fluid?", "correct": "Its high chloride (154 mmol/L) can cause a hyperchloraemic metabolic acidosis", "distractors": ["Its high potassium (5 mmol/L) can cause a dangerous hyperkalaemia in the patient", "Its glucose is quickly metabolised, so the water moves rapidly into the cells", "Its large molecules can impair coagulation and also cause allergic reactions"], "exp": "Normal saline contains sodium 154 and chloride 154 mmol/L, much more chloride than plasma (about 100). Hartmann's (sodium 131, chloride 111, potassium 5, calcium and lactate) is closer to plasma and is the first line choice for resuscitation, trauma and surgical patients."}, {"topic": "Fluids and electrolytes", "source": "VM-EM003.1 Fluids and electrolytes", "stem": "In Hartmann's solution (Ringer's lactate), what happens to the lactate?", "correct": "It is converted to bicarbonate", "distractors": ["It is excreted unchanged in urine", "It is converted to chloride", "It is stored as liver glycogen"], "exp": "Hartmann's contains sodium 131, chloride 111, potassium 5, calcium and lactate. The lactate is converted to bicarbonate, which is why its electrolyte profile closely mimics plasma."}, {"topic": "Fluids and electrolytes", "source": "VM-EM003.1 Fluids and electrolytes", "stem": "How do colloids keep fluid in the intravascular space?", "correct": "Their large molecules cannot cross healthy capillary walls and raise oncotic pressure", "distractors": ["Their small molecules cross capillary walls freely and raise hydrostatic pressure", "Their glucose is metabolised, which leaves free water inside the vessels", "Their high sodium content pulls water out of the cells by osmosis"], "exp": "Crystalloids contain small molecules (salts or sugars) that pass freely into the tissues, so only a fraction stays in the vessels. Colloids contain large molecules such as albumin, gelatin or starch. NICE still favours balanced crystalloids, and synthetic colloids are generally avoided because of kidney injury and allergic reactions."}, {"topic": "Fluids and electrolytes", "source": "VM-EM003.1 Fluids and electrolytes", "stem": "Which statement about hydroxyethyl starches, compared with gelatins, is correct?", "correct": "They are larger, made from amylopectin, can impair coagulation and cost more", "distractors": ["They are smaller, made from animal collagen, and are the least expensive colloid", "They are natural human proteins that carry no risk at all to coagulation", "They are crystalloids that spread evenly through all the body compartments"], "exp": "Gelatins are polypeptides from degraded animal collagen, relatively small (molecular weight about 30,000) and inexpensive: Gelofusine is 4% succinylated gelatin, Haemaccel is 3.5% urea-linked gelatin. Starches are synthetic polymers of 250,000 to 450,000 Daltons with a low incidence of allergy."}, {"topic": "Fluids and electrolytes", "source": "VM-EM003.1 Fluids and electrolytes", "stem": "After an operation, the stress response changes fluid and electrolyte handling. What is the expected pattern?", "correct": "Retention of water and sodium, with loss of potassium and nitrogen", "distractors": ["Loss of water and sodium, with retention of potassium and nitrogen", "Retention of water and potassium, with loss of sodium and chloride", "Loss of water, sodium, potassium and nitrogen all together"], "exp": "Stress releases ADH, aldosterone and cortisol. The lecture also gives a haemoglobin below 8 g/dL as the general trigger for blood transfusion when losses are large."}, {"topic": "Fluids and electrolytes", "source": "VM-EM003.1 Fluids and electrolytes", "stem": "Which statement best reflects the lecture's key message on fluid therapy?", "correct": "Estimate the requirement, give some fluid, observe the response and review regularly", "distractors": ["Calculate the exact deficit with detailed formulas before any fluid is started", "Give a fixed 3 litres a day to every adult and review only if problems appear", "Avoid all intravenous fluid until the urine output falls below 10 ml/hr"], "exp": "Fluid therapy is a dynamic process that needs ongoing evaluation. Use moderation and common sense, and review progress. Oliguria, hypotension and tachycardia mean act swiftly. IV fluids should be reviewed at least daily and stopped as soon as the oral or enteral route is adequate."}, {"topic": "Analgesia", "source": "VM-EM004.1 Analgesia", "stem": "How does the International Association for the Study of Pain define pain?", "correct": "An unpleasant sensory and emotional experience associated with actual or potential tissue damage", "distractors": ["An unpleasant sensory experience that is always proportional to the amount of tissue damage", "A reflex response of nociceptors that can be measured objectively by the examiner", "An emotional reaction that occurs only when tissue damage can be demonstrated"], "exp": "Pain is both sensory and emotional, and tissue damage may be actual or only potential. McCaffery (1968) added the clinical rule: pain is whatever the person says it is, existing whenever the person says it does."}, {"topic": "Analgesia", "source": "VM-EM004.1 Analgesia", "stem": "What is the correct order of the four steps in pain physiology?", "correct": "Transduction, transmission, perception, modulation", "distractors": ["Transmission, transduction, modulation, perception", "Perception, transduction, transmission, modulation", "Modulation, perception, transduction, transmission"], "exp": "Transduction happens at the nociceptors. Transmission travels in A delta fibres (fast) and C fibres (slow). Perception occurs in the thalamus, limbic system and cortex. Modulation is by descending inhibitory pathways."}, {"topic": "Analgesia", "source": "VM-EM004.1 Analgesia", "stem": "Which substances stimulate and sensitise nociceptor nerve endings at a site of injury?", "correct": "Prostaglandins, potassium, histamine and bradykinin", "distractors": ["GABA, glycine, endorphins and enkephalins", "Sodium, calcium, insulin and cortisol", "Acetylcholine, dopamine, serotonin and adrenaline"], "exp": "Nociceptors detect damage from injury, temperature, chemical and mechanical stimuli. GABA and glycine are inhibitory transmitters in the spinal cord, part of modulation (the gate control theory acts at the dorsal horn)."}, {"topic": "Analgesia", "source": "VM-EM004.1 Analgesia", "stem": "A diabetic patient describes shooting, burning pain with numbness in both feet. Which type of pain is this?", "correct": "Neuropathic pain", "distractors": ["Somatic nociceptive pain", "Visceral nociceptive pain", "Acute superficial pain"], "exp": "Neuropathic pain comes from a lesion or dysfunction of the nervous system and is described as shooting or burning, with numbness. Chronic pain is pain persisting for more than 3 months that affects quality of life."}, {"topic": "Analgesia", "source": "VM-EM004.1 Analgesia", "stem": "Which is a recognised adverse physiological effect of untreated postoperative pain?", "correct": "Poor lung expansion leading to chest infection, and a higher risk of DVT", "distractors": ["Hypoventilation leading to respiratory acidosis, and a lower oxygen demand", "A reduced stress response with better immune function and earlier discharge", "Bradycardia and hypotension leading to a lower risk of myocardial infarction"], "exp": "Pain causes distress, hyperventilation (respiratory alkalosis), increased oxygen demand (risk of MI), reduced lung expansion and compliance, a greater neuroendocrine stress response, reduced immune function, delayed mobilisation, more DVT and a longer hospital stay."}, {"topic": "Analgesia", "source": "VM-EM004.1 Analgesia", "stem": "How often should pain be assessed and recorded on the ward?", "correct": "Every time the vital signs are taken, on the observation chart", "distractors": ["Once a day on the morning ward round, in the medical notes", "Only when the patient asks for analgesia, on the drug chart", "Only before discharge, in the discharge summary"], "exp": "Patient reporting tools include the verbal scale (mild, moderate, severe), the visual analogue scale (a 10 cm line) and the numerical rating scale (0 to 10). FLACC is a behavioural scale for patients who cannot report. Autonomic signs (BP, HR, RR) are physiological clues."}, {"topic": "Analgesia", "source": "VM-EM004.1 Analgesia", "stem": "What is the difference between analgesia, anaesthesia and sedation?", "correct": "Analgesia is relief from pain, anaesthesia is insensitivity to pain, sedation is a reduced level of consciousness", "distractors": ["Analgesia is insensitivity to pain, anaesthesia is relief from pain, sedation is loss of all reflexes", "Analgesia is a reduced level of consciousness, anaesthesia is relief from pain, sedation is muscle relaxation", "Analgesia is relief from anxiety, anaesthesia is loss of memory, sedation is insensitivity to pain"], "exp": "These three definitions are separate. Entonox is a good example: a strong analgesic but a weak anaesthetic."}, {"topic": "Analgesia", "source": "VM-EM004.1 Analgesia", "stem": "Which statement about paracetamol is correct?", "correct": "It inhibits prostaglandin synthesis in the CNS; the adult dose is 1 g every 6 hours", "distractors": ["It inhibits cyclo-oxygenase in the tissues; the adult dose is 1 g every 2 hours", "It acts on mu opioid receptors; the adult dose is 10 mg every 6 hours", "It blocks sodium channels in nerves; the adult dose is 4 g every 6 hours"], "exp": "Paracetamol is analgesic and antipyretic. Routes: oral, rectal and intravenous. Side effects are uncommon: rash, and liver impairment in overdose."}, {"topic": "Analgesia", "source": "VM-EM004.1 Analgesia", "stem": "A patient with asthma, a past peptic ulcer and chronic kidney disease needs analgesia. Which drug class is the main concern, and why?", "correct": "NSAIDs, because blocking prostaglandins harms the gut lining, renal blood flow, the airways and platelets", "distractors": ["Paracetamol, because blocking prostaglandins harms the gut lining, renal blood flow and platelets", "Local anaesthetics, because blocking sodium channels harms the gut lining and the kidneys", "Weak opioids, because partial receptor binding harms the airways and the kidneys"], "exp": "NSAIDs inhibit cyclo-oxygenase. Their predictable prostaglandin related side effects: GI ulceration, renal impairment from reduced renal blood flow, asthma (about 10% of asthmatics are NSAID sensitive) and bleeding from impaired platelet function. Celecoxib, rofecoxib and meloxicam are COX-2 inhibitors."}, {"topic": "Analgesia", "source": "VM-EM004.1 Analgesia", "stem": "Which of the following is an adverse effect of opioids rather than a therapeutic effect?", "correct": "Respiratory depression", "distractors": ["Suppression of coughing", "Relief of severe pain", "A feeling of euphoria"], "exp": "Therapeutic effects: analgesia, sedation, euphoria and cough suppression. Adverse effects: nausea and vomiting, respiratory depression, itching, constipation, tolerance and addiction, and occasionally urinary retention. Opioids act on mu, delta and kappa receptors."}, {"topic": "Analgesia", "source": "VM-EM004.1 Analgesia", "stem": "Morphine is the gold standard opioid. What is the approximate starting dose for an adult UNDER 70 years?", "correct": "10 mg IM or SC, or about 20 mg orally", "distractors": ["5 mg IM or SC, or about 10 mg orally", "20 mg IM or SC, or about 10 mg orally", "50 mg IM or SC, or about 100 mg orally"], "exp": "Over 70 years the doses are halved: 5 mg IM or SC, or about 10 mg orally. Morphine is water soluble, is titrated against pain, can be given 2 hourly, and addiction is rarely an issue in acute pain. The oral dose is about double the injected dose."}, {"topic": "Analgesia", "source": "VM-EM004.1 Analgesia", "stem": "What is the main limitation of weak opioids such as codeine, dihydrocodeine and tramadol?", "correct": "They bind only partially to opioid receptors, so they have a ceiling effect", "distractors": ["They bind irreversibly to opioid receptors, so they cannot be reversed", "They act only on delta receptors, so they give no analgesia at all", "They cannot be combined with paracetamol in one tablet"], "exp": "Weak opioids partially bind to the receptors: weak effect with a ceiling. They ARE combined with paracetamol as compound analgesics: co-codamol, co-dydramol and co-proxamol."}, {"topic": "Analgesia", "source": "VM-EM004.1 Analgesia", "stem": "While a large wound is being infiltrated with lidocaine, the patient reports tingling around the mouth, tinnitus and a metallic taste. What does this mean?", "correct": "Early local anaesthetic toxicity; convulsions and dysrhythmias may follow", "distractors": ["A normal effect of lidocaine that will pass if the injection continues", "An allergic reaction that needs only an oral antihistamine", "Late local anaesthetic toxicity; no further signs are expected"], "exp": "Local anaesthetics block sodium channels and stop nerve impulse propagation. Early toxicity: perioral tingling, tinnitus, confusion, agitation, metallic taste. Late toxicity: blurred vision, dysrhythmias, convulsions and cardiac arrest. Stop injecting at the early signs."}, {"topic": "Analgesia", "source": "VM-EM004.1 Analgesia", "stem": "What is Entonox?", "correct": "50% nitrous oxide with 50% oxygen, self administered for short procedures", "distractors": ["100% nitrous oxide, given by the anaesthetist during long operations", "50% nitric oxide with 50% air, given by the nurse for chronic pain", "70% nitrous oxide with 30% oxygen, used as a strong general anaesthetic"], "exp": "Entonox is a strong analgesic but a weak anaesthetic, with rapid onset, rapid elimination and few side effects."}, {"topic": "Analgesia", "source": "VM-EM004.1 Analgesia", "stem": "What is the standard intravenous PCA (patient controlled analgesia) setting in the lecture?", "correct": "Morphine 1 mg bolus with a 5 minute lockout, after a loading dose", "distractors": ["Morphine 10 mg bolus with a 5 minute lockout, with no loading dose", "Morphine 1 mg bolus with a 60 minute lockout, after a loading dose", "Fentanyl 1 mg bolus with a 15 minute lockout, with no loading dose"], "exp": "The patient must have a loading dose first. Fentanyl is used occasionally, for uncontrolled side effects or renal failure. No other opioids are given alongside a PCA, and an anti-syphon, anti-reflux giving set is used. For epidural PCEA the bolus is 5 ml with a 15 minute lockout."}, {"topic": "Analgesia", "source": "VM-EM004.1 Analgesia", "stem": "Which is a disadvantage of peripheral nerve blocks?", "correct": "Motor block, with a risk of nerve damage and drug toxicity", "distractors": ["More opioid side effects than with a morphine PCA", "More need for general anaesthesia and later discharge", "Poorer pain control and poorer physiotherapy"], "exp": "Advantages: fewer side effects, better pain control, less general anaesthesia, earlier discharge, better physiotherapy. Disadvantages: motor block, loss of sensation, risk of nerve damage, need for a specialist anaesthetist, time, and risk of drug toxicity. They are used in orthopaedic surgery, rib fractures, gynaecology and hernia repair."}, {"topic": "Approach to multiple trauma", "source": "ICC-2 VM (137) Approach to multiple trauma patient VM-EM005.1", "stem": "In the team (horizontal) approach, who stands back, coordinates and performs the \"5 second round\" when the patient arrives?", "correct": "The trauma team leader (TTL)", "distractors": ["The airway doctor", "The circulation doctor", "The team support person 1 (TSP 1)"], "exp": "In the horizontal approach several people assess A, B and C at the same time under one leader. Airway doctor: airway, cervical spine, neurological assessment. Breathing: chest assessment, chest drain. Circulation: haemorrhage control, abdomen, pelvis, limbs, vascular access. TSP 1: monitoring, bloods, clothes, temperature. TSP 2: assistant to the leader and documentation."}, {"topic": "Approach to multiple trauma", "source": "ICC-2 VM (137) Approach to multiple trauma patient VM-EM005.1", "stem": "The prehospital alert and handover follow a fixed structure. Which list is correct?", "correct": "Age, Time of incident, Mechanism, Injuries, Signs and symptoms, Treatment given", "distractors": ["Allergies, Medications, Past history, Last meal, Events leading to the injury", "Airway, Breathing, Circulation, Disability, Exposure and environment control", "Age, Address, Insurance status, Next of kin, Consent form, Blood group"], "exp": "This is the ATMIST handover, plus the estimated time of arrival. Allergies, Medications, Past history, Last meal and Events is the AMPLE history, which the airway doctor obtains from the patient."}, {"topic": "Approach to multiple trauma", "source": "ICC-2 VM (137) Approach to multiple trauma patient VM-EM005.1", "stem": "What does the team leader check in the \"5 second round\"?", "correct": "Is the airway clear, is there massive external bleeding, is there a pulse?", "distractors": ["Is the GCS below 8, are the pupils equal, is the glucose normal?", "Is the chest X-ray normal, is the FAST positive, is the pelvis stable?", "Is the patient identified, is consent signed, are relatives informed?"], "exp": "On arrival the leader ensures a safe transfer, does the 5 second round, then takes the handover. The answers decide whether the plan must change straight away."}, {"topic": "Approach to multiple trauma", "source": "ICC-2 VM (137) Approach to multiple trauma patient VM-EM005.1", "stem": "In the primary survey, what comes BEFORE airway in the cABCDE sequence?", "correct": "Catastrophic haemorrhage control", "distractors": ["Cervical spine X-ray in two views", "Central venous line insertion", "CT scan of the head and neck"], "exp": "cABCDE: catastrophic haemorrhage, Airway with cervical spine control, Breathing and ventilation, Circulation and haemorrhage control, Dysfunction of the CNS, Exposure and environment. The priorities are the same for all patients, with special considerations for the elderly, children and pregnancy."}, {"topic": "Approach to multiple trauma", "source": "ICC-2 VM (137) Approach to multiple trauma patient VM-EM005.1", "stem": "Which manoeuvre opens the airway of a trauma patient while the cervical spine is protected?", "correct": "Jaw thrust", "distractors": ["Head tilt with chin lift", "Neck extension over a pillow", "Turning the head to one side"], "exp": "Airway sequence: open (jaw thrust), clear (suction), maintain (oropharyngeal or nasopharyngeal airway), oxygenate (high flow oxygen), ventilate (bag valve mask if needed), secure (supraglottic device, tracheal tube with RSI, or surgical cricothyroidotomy), and monitor (SpO2 and end tidal CO2)."}, {"topic": "Approach to multiple trauma", "source": "ICC-2 VM (137) Approach to multiple trauma patient VM-EM005.1", "stem": "On the Mallampati score, what is seen in CLASS IV?", "correct": "The soft palate is not visible at all", "distractors": ["Complete view of the soft palate", "Complete view of the uvula", "Only the base of the uvula is seen"], "exp": "Class I: soft palate fully visible. Class II: uvula fully visible. Class III: only the base of the uvula. Class IV: soft palate not visible. With the 3-3-2 rule it helps to anticipate a difficult airway."}, {"topic": "Approach to multiple trauma", "source": "ICC-2 VM (137) Approach to multiple trauma patient VM-EM005.1", "stem": "Which of the following is NOT one of the six immediately life threatening thoracic conditions?", "correct": "Simple rib fracture", "distractors": ["Laryngo-tracheal injury", "Open chest wound", "Cardiac tamponade"], "exp": "The six: laryngo-tracheal injury, tension pneumothorax, open chest wound, flail chest, massive haemothorax and cardiac tamponade. The breathing doctor must exclude and treat them during the primary survey."}, {"topic": "Approach to multiple trauma", "source": "ICC-2 VM (137) Approach to multiple trauma patient VM-EM005.1", "stem": "A trauma patient is judged to have lost 35% of his blood volume. According to the ATLS table, which statement fits?", "correct": "Class III haemorrhage, base deficit -6 to -10 mEq/L, blood products needed", "distractors": ["Class I haemorrhage, base deficit 0 to -2 mEq/L, monitoring only", "Class II haemorrhage, base deficit -2 to -6 mEq/L, blood possibly needed", "Class IV haemorrhage, base deficit -10 mEq/L or less, massive transfusion"], "exp": "Class I: under 15%. Class II (mild): 15 to 30%. Class III (moderate): 31 to 40%. Class IV (severe): over 40%. A negative base excess is a base deficit and indicates metabolic acidosis."}, {"topic": "Approach to multiple trauma", "source": "ICC-2 VM (137) Approach to multiple trauma patient VM-EM005.1", "stem": "What is the usual initial fluid dose in trauma resuscitation?", "correct": "1 litre of warmed isotonic fluid for adults; 20 ml/kg for children", "distractors": ["3 litres of cold isotonic fluid for adults; 50 ml/kg for children", "1 litre of warmed 5% glucose for adults; 20 ml/kg for children", "250 ml of warmed colloid for adults; 5 ml/kg for children"], "exp": "Use warmed Ringer's lactate or normal saline. Hypotensive resuscitation (permissive hypotension) may be a bridge to, but is not a substitute for, definitive surgical control of bleeding."}, {"topic": "Approach to multiple trauma", "source": "ICC-2 VM (137) Approach to multiple trauma patient VM-EM005.1", "stem": "How does the lecture define massive haemorrhage?", "correct": "Loss of half the blood volume within 3 hours, or bleeding at 150 ml/min", "distractors": ["Loss of one tenth of the blood volume within 24 hours, or bleeding at 15 ml/min", "Loss of the whole blood volume within 1 week, or bleeding at 5 ml/min", "Any bleeding that lowers the haemoglobin below 10 g/dL"], "exp": "The massive haemorrhage (massive transfusion) protocol is a predefined approach that gives balanced components (red cells, plasma, platelets and cryoprecipitate) to avoid coagulopathy."}, {"topic": "Approach to multiple trauma", "source": "ICC-2 VM (137) Approach to multiple trauma patient VM-EM005.1", "stem": "What is the correct tranexamic acid (TXA) regimen in major trauma haemorrhage?", "correct": "1 g bolus over 10 minutes as soon as possible, then 1 g infused over 8 hours", "distractors": ["1 g bolus over 8 hours as soon as possible, then 1 g infused over 10 minutes", "10 g bolus over 10 minutes, but only after the CT scan confirms bleeding", "1 g orally every 8 hours, started once the patient reaches the ward"], "exp": "Give TXA as soon as possible. The lecture states that every 15 minute delay in TXA decreases survival by 10%."}, {"topic": "Approach to multiple trauma", "source": "ICC-2 VM (137) Approach to multiple trauma patient VM-EM005.1", "stem": "What does the focused neurological assessment in D (disability) include?", "correct": "GCS, pupils, lateralising motor signs, and a blood glucose", "distractors": ["Full cranial nerve examination, reflexes and a CT head", "GCS, fundoscopy, gait assessment and a lumbar puncture", "Mini mental state examination and a full sensory map"], "exp": "Check the GCS, the pupils (size, symmetry, light response) and any difference in motor response between the two sides. Do not forget the blood glucose."}, {"topic": "Approach to multiple trauma", "source": "ICC-2 VM (137) Approach to multiple trauma patient VM-EM005.1", "stem": "In which patient may the log roll be POSTPONED?", "correct": "An unstable blunt trauma patient with suspected pelvic or spinal injury", "distractors": ["A stable patient who has a single stab wound to the back of the chest", "A stable patient who has a gunshot wound to the flank and buttock", "A stable patient after a simple fall who has no pelvic or back pain"], "exp": "The log roll has a high priority in penetrating trauma (stab or gunshot), because wounds on the back are easily missed. In unstable blunt trauma with suspected pelvic or spinal injury it may be postponed. In E also prevent hypothermia, keep the patient's dignity and remove the spine board as soon as possible."}, {"topic": "Approach to multiple trauma", "source": "ICC-2 VM (137) Approach to multiple trauma patient VM-EM005.1", "stem": "Which investigations are adjuncts to the PRIMARY survey?", "correct": "e-FAST, chest X-ray and pelvic X-ray", "distractors": ["MRI of the spine and bone scan", "Head to toe examination, front and back", "Full medical history and review of documentation"], "exp": "Adjuncts: e-FAST, chest and pelvic X-rays, with or without lateral cervical spine, whole body CT, and angiography with interventional radiology. Analgesia (psychological, physical and pharmacological) is also an adjunct. Head to toe examination and the full history belong to the secondary survey."}, {"topic": "Approach to multiple trauma", "source": "ICC-2 VM (137) Approach to multiple trauma patient VM-EM005.1", "stem": "When should the secondary survey begin?", "correct": "Only after all immediately life threatening conditions have been treated", "distractors": ["As soon as the patient arrives, before the primary survey has started", "At the same time as the airway assessment, in order to save time", "Only after the patient is discharged from the intensive care unit"], "exp": "The secondary survey examines the patient head to toe, front and back, requests further investigations, reviews documentation and history, and builds a definitive care plan. It may be delayed by transfer to theatre, ICU or another hospital."}, {"topic": "Approach to multiple trauma", "source": "ICC-2 VM (137) Approach to multiple trauma patient VM-EM005.1", "stem": "According to the WHO figure quoted in the lecture, by how much could major trauma mortality in Europe fall if the chain of care were improved?", "correct": "30%", "distractors": ["5%", "10%", "60%"], "exp": "The WHO identifies trauma as the major health care challenge of the century. Prevention is the key, but better organised care (team approach, primary survey, early haemorrhage control) could cut mortality by about 30%."}, {"topic": "ABG interpretation", "source": "FCP [032] ABG interpretation ICC [IM 04.1]", "stem": "What is the correct order of the six step approach to an ABG?", "correct": "Oxygenation, pH, PaCO2, HCO3, anion gap, compensation", "distractors": ["pH, anion gap, oxygenation, compensation, PaCO2, HCO3", "PaCO2, HCO3, pH, compensation, oxygenation, anion gap", "Anion gap, compensation, pH, PaCO2, HCO3, oxygenation"], "exp": "Step 1 oxygenation, step 2 pH, step 3 ventilatory component (PaCO2), step 4 metabolic component (HCO3), step 5 anion gap, step 6 compensation. And always: we treat the patient, not the ABG."}, {"topic": "ABG interpretation", "source": "FCP [032] ABG interpretation ICC [IM 04.1]", "stem": "Which set of values is normal for an arterial blood gas?", "correct": "pH 7.35 to 7.45, PaCO2 35 to 45 mmHg, HCO3 22 to 26 mmol/L", "distractors": ["pH 7.25 to 7.35, PaCO2 25 to 35 mmHg, HCO3 12 to 16 mmol/L", "pH 7.45 to 7.55, PaCO2 45 to 55 mmHg, HCO3 32 to 36 mmol/L", "pH 7.35 to 7.45, PaCO2 22 to 26 mmHg, HCO3 35 to 45 mmol/L"], "exp": "Normal PaO2 on air is above 10 kPa (80 to 100 mmHg). PaCO2 35 to 45 mmHg is 4.7 to 6.0 kPa. Acidaemia is pH below 7.35 and alkalaemia is pH above 7.45."}, {"topic": "ABG interpretation", "source": "FCP [032] ABG interpretation ICC [IM 04.1]", "stem": "A patient is breathing 40% oxygen. Using the lecture's rule, what PaO2 would you expect if the lungs were normal?", "correct": "About 200 mmHg", "distractors": ["About 40 mmHg", "About 100 mmHg", "About 400 mmHg"], "exp": "Expected PaO2 (mmHg) = FiO2 x 500, or FiO2 in percent x 5. On air: 0.2 x 500 = 100. On 40%: 40 x 5 = 200. So a \"normal\" PaO2 of 90 mmHg on high flow oxygen is actually abnormal."}, {"topic": "ABG interpretation", "source": "FCP [032] ABG interpretation ICC [IM 04.1]", "stem": "A patient with acute severe asthma is hypoxic and exhausted. The PaCO2 is 40 mmHg. How should this be read?", "correct": "A worrying sign: he is tiring and needs critical intervention", "distractors": ["A reassuring sign: his ventilation has returned to normal", "A laboratory error: the sample must have been venous", "A sign of chronic compensation that needs no action now"], "exp": "An asthmatic who is working hard should blow the PaCO2 down. A normal PaCO2 in a hypoxic asthmatic means he is tiring. Another trap: a very low PaO2 in a patient who looks well with a normal saturation is probably a venous sample."}, {"topic": "ABG interpretation", "source": "FCP [032] ABG interpretation ICC [IM 04.1]", "stem": "How are type 1 and type 2 respiratory failure told apart?", "correct": "Both have PaO2 below 60 mmHg; type 2 also has PaCO2 above 45 mmHg", "distractors": ["Both have PaCO2 above 45 mmHg; type 2 also has PaO2 below 60 mmHg", "Type 1 has a low pH; type 2 has a high pH with a normal PaO2", "Type 1 has PaO2 below 80 mmHg; type 2 has PaO2 below 40 mmHg"], "exp": "Type 1: hypoxaemia with normocapnia (pneumonia, ARDS, pulmonary embolus). Type 2: hypoxaemia with hypercapnia, which means ventilation is failing (opiate toxicity, obstructive sleep apnoea)."}, {"topic": "ABG interpretation", "source": "FCP [032] ABG interpretation ICC [IM 04.1]", "stem": "pH 7.25, PaCO2 60 mmHg. The pH and the PaCO2 have moved in OPPOSITE directions. What is the primary problem?", "correct": "Respiratory acidosis", "distractors": ["Metabolic acidosis", "Respiratory alkalosis", "Metabolic alkalosis"], "exp": "Rule: if pH moves in the opposite direction to PaCO2, the primary problem is respiratory. If they move in the same direction, it is metabolic. Remember that CO2 is an acid."}, {"topic": "ABG interpretation", "source": "FCP [032] ABG interpretation ICC [IM 04.1]", "stem": "Which of the following is a cause of respiratory ACIDOSIS?", "correct": "Guillain-Barre syndrome", "distractors": ["An acute panic attack", "Normal pregnancy", "Early stage of sepsis"], "exp": "Respiratory acidosis means CO2 retention: respiratory depression (opiates), Guillain-Barre paralysis, asthma, interstitial lung disease, COPD, and wrong ventilator settings. Respiratory alkalosis: anxiety or panic, pregnancy, early sepsis, and ventilation at excessive rate or volume."}, {"topic": "ABG interpretation", "source": "FCP [032] ABG interpretation ICC [IM 04.1]", "stem": "What does a base excess of -8 mmol/L mean?", "correct": "Metabolic acidosis: about 8 mmol/L of strong base would be needed to bring the pH back to normal", "distractors": ["Metabolic alkalosis: about 8 mmol/L of strong acid would be needed to bring the pH back to normal", "Respiratory acidosis: the PaCO2 is about 8 mmHg above the upper limit of normal", "A normal result: the base excess ranges from -10 to +10 in healthy people"], "exp": "Base excess is the amount of strong acid or base needed to restore a normal pH. It reflects the metabolic component, like bicarbonate. Below -2 means metabolic acidosis; above +2 means metabolic alkalosis."}, {"topic": "ABG interpretation", "source": "FCP [032] ABG interpretation ICC [IM 04.1]", "stem": "How is the anion gap calculated in the lecture?", "correct": "(Na + K) minus (Cl + HCO3)", "distractors": ["(Na + Cl) minus (K + HCO3)", "(Cl + HCO3) minus (Na + K)", "(Na + HCO3) minus (K + Cl)"], "exp": "The gap represents the unmeasured anions. It splits metabolic acidosis into two groups: raised gap (gain of H+) and normal gap (loss of bicarbonate, replaced by chloride)."}, {"topic": "ABG interpretation", "source": "FCP [032] ABG interpretation ICC [IM 04.1]", "stem": "A patient has metabolic acidosis with Na 140, K 4, Cl 100 and HCO3 10. Which diagnosis fits best?", "correct": "Diabetic ketoacidosis", "distractors": ["Severe diarrhoea", "Renal tubular acidosis", "Acetazolamide therapy"], "exp": "Anion gap = (140 + 4) - (100 + 10) = 34, which is clearly raised. Raised gap causes: ketoacidosis (DKA, starvation), lactic acidosis, salicylate overdose, renal failure and rhabdomyolysis. The other three options cause a NORMAL gap acidosis."}, {"topic": "ABG interpretation", "source": "FCP [032] ABG interpretation ICC [IM 04.1]", "stem": "Why does the anion gap stay normal in the metabolic acidosis of diarrhoea?", "correct": "The lost bicarbonate is replaced by chloride, so the total anion concentration is unchanged", "distractors": ["The lost chloride is replaced by bicarbonate, so the total anion concentration is unchanged", "The kidneys excrete the unmeasured anions as fast as they are formed", "The lost potassium is replaced by sodium, so the total cation concentration rises"], "exp": "Normal gap (hyperchloraemic) acidosis: diarrhoea, renal tubular acidosis, ureterosigmoidostomy, drugs such as acetazolamide, and Addison's disease."}, {"topic": "ABG interpretation", "source": "FCP [032] ABG interpretation ICC [IM 04.1]", "stem": "Which of the following causes metabolic ALKALOSIS?", "correct": "Excessive vomiting", "distractors": ["Salicylate overdose", "Addison's disease", "Rhabdomyolysis"], "exp": "Metabolic alkalosis: excessive vomiting, diuretics, bicarbonate administration, Conn's syndrome (hyperaldosteronism), Liddle syndrome and liquorice. Addison's disease causes a normal gap acidosis; salicylates and rhabdomyolysis cause a raised gap acidosis."}, {"topic": "ABG interpretation", "source": "FCP [032] ABG interpretation ICC [IM 04.1]", "stem": "A patient has metabolic acidosis with HCO3 12 mmol/L. Using Winter's formula, what PaCO2 shows appropriate respiratory compensation?", "correct": "About 26 mmHg (24 to 28)", "distractors": ["About 12 mmHg (10 to 14)", "About 40 mmHg (38 to 42)", "About 50 mmHg (48 to 52)"], "exp": "Expected PaCO2 = (1.5 x HCO3) + 8, plus or minus 2. Here 1.5 x 12 = 18, plus 8 = 26. Compensation always moves in the same direction as the primary change: a low bicarbonate is compensated by a low PaCO2."}, {"topic": "ABG interpretation", "source": "FCP [032] ABG interpretation ICC [IM 04.1]", "stem": "In the same patient (expected PaCO2 24 to 28 mmHg), the measured PaCO2 is 40 mmHg. What does this mean?", "correct": "There is an added respiratory acidosis (a mixed disorder)", "distractors": ["There is an added respiratory alkalosis (a mixed disorder)", "It is a pure metabolic acidosis with full compensation", "The sample must be venous and should be repeated"], "exp": "Measured PaCO2 above the expected range: added respiratory acidosis. Below the range: added respiratory alkalosis. Within the range: pure metabolic acidosis. This is why compensation is always checked."}, {"topic": "ABG interpretation", "source": "FCP [032] ABG interpretation ICC [IM 04.1]", "stem": "An ABG shows low pH, high PaCO2 and low HCO3. Which clinical situation typically produces this picture?", "correct": "Cardiac arrest", "distractors": ["Hyperemesis gravidarum", "Cirrhosis treated with diuretics", "A panic attack"], "exp": "Low pH with high CO2 AND low bicarbonate is a mixed respiratory and metabolic acidosis: cardiac arrest, or multi-organ failure in severe sepsis. High pH with low CO2 and high bicarbonate is a mixed alkalosis: cirrhosis with diuretics, hyperemesis gravidarum, over-ventilation in COPD."}, {"topic": "ABG interpretation", "source": "FCP [032] ABG interpretation ICC [IM 04.1]", "stem": "The pH of an ABG is 7.40. Which statement is correct?", "correct": "It does not rule out disease: there may be a compensated or mixed disorder", "distractors": ["It rules out any respiratory or metabolic acid base disorder in this patient", "It means the PaCO2 and the bicarbonate do not need to be looked at", "It is only possible when the anion gap is also inside the normal range"], "exp": "pH is a logarithmic scale, inversely related to hydrogen ion concentration, and is normally held at 7.35 to 7.45 by buffers (bicarbonate and plasma proteins outside cells; proteins, phosphate and ammonia inside), by the lungs (CO2) and by the kidneys (H+). Always read all the values, not only the pH."}];
const KEY = "hesham_y3_w00B_best";
const $ = id => document.getElementById(id);
const topics = [...new Set(BANK.map(q => q.topic))];
let mode = "practice", count = 0, set = [], idx = 0, answers = [], tick = null, left = 0;

function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function esc(s){return s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]))}
function best(){try{return JSON.parse(localStorage.getItem(KEY))||{}}catch(e){return {}}}
function saveBest(b){try{localStorage.setItem(KEY,JSON.stringify(b))}catch(e){}}
function show(id){["start","quiz","done"].forEach(s=>$(s).classList.toggle("hidden",s!==id));window.scrollTo(0,0)}

function drawStart(){
  const b = best();
  $("topics").innerHTML = topics.map((t,i)=>{
    const n = BANK.filter(q=>q.topic===t).length;
    const last = b[t]!=null ? "best "+b[t]+"%" : "not tried yet";
    return `<label class="topic"><input type="checkbox" value="${i}" checked><span class="name">${esc(t)}</span><span class="meta">${n} questions, ${last}</span></label>`;
  }).join("");
  setNote();
}
function setNote(){
  $("modeNote").textContent = mode==="practice"
    ? "Practice: you see the right answer and the explanation after each question."
    : "Exam: timed at 72 seconds per question, like the real paper. Answers and explanations come at the end.";
}
function pick(group, btn, attr){[...$(group).children].forEach(b=>b.setAttribute("aria-pressed", b===btn));return btn.dataset[attr]}
$("count").onclick = e => {if(e.target.tagName==="BUTTON") count = +pick("count", e.target, "n")};
$("mode").onclick = e => {if(e.target.tagName==="BUTTON"){mode = pick("mode", e.target, "m"); setNote()}};

function begin(pool){
  set = pool.map(q => ({q, opts: shuffle([q.correct, ...q.distractors])}));
  idx = 0; answers = new Array(set.length).fill(null);
  $("qt").textContent = set.length;
  $("strip").innerHTML = set.map(()=>"<i></i>").join("");
  clearInterval(tick);
  if(mode==="exam"){
    left = set.length*72; $("timer").classList.remove("hidden"); paintTimer();
    tick = setInterval(()=>{left--; paintTimer(); if(left<=0) finish()},1000);
  } else $("timer").classList.add("hidden");
  show("quiz"); drawQ();
}
function paintTimer(){const m=Math.floor(left/60),s=left%60;$("timer").textContent=m+":"+String(s).padStart(2,"0");$("timer").classList.toggle("low",left<60)}

$("go").onclick = () => {
  const chosen = [...document.querySelectorAll("#topics input:checked")].map(i=>topics[+i.value]);
  if(!chosen.length){alert("Pick at least one lecture.");return}
  let pool = shuffle(BANK.filter(q=>chosen.includes(q.topic)));
  if(count && count<pool.length) pool = pool.slice(0,count);
  begin(pool);
};

function drawQ(){
  const {q,opts} = set[idx]; let sel = null, locked = false;
  $("qn").textContent = idx+1; $("qtag").textContent = q.topic; $("stem").textContent = q.stem; $("exp").innerHTML = "";
  [...$("strip").children].forEach((el,i)=>{
    const a = answers[i];
    el.className = i===idx ? "now" : a==null ? "" : mode==="exam" ? "done" : (a===set[i].q.correct ? "ok" : "no");
  });
  const nx = $("next"); nx.disabled = true;
  nx.textContent = mode==="practice" ? "Check answer" : (idx===set.length-1 ? "Finish exam" : "Next question");
  $("opts").innerHTML = opts.map((o,i)=>`<button class="opt" data-i="${i}"><span class="k">${"ABCDE"[i]}</span><span>${esc(o)}</span></button>`).join("");
  const btns = [...$("opts").children];
  btns.forEach(b => b.onclick = () => {
    if(locked) return; sel = opts[+b.dataset.i];
    btns.forEach(x=>x.classList.toggle("sel",x===b)); nx.disabled = false;
  });
  nx.onclick = () => {
    if(mode==="practice" && !locked){
      locked = true; answers[idx] = sel; const ok = sel===q.correct;
      btns.forEach(b=>{const o=opts[+b.dataset.i]; b.disabled=true; b.classList.remove("sel");
        if(o===q.correct) b.classList.add("right"); else if(o===sel) b.classList.add("bad")});
      $("exp").innerHTML = `<div class="exp ${ok?"":"no"}"><b class="verdict">${ok?"Correct.":"Not this time."}</b>${esc(q.exp)}<span class="src">From: ${esc(q.source)}</span></div>`;
      $("strip").children[idx].className = ok?"ok":"no";
      nx.textContent = idx===set.length-1 ? "See my result" : "Next question";
      return;
    }
    if(mode==="exam") answers[idx] = sel;
    if(idx===set.length-1) finish(); else {idx++; drawQ(); window.scrollTo(0,0)}
  };
}
$("quit").onclick = () => {if(confirm("End the quiz now and see your result?")) finish()};

function finish(){
  clearInterval(tick);
  const total = set.length, right = set.filter((s,i)=>answers[i]===s.q.correct).length;
  const pct = Math.round(100*right/total);
  $("score").textContent = right+" / "+total;
  $("scoreNote").textContent = pct+"%. " + (pct>=85 ? "Strong. Keep these lectures warm with a short retry next week."
    : pct>=65 ? "Good base. Go through the review list below, then retry the missed ones."
    : "Read the high yield sheet for the weak lectures first, then come back.");
  const b = best();
  $("byTopic").innerHTML = topics.filter(t=>set.some(s=>s.q.topic===t)).map(t=>{
    const items = set.map((s,i)=>[s,i]).filter(([s])=>s.q.topic===t);
    const r = items.filter(([s,i])=>answers[i]===s.q.correct).length, p = Math.round(100*r/items.length);
    if(items.length>=5 && (b[t]==null || p>b[t])) b[t]=p;
    return `<div class="row"><span>${esc(t)}</span><strong>${r} / ${items.length}</strong><div class="track"><span class="${p<65?"weak":""}" style="width:${p}%"></span></div></div>`;
  }).join("");
  saveBest(b);
  const missed = set.map((s,i)=>[s,i]).filter(([s,i])=>answers[i]!==s.q.correct);
  $("retry").classList.toggle("hidden", !missed.length);
  $("revTitle").textContent = missed.length ? "Questions to review ("+missed.length+")" : "Nothing to review. All correct.";
  $("reviews").innerHTML = missed.map(([s,i])=>`<div class="review"><span class="tag">${esc(s.q.topic)}</span>
    <div class="stem">${esc(s.q.stem)}</div>
    <p class="you">${answers[i]==null?"You left this one blank.":"You chose: "+esc(answers[i])}</p>
    <p class="ans">Answer: ${esc(s.q.correct)}</p><p>${esc(s.q.exp)}</p></div>`).join("");
  $("retry").onclick = () => {mode="practice"; begin(shuffle(missed.map(([s])=>s.q)))};
  show("done");
}
$("home").onclick = () => {[...$("mode").children].forEach(b=>b.setAttribute("aria-pressed", b.dataset.m===mode)); drawStart(); show("start")};
drawStart();
</script>
