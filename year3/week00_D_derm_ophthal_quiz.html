<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Year 3 Week 00 D: Dermatopathology and eye examination quiz</title>
<style>
:root{
  --paper:#EEF4F2; --card:#FFFFFF; --ink:#0F2A33; --soft:#4C666E; --line:#C9D8D4;
  --scrub:#1B7567; --scrub-dark:#125548; --scrub-tint:#DCEEEA;
  --wrong:#B23A30; --wrong-tint:#F7E3E0; --amber:#B7790C;
  --ui:"Avenir Next","Segoe UI",system-ui,-apple-system,Roboto,sans-serif;
  --read:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
}
@media (prefers-color-scheme:dark){
  :root{--paper:#0C1F25;--card:#132E36;--ink:#E6F0EE;--soft:#9DB5B8;--line:#27474F;
  --scrub:#4FB8A5;--scrub-dark:#7FD3C3;--scrub-tint:#17403F;--wrong:#E8867C;--wrong-tint:#42211F;--amber:#E0A93F;}
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--ui);line-height:1.5;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
.wrap{max-width:760px;margin:0 auto;padding:20px 18px 60px}
h1{font-family:var(--read);font-weight:600;font-size:2rem;line-height:1.15;margin:18px 0 6px;letter-spacing:-.01em}
h2{font-size:1.05rem;margin:26px 0 10px}
p.lead{color:var(--soft);margin:0 0 8px;max-width:60ch}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible,label:focus-within{outline:3px solid var(--amber);outline-offset:2px}
.hidden{display:none!important}

/* start screen */
.topic{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);
  border-radius:10px;padding:13px 14px;margin-bottom:8px}
.topic input{width:22px;height:22px;accent-color:var(--scrub);flex:none}
.topic .name{flex:1;font-weight:600}
.topic .meta{color:var(--soft);font-size:.86rem;white-space:nowrap}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--card)}
.seg button{flex:1;border:0;background:none;padding:12px 8px;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--scrub);color:#fff;font-weight:600}
.note{color:var(--soft);font-size:.9rem;margin:8px 0 0}
.primary{display:block;width:100%;margin-top:26px;border:0;border-radius:12px;background:var(--scrub);
  color:#fff;font-weight:700;font-size:1.08rem;padding:16px}
.primary:active{background:var(--scrub-dark)}
.primary:disabled{opacity:.45}
.ghost{background:none;border:1px solid var(--line);border-radius:10px;padding:11px 16px}

/* count strip: one mark per question */
.strip{display:flex;gap:2px;margin:6px 0 18px;height:12px}
.strip i{flex:1;border-radius:2px;background:var(--line);min-width:2px}
.strip i.ok{background:var(--scrub)} .strip i.no{background:var(--wrong)}
.strip i.done{background:var(--soft)} .strip i.now{background:var(--amber);transform:scaleY(1.5)}
.bar{display:flex;justify-content:space-between;align-items:center;gap:12px;color:var(--soft);font-size:.92rem}
.bar strong{color:var(--ink)}
.timer{font-variant-numeric:tabular-nums;font-weight:700;color:var(--ink)}
.timer.low{color:var(--wrong)}

/* question */
.tag{display:inline-block;background:var(--scrub-tint);color:var(--scrub-dark);border-radius:6px;
  padding:3px 9px;font-size:.82rem;font-weight:600}
.stem{font-family:var(--read);font-size:1.28rem;line-height:1.5;margin:14px 0 18px;max-width:62ch}
.opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;background:var(--card);
  border:1.5px solid var(--line);border-radius:12px;padding:14px;margin-bottom:10px;min-height:54px}
.opt .k{flex:none;width:28px;height:28px;border-radius:50%;border:1.5px solid var(--line);
  display:grid;place-items:center;font-weight:700;font-size:.88rem;color:var(--soft)}
.opt.sel{border-color:var(--scrub);background:var(--scrub-tint)}
.opt.sel .k{background:var(--scrub);border-color:var(--scrub);color:#fff}
.opt.right{border-color:var(--scrub);background:var(--scrub-tint)}
.opt.right .k{background:var(--scrub);border-color:var(--scrub);color:#fff}
.opt.bad{border-color:var(--wrong);background:var(--wrong-tint)}
.opt.bad .k{background:var(--wrong);border-color:var(--wrong);color:#fff}
.opt:disabled{cursor:default;color:inherit;opacity:1}
.exp{border-left:4px solid var(--scrub);background:var(--card);border-radius:0 10px 10px 0;
  padding:14px 16px;margin:16px 0 0}
.exp.no{border-left-color:var(--wrong)}
.exp b.verdict{display:block;margin-bottom:4px}
.exp .src{display:block;margin-top:8px;color:var(--soft);font-size:.86rem}
.actions{display:flex;gap:10px;margin-top:20px}
.actions .primary{margin-top:0}

/* results */
.score{font-family:var(--read);font-size:3.2rem;line-height:1;margin:10px 0 4px}
.row{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center;margin-bottom:12px}
.row .track{grid-column:1/-1;height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.row .track span{display:block;height:100%;background:var(--scrub)}
.row .track span.weak{background:var(--wrong)}
.review{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:10px}
.review .stem{font-size:1.06rem;margin:8px 0 10px}
.review p{margin:4px 0}
.review .you{color:var(--wrong)} .review .ans{color:var(--scrub-dark);font-weight:600}
@media (max-width:480px){h1{font-size:1.6rem}.stem{font-size:1.14rem}.topic{flex-wrap:wrap}.topic .meta{flex-basis:100%;padding-left:34px}}
@media (prefers-reduced-motion:no-preference){.strip i{transition:background .2s,transform .2s}}
</style>
</head>
<body>
<div class="wrap">

<section id="start">
  <h1>Skin pathology and the eye exam, week 00</h1>
  <p class="lead">Year 3, batch D. Questions are written from your own lecture slides and the OSCE checklist. Options are shuffled every time.</p>

  <h2>Pick the lectures</h2>
  <div id="topics"></div>

  <h2>How many questions</h2>
  <div class="seg" id="count">
    <button data-n="15">15</button><button data-n="30">30</button><button data-n="0" aria-pressed="true">All</button>
  </div>

  <h2>How to answer</h2>
  <div class="seg" id="mode">
    <button data-m="practice" aria-pressed="true">Practice</button><button data-m="exam">Exam</button>
  </div>
  <p class="note" id="modeNote"></p>

  <button class="primary" id="go">Start quiz</button>
</section>

<section id="quiz" class="hidden">
  <div class="bar"><span>Question <strong id="qn"></strong> of <strong id="qt"></strong></span>
    <span class="timer hidden" id="timer"></span>
    <button class="ghost" id="quit">End quiz</button></div>
  <div class="strip" id="strip"></div>
  <span class="tag" id="qtag"></span>
  <div class="stem" id="stem"></div>
  <div id="opts"></div>
  <div id="exp"></div>
  <div class="actions"><button class="primary" id="next" disabled>Check answer</button></div>
</section>

<section id="done" class="hidden">
  <h1>Your result</h1>
  <div class="score" id="score"></div>
  <p class="lead" id="scoreNote"></p>
  <h2>By lecture</h2>
  <div id="byTopic"></div>
  <div class="actions">
    <button class="primary" id="retry">Retry the ones I missed</button>
    <button class="ghost" id="home">Back to start</button>
  </div>
  <h2 id="revTitle">Questions to review</h2>
  <div id="reviews"></div>
</section>

</div>
<script>
const BANK = [{"topic": "Introduction to dermatopathology", "source": "Intro to Dermatopathology [VM-PA001.1]", "stem": "What type of epithelium forms the epidermis?", "correct": "Keratinizing stratified squamous epithelium", "distractors": ["Non-keratinizing stratified squamous epithelium", "Pseudostratified columnar epithelium", "Stratified cuboidal epithelium"], "exp": "The epidermis is a keratinizing stratified squamous epithelium. Its main cell is the keratinocyte, with three dendritic cell types between them: melanocytes, Langerhans cells and Merkel cells."}, {"topic": "Introduction to dermatopathology", "source": "Intro to Dermatopathology [VM-PA001.1]", "stem": "Where is the epidermis thinnest, and where is it thickest?", "correct": "Thinnest on the eyelids (under 0.1 mm), thickest on acral sites (about 1 mm)", "distractors": ["Thinnest on the back (under 0.1 mm), thickest on the face (about 4 mm)", "Thinnest on acral sites (under 0.1 mm), thickest on the eyelids (about 1 mm)", "Thinnest on the face (about 1 mm), thickest on the back (about 4 mm)"], "exp": "Epidermis: under 0.1 mm on the eyelids to about 1 mm on acral sites (palms and soles). The figures 1 mm on the face to about 4 mm on the back belong to the dermis, which is much thicker than the epidermis."}, {"topic": "Introduction to dermatopathology", "source": "Intro to Dermatopathology [VM-PA001.1]", "stem": "According to the lecture, where is the subcutaneous fat characteristically thick in males?", "correct": "Upper arm and posterior neck", "distractors": ["Pubic area and inner thigh skin", "Eyelids and skin of the face", "Palms of hands and soles of feet"], "exp": "Subcutaneous fat varies with site and gender. It is thick in the abdominal wall and thin in the eyelids. In females it is thick in pubic and thigh skin; in males in the upper arm and posterior neck."}, {"topic": "Introduction to dermatopathology", "source": "Intro to Dermatopathology [VM-PA001.1]", "stem": "Which layer of the epidermis is the site of mitosis and regeneration?", "correct": "Basal cell layer", "distractors": ["Spinous (prickle) layer", "Granular layer", "Horny (keratinous) layer"], "exp": "The basal layer is a single layer of elongated cells with palisaded nuclei; about 60% of basal cells proliferate. The spinous layer is postmitotic and gives the epidermis its structure, the granular layer forms keratin and the water barrier, and the horny layer is protective."}, {"topic": "Introduction to dermatopathology", "source": "Intro to Dermatopathology [VM-PA001.1]", "stem": "What is the main function of the spinous (prickle) layer?", "correct": "It is non-mitotic and gives the epidermis structure", "distractors": ["It is the main site of mitosis and of regeneration", "It forms the water barrier by releasing its lipid", "It carries the light touch receptors of the epidermis"], "exp": "After leaving the basal layer, keratinocytes become postmitotic and start structural differentiation: they develop the keratin filament and desmosome complex and a cornified envelope."}, {"topic": "Introduction to dermatopathology", "source": "Intro to Dermatopathology [VM-PA001.1]", "stem": "Keratohyaline granules of the granular layer are composed of which substance?", "correct": "Profilaggrin", "distractors": ["Tonofilament", "Glycogen", "Desmoglein"], "exp": "Keratohyaline granules contain profilaggrin, which is converted by enzymes to filaggrin, a keratin filament aggregating (matrix) protein. Glycogen is what makes mucosal keratinocytes look pale; desmoglein is a desmosomal protein."}, {"topic": "Introduction to dermatopathology", "source": "Intro to Dermatopathology [VM-PA001.1]", "stem": "Filaggrin later decomposes. What is useful about its breakdown products?", "correct": "They are sun-shielding and water-binding", "distractors": ["They are antigen presenting and phagocytic", "They are lipid rich and water repelling", "They are pigment forming and heat producing"], "exp": "Filaggrin derivatives shield against the sun and bind water, so they help keep the horny layer hydrated. The lipid rich, water repelling material comes from Odland bodies, not from filaggrin."}, {"topic": "Introduction to dermatopathology", "source": "Intro to Dermatopathology [VM-PA001.1]", "stem": "Which statement about Odland bodies is correct?", "correct": "They are lipid rich and hydrophobic, and release their contents into the intercellular space at the granular layer", "distractors": ["They are protein rich and hydrophilic, and release their contents into the dermis at the basement membrane", "They are pigment granules passed from melanocytes to the keratinocytes of the basal layer", "They are neurosecretory granules made by Merkel cells at the level of the basement membrane"], "exp": "Odland bodies are released from keratinocytes of the upper spinous layer and move to the periphery of the granular layer, where they empty into the intercellular space. Being lipid rich and hydrophobic, they repel water and form part of the water barrier."}, {"topic": "Introduction to dermatopathology", "source": "Intro to Dermatopathology [VM-PA001.1]", "stem": "Why does the normal horny layer look like a basket weave in routine sections?", "correct": "Material in the horny layer is not fixed by formalin and washes away in processing", "distractors": ["Retained nuclei in the horny layer shrink and leave empty spaces during processing", "Intercellular oedema separates the horny cells and leaves wide gaps between them", "Odland bodies swell in formalin and push the keratin layers of the skin far apart"], "exp": "The horny layer is the anucleate top layer. Its basket weave look (orthokeratosis) is a processing effect: material not fixed by formalin is washed out. Retained nuclei would be parakeratosis, and intercellular oedema is spongiosis."}, {"topic": "Introduction to dermatopathology", "source": "Intro to Dermatopathology [VM-PA001.1]", "stem": "From which embryonic structure do melanocytes originate?", "correct": "Neural crest", "distractors": ["Bone marrow", "Surface ectoderm", "Dermal mesoderm"], "exp": "Melanocytes come from the neural crest and migrate to their final place in the basal layer. Langerhans cells are the ones derived from bone marrow."}, {"topic": "Introduction to dermatopathology", "source": "Intro to Dermatopathology [VM-PA001.1]", "stem": "Which panel of immunohistochemical markers is positive in melanocytes?", "correct": "S-100, SOX10, HMB-45 and Melan A", "distractors": ["CD1a, CD3, CD20 and CD68", "Cytokeratin 20 and chromogranin", "Desmoglein, desmocollin and CK5"], "exp": "Melanocytes stain for S-100, SOX10, HMB-45 and Melan A. CD1a is the specific marker for Langerhans cells, and cytokeratin 20 highlights Merkel cells."}, {"topic": "Introduction to dermatopathology", "source": "Intro to Dermatopathology [VM-PA001.1]", "stem": "After a keratinocyte receives melanosomes, where does it store them and why?", "correct": "Over its nucleus, so melanin absorbs UV before it reaches DNA", "distractors": ["Under its nucleus, so melanin can pass down into the upper dermis", "Inside its desmosomes, so melanin strengthens cell to cell adhesion", "In the horny layer only, so melanin is shed quickly with the scales"], "exp": "The melanocyte makes the melanosome and passes it to a keratinocyte, which stores it over the nucleus like a cap. Melanin filters light by converting radiative energy into heat, so the DNA is protected."}, {"topic": "Introduction to dermatopathology", "source": "Intro to Dermatopathology [VM-PA001.1]", "stem": "Melanin is synthesised from which amino acid?", "correct": "Tyrosine", "distractors": ["Tryptophan", "Histidine", "Glycine"], "exp": "The pathway in the lecture: tyrosine, then dihydroxyphenylalanine (DOPA), then dopaquinone, then eumelanin."}, {"topic": "Introduction to dermatopathology", "source": "Intro to Dermatopathology [VM-PA001.1]", "stem": "Apart from melanin, which of these contributes to skin coloration?", "correct": "Carotenoids in the epidermis and haemoglobin in dermal vessels", "distractors": ["Glycogen in the keratinocytes and collagen in the reticular dermis", "Filaggrin in the granular layer and sebum on the skin surface", "Keratin in the horny layer and elastic fibres in the dermis"], "exp": "Melanin is the main cause. Less important causes are carotenoids within the epidermis, oxyhaemoglobin within dermal capillaries and deoxyhaemoglobin within dermal venules."}, {"topic": "Introduction to dermatopathology", "source": "Intro to Dermatopathology [VM-PA001.1]", "stem": "Which statement about Langerhans cells is correct?", "correct": "Bone marrow derived antigen presenting cells of the mid epidermis, positive for CD1a", "distractors": ["Neural crest derived pigment forming cells of the basal layer, positive for HMB-45", "Sensory cells at the level of the basement membrane, positive for cytokeratin 20", "Fibroblast like cells of the papillary dermis, positive for S-100 and for SOX10"], "exp": "Langerhans cells belong to the macrophage family, sit mainly in the upper and middle epidermis, present antigens and protect against infective agents. Their number rises when antigen presentation increases, for example in contact dermatitis."}, {"topic": "Introduction to dermatopathology", "source": "Intro to Dermatopathology [VM-PA001.1]", "stem": "On an H&E section you see cells with clear cytoplasm in the epidermis. How do you tell melanocytes from Langerhans cells?", "correct": "By location: melanocytes lie in the basal layer, Langerhans cells in the mid epidermis", "distractors": ["By cytoplasm: melanocytes are clear, Langerhans cells are deeply eosinophilic", "By location: melanocytes lie in the horny layer, Langerhans cells in the dermis", "By nuclei: melanocytes are anucleate, Langerhans cells are multinucleated"], "exp": "This is the lecturer's own question. What the two cells share is an apparently clear cytoplasm. What differs histologically is where they sit: melanocytes between basal keratinocytes, Langerhans cells higher up."}, {"topic": "Introduction to dermatopathology", "source": "Intro to Dermatopathology [VM-PA001.1]", "stem": "Which statement about Merkel cells is correct?", "correct": "They sit at basement membrane level, serve light touch, and need CK20 staining to be seen", "distractors": ["They sit in the mid epidermis, present antigens, and need CD1a staining to be seen", "They sit in the basal layer, make melanin, and are easily seen with H&E staining", "They sit in the papillary dermis, make collagen, and need S-100 staining to be seen"], "exp": "Merkel cells are part of the sensory nervous system, essential for light touch. They have desmosomal contacts with keratinocytes and produce cytokeratin 20 and neurosecretory granules. They are not detectable in routine H&E sections."}, {"topic": "Introduction to dermatopathology", "source": "Intro to Dermatopathology [VM-PA001.1]", "stem": "Keratinocytes adhere to each other by desmosomes. Which proteins are named in the desmosome?", "correct": "Desmoglein and desmocollin", "distractors": ["Claudin-1 and occludin", "Filaggrin and profilaggrin", "Collagen type I and type III"], "exp": "The desmosome and keratin (tono) filament complex is made of an attachment plaque, keratin filaments, and the proteins desmoglein and desmocollin. Desmosomes continuously break and reform to allow regulated upward movement of keratinocytes."}, {"topic": "Introduction to dermatopathology", "source": "Intro to Dermatopathology [VM-PA001.1]", "stem": "How is the basal layer attached to the underlying basal lamina?", "correct": "By hemidesmosomes", "distractors": ["By full desmosomes", "By Odland bodies", "By elastic fibres"], "exp": "Basal cells are fixed to the basement membrane by hemidesmosomes. In pemphigus vulgaris the desmosomes above the basal layer break while the hemidesmosomes stay intact, which is why the cleft is suprabasal."}, {"topic": "Introduction to dermatopathology", "source": "Intro to Dermatopathology [VM-PA001.1]", "stem": "Which description matches the papillary dermis?", "correct": "Thin, loose collagen bundles of type III that stain less eosinophilic", "distractors": ["Dense, irregular collagen bundles of type I that stain eosinophilic", "Mature adipose tissue divided by fibrous septa and vessels", "Thick elastic sheets with no collagen and no blood vessels"], "exp": "Papillary dermis: type III collagen, thin and loose. Reticular dermis: type I collagen, dense and irregular. Elastic fibres are in both but more numerous in the reticular dermis. Fat with fibrous septa describes the subcutis."}, {"topic": "Introduction to dermatopathology", "source": "Intro to Dermatopathology [VM-PA001.1]", "stem": "Where are the two vascular plexuses of the skin located?", "correct": "Superficial plexus in the papillary dermis, deep plexus in the reticular dermis", "distractors": ["Superficial plexus in the epidermis, deep plexus in the papillary dermis", "Superficial plexus in the reticular dermis, deep plexus in the subcutis only", "Both plexuses lie within the subcutaneous fat between the septa"], "exp": "The epidermis has no blood vessels. The superficial plexus lies in the papillary dermis and the deep plexus in the reticular dermis."}, {"topic": "Introduction to dermatopathology", "source": "Intro to Dermatopathology [VM-PA001.1]", "stem": "Which skin appendage is a scent gland that becomes fully developed at puberty?", "correct": "Apocrine gland", "distractors": ["Eccrine sweat gland", "Sebaceous gland", "Hair follicle"], "exp": "Apocrine glands are scent (odour) glands, fully developed at puberty. Eccrine sweat glands regulate body temperature, sebaceous glands secrete sebum to lubricate skin and hair, and hair helps temperature control and sweat evaporation."}, {"topic": "Introduction to dermatopathology", "source": "Intro to Dermatopathology [VM-PA001.1]", "stem": "A biopsy shows parakeratosis, no granular layer, pale glycogen rich keratinocytes and plasma cells underneath. What is the best interpretation?", "correct": "Normal mucosa", "distractors": ["Psoriasis of the skin", "Lichen planus of the skin", "Chronic dermatitis of the skin"], "exp": "In mucosa, parakeratosis is normal, there is no basket weave orthokeratosis and no granular layer (unless traumatised), keratinocytes look pale from abundant glycogen, there are no pilosebaceous units, plasma cells are a normal part of the submucosal infiltrate, and salivary glands may be present."}, {"topic": "Introduction to dermatopathology", "source": "Intro to Dermatopathology [VM-PA001.1]", "stem": "What does the term acanthosis mean?", "correct": "Increased thickness of the spinous layer", "distractors": ["Increased thickness of the horny layer", "Increased thickness of the granular layer", "Separation of keratinocytes from each other"], "exp": "Acanthosis: thick spinous layer. Hyperkeratosis: thick horny layer. Hypergranulosis: thick granular layer. Acantholysis: separation of keratinocytes from disruption of desmosomes."}, {"topic": "Introduction to dermatopathology", "source": "Intro to Dermatopathology [VM-PA001.1]", "stem": "Retention of nuclei within the horny layer is called what, and in which disease does the lecture show it?", "correct": "Parakeratosis, shown in psoriasis", "distractors": ["Orthokeratosis, shown in pemphigus vulgaris", "Hypergranulosis, shown in lichen planus", "Acanthosis, shown in a warty lesion"], "exp": "Parakeratosis means nuclei retained in the stratum corneum; the example is psoriasis. The other pairs are also real examples from the lecture but for different terms: orthokeratosis in pemphigus vulgaris, hypergranulosis in lichen planus, marked acanthosis and hyperkeratosis in a warty lesion."}, {"topic": "Introduction to dermatopathology", "source": "Intro to Dermatopathology [VM-PA001.1]", "stem": "In pemphigus vulgaris, why does the blister form just above the basal layer?", "correct": "Desmosomes above the basal cells are disrupted while hemidesmosomes stay intact", "distractors": ["Hemidesmosomes are disrupted while desmosomes between keratinocytes stay intact", "Intercellular oedema stretches the upper spinous layer until the cells rupture", "Friction destroys keratinocytes of the granular layer and the horny layer lifts"], "exp": "This is acantholysis: loss of cell cohesion from disrupted desmosomes. Because the hemidesmosomes hold, the basal cells stay attached to the basement membrane and the cleft, then vesicle, is suprabasal."}, {"topic": "Introduction to dermatopathology", "source": "Intro to Dermatopathology [VM-PA001.1]", "stem": "The lecture shows a thin epidermis with absent rete ridges. What is this called, and in which condition?", "correct": "Epidermal atrophy, in lichen sclerosus et atrophicus", "distractors": ["Epidermal atrophy, in lichen simplex chronicus", "Marked acanthosis, in lichen sclerosus et atrophicus", "Reticular degeneration, in acute atopic dermatitis"], "exp": "Epidermal atrophy is a thin epidermis with loss of rete ridges; the example is lichen sclerosus et atrophicus (LSA). Lichen simplex chronicus is the opposite picture: marked epidermal hyperplasia."}, {"topic": "Introduction to dermatopathology", "source": "Intro to Dermatopathology [VM-PA001.1]", "stem": "What is the difference between spongiosis and ballooning degeneration?", "correct": "Spongiosis is fluid between the cells; ballooning is fluid inside the cells", "distractors": ["Spongiosis is fluid inside the cells; ballooning is fluid between the cells", "Spongiosis is thickening of the spinous layer; ballooning is thinning of it", "Spongiosis affects the dermis only; ballooning affects the subcutis only"], "exp": "Spongiosis is intercellular oedema; if excessive it gives intraepidermal vesicles. Ballooning degeneration is accumulation of intracellular fluid after cell injury. Reticular degeneration combines both, with cell rupture leaving a meshwork of cell membranes."}, {"topic": "Introduction to dermatopathology", "source": "Intro to Dermatopathology [VM-PA001.1]", "stem": "According to the lecture, at what size does a vesicle become a bulla?", "correct": "Above 0.5 cm", "distractors": ["Above 0.1 cm", "Above 2 cm", "Above 5 cm"], "exp": "A blister is a fluid filled cavity, either intraepidermal or subepidermal. In this lecture a vesicle is under 0.5 cm and a bulla is over 0.5 cm. (Some textbooks use 1 cm, so use the lecture's number in this course.)"}, {"topic": "Introduction to dermatopathology", "source": "Intro to Dermatopathology [VM-PA001.1]", "stem": "Which mechanism of blister formation is caused by friction or heat?", "correct": "Cytolysis", "distractors": ["Acantholysis", "Spongiosis", "Reticular degeneration"], "exp": "The five mechanisms: spongiosis (with exocytosis), reticular degeneration, acantholysis, cytolysis (keratinocytes disrupted by friction or heat), and basement membrane zone disruption, for example ballooning degeneration of the basal layer."}, {"topic": "Introduction to dermatopathology", "source": "Intro to Dermatopathology [VM-PA001.1]", "stem": "Ballooning degeneration of the basal layer leads to a blister by which mechanism?", "correct": "Disruption of the basement membrane zone", "distractors": ["Loss of desmosomes in the spinous layer", "Excess keratin in the horny layer", "Rupture of the superficial vascular plexus"], "exp": "Damage to basal cells disrupts the basement membrane zone, so the split is at the junction (subepidermal). The lecture shows this next to hypergranulosis in a case of lichen planus."}, {"topic": "Spongiotic dermatitis (eczema)", "source": "ICC [VM016] Spongiotic dermatitis [VM-PA002.1]", "stem": "How is eczema (dermatitis) characterised clinically and histologically?", "correct": "Clinically by erythema and itching; histologically by spongiosis and inflammation", "distractors": ["Clinically by scaling and pain; histologically by acantholysis and necrosis", "Clinically by pallor and numbness; histologically by atrophy and fibrosis", "Clinically by pigmentation only; histologically by parakeratosis only"], "exp": "Dermatitis is inflammation of the skin. Spongiotic dermatitis equals spongiosis with associated inflammation, both perivascular in the dermis and extending into the epidermis."}, {"topic": "Spongiotic dermatitis (eczema)", "source": "ICC [VM016] Spongiotic dermatitis [VM-PA002.1]", "stem": "What does exocytosis mean in skin pathology?", "correct": "Inflammatory cells within the epidermis, with associated spongiosis", "distractors": ["Inflammatory cells around the dermal vessels, with dermal oedema", "Release of Odland body lipid into the intercellular space", "Shedding of parakeratotic scales from the horny layer"], "exp": "In spongiotic dermatitis the infiltrate is perivascular in the dermis and also moves up into the spongiotic epidermis. That presence of inflammatory cells (eosinophils or lymphocytes in the slides) inside the epidermis is exocytosis."}, {"topic": "Spongiotic dermatitis (eczema)", "source": "ICC [VM016] Spongiotic dermatitis [VM-PA002.1]", "stem": "What is the expected clinical presentation of reticular degeneration?", "correct": "An intraepidermal vesicle", "distractors": ["A subepidermal tense bulla", "A lichenified thick plaque", "A dry and atrophic patch"], "exp": "Reticular degeneration is oedema both within and between the cells. The cells rupture and leave a reticular meshwork of cell wall remnants, which forms a vesicle inside the epidermis."}, {"topic": "Spongiotic dermatitis (eczema)", "source": "ICC [VM016] Spongiotic dermatitis [VM-PA002.1]", "stem": "Which set of findings describes ACUTE spongiotic dermatitis?", "correct": "Normal stratum corneum and thickness, spongiosis, intraepidermal vesicles", "distractors": ["Thick stratum corneum, marked hyperplasia, no spongiosis, dermal fibrosis", "Early epidermal hyperplasia, smaller vesicles, patchy spongiosis only", "Thin epidermis with absent rete ridges and a band of dermal sclerosis"], "exp": "Acute: the stratum corneum and epidermal thickness are still normal; there is inter and intracellular oedema, reticular degeneration, intraepidermal vesicles, dermal oedema and a perivascular infiltrate of lymphocytes and histiocytes."}, {"topic": "Spongiotic dermatitis (eczema)", "source": "ICC [VM016] Spongiotic dermatitis [VM-PA002.1]", "stem": "What marks the move from acute to SUBACUTE dermatitis under the microscope?", "correct": "Regeneration starts: epidermal hyperplasia with smaller vesicles", "distractors": ["Necrosis starts: confluent epidermal necrosis with ulceration", "Fibrosis starts: dermal fibrosis with loss of all spongiosis", "Atrophy starts: thin epidermis with absent rete ridges"], "exp": "Subacute dermatitis shows the start of regeneration: epidermal hyperplasia, smaller vesicles, and areas of spongiosis and exocytosis still present."}, {"topic": "Spongiotic dermatitis (eczema)", "source": "ICC [VM016] Spongiotic dermatitis [VM-PA002.1]", "stem": "Which finding is typical of CHRONIC dermatitis?", "correct": "Thick stratum corneum, marked epidermal hyperplasia, no spongiosis, dermal fibroblasts", "distractors": ["Normal stratum corneum, normal thickness, large intraepidermal vesicles, dermal oedema", "Upper epidermal necrosis with many neutrophils and only slight spongiosis of the rest", "Suprabasal cleft with intact hemidesmosomes and rounded acantholytic keratinocytes"], "exp": "Chronic dermatitis: increased thickness of the stratum corneum, marked epidermal hyperplasia, no spongiosis or vesicles, and a dermal fibroblastic reaction that results from itching and rubbing."}, {"topic": "Spongiotic dermatitis (eczema)", "source": "ICC [VM016] Spongiotic dermatitis [VM-PA002.1]", "stem": "Which of the following is an EXOGENOUS dermatitis?", "correct": "Asteatotic dermatitis", "distractors": ["Atopic dermatitis", "Seborrheic dermatitis", "Discoid (nummular) dermatitis"], "exp": "Exogenous (environmental): contact dermatitis (allergic and irritant), infective dermatitis and asteatotic dermatitis. Endogenous (constitutional and hereditary): atopic, seborrheic, discoid (nummular), dyshidrotic (pompholyx) and autosensitization (Id) reaction."}, {"topic": "Spongiotic dermatitis (eczema)", "source": "ICC [VM016] Spongiotic dermatitis [VM-PA002.1]", "stem": "What is atopy?", "correct": "A predisposition to asthma, allergic rhinitis and atopic dermatitis", "distractors": ["A contact allergy to nickel, rubber, cosmetics and to fragrances", "A deficiency of zinc that weakens the barrier of the epidermis", "An overgrowth of Malassezia yeasts on greasy seborrheic skin"], "exp": "Atopy is the predisposition to asthma, allergic rhinitis and atopic dermatitis, with increased sensitivity to pruritic stimuli. About 70% of patients have a positive family history of atopy."}, {"topic": "Spongiotic dermatitis (eczema)", "source": "ICC [VM016] Spongiotic dermatitis [VM-PA002.1]", "stem": "Which is the most common type of dermatitis in children?", "correct": "Atopic dermatitis", "distractors": ["Nummular dermatitis", "Asteatotic dermatitis", "Irritant contact dermatitis"], "exp": "The lecture's conclusion: atopic dermatitis is the most common type in children, often appearing between the first six months and 5 years of life. The other childhood types are contact dermatitis, dyshidrotic eczema and seborrheic dermatitis (cradle cap)."}, {"topic": "Spongiotic dermatitis (eczema)", "source": "ICC [VM016] Spongiotic dermatitis [VM-PA002.1]", "stem": "According to the lecture, the skin barrier defect in atopic dermatitis is related to which abnormality?", "correct": "A filaggrin gene loss of function mutation or reduced claudin-1", "distractors": ["Autoantibodies against the desmoglein of the desmosomes", "Loss of the hemidesmosomes at the basement membrane zone", "Excess sebum from overactive sebaceous glands of the face and scalp"], "exp": "Atopic dermatitis is genetically controlled and related to loss of tight junctions, either through a filaggrin loss of function mutation or reduced expression of the tight junction protein claudin-1. Antibodies against desmoglein belong to pemphigus."}, {"topic": "Spongiotic dermatitis (eczema)", "source": "ICC [VM016] Spongiotic dermatitis [VM-PA002.1]", "stem": "Which type of hypersensitivity reaction does the lecture assign to atopic dermatitis?", "correct": "Type I", "distractors": ["Type II", "Type III", "Type IV"], "exp": "The lecture describes atopic dermatitis as a type I hypersensitivity reaction. Type IV (cell mediated, delayed) is the mechanism of allergic contact dermatitis."}, {"topic": "Spongiotic dermatitis (eczema)", "source": "ICC [VM016] Spongiotic dermatitis [VM-PA002.1]", "stem": "In the type I reaction, what happens on SECOND exposure to the allergen?", "correct": "Antigen binds IgE on mast cells and they degranulate", "distractors": ["Antigen presenting cells prime naive TH2 cells", "B cells switch for the first time to make IgE", "Memory T cells activate macrophages and cytotoxic T cells"], "exp": "First exposure: the antigen presenting cell activates TH2 cells, which stimulate B cells to make IgE (it coats mast cells) and recruit eosinophils. Second exposure: antigen cross links IgE, mast cells degranulate, and eosinophils release their granules, causing epithelial damage. Memory T cells with macrophages describes type IV."}, {"topic": "Spongiotic dermatitis (eczema)", "source": "ICC [VM016] Spongiotic dermatitis [VM-PA002.1]", "stem": "In the lecture's diagram of the type I reaction, which cytokine activates eosinophils?", "correct": "IL-5", "distractors": ["IL-10", "IL-2", "Interferon gamma"], "exp": "TH2 cells recruit eosinophils and IL-5 activates them. Release of eosinophil granules, together with mast cell degranulation, damages the epithelium."}, {"topic": "Spongiotic dermatitis (eczema)", "source": "ICC [VM016] Spongiotic dermatitis [VM-PA002.1]", "stem": "Which of these is listed as a triggering factor for atopic dermatitis?", "correct": "House dust mites", "distractors": ["Zinc deficiency", "Parkinson's disease", "Abnormal sweating"], "exp": "Triggers of atopic dermatitis: house dust mites, animals, moulds, food allergies, topical irritants and secondary infection (staphylococcal, herpes virus, tinea). Zinc deficiency and Parkinson's disease are linked to seborrheic dermatitis; abnormal sweating to pompholyx."}, {"topic": "Spongiotic dermatitis (eczema)", "source": "ICC [VM016] Spongiotic dermatitis [VM-PA002.1]", "stem": "A 9-month-old who has started crawling develops red, dry, itchy patches. Where does atopic dermatitis usually start at this age?", "correct": "Face, elbows and knees", "distractors": ["Palms and soles", "Diaper area", "Scalp only, as greasy scales"], "exp": "In infants and toddlers atopic dermatitis usually starts on the face or on the elbows and knees, areas that are easy to scratch and rub while crawling. It may then spread. In older children the flexures are involved."}, {"topic": "Spongiotic dermatitis (eczema)", "source": "ICC [VM016] Spongiotic dermatitis [VM-PA002.1]", "stem": "A child with acute atopic dermatitis scratches and the lesions start oozing. What is the microscopic explanation?", "correct": "Intraepidermal vesicles rupture when scratched", "distractors": ["Subepidermal bullae rupture when scratched", "Dermal abscesses drain through the epidermis", "Sebaceous glands discharge excess sebum"], "exp": "Acute atopic dermatitis is an acute spongiotic dermatitis. The blister sits inside the epidermis (intraepidermal vesicle). Scratching ruptures it, leading to oozing, crusting and infection."}, {"topic": "Spongiotic dermatitis (eczema)", "source": "ICC [VM016] Spongiotic dermatitis [VM-PA002.1]", "stem": "A 12-year-old with long standing atopic dermatitis has thick skin with prominent skin markings at the elbow flexure. What is this sign called, and what is seen in the dermis?", "correct": "Lichenification, with dermal fibrosis", "distractors": ["Lichenification, with dermal oedema", "Excoriation, with dermal necrosis", "Atrophy, with dermal sclerosis"], "exp": "Chronic rubbing produces lichenification: thick skin with prominent markings, with or without post inflammatory hyperpigmentation. Microscopically this is chronic dermatitis (lichen simplex chronicus): marked epidermal hyperplasia and dermal fibrosis."}, {"topic": "Spongiotic dermatitis (eczema)", "source": "ICC [VM016] Spongiotic dermatitis [VM-PA002.1]", "stem": "According to the lecture, what proportion of atopic dermatitis clears by 20 years of age?", "correct": "90%", "distractors": ["50%", "66%", "30%"], "exp": "Prognosis on the slide: 50% clear by 3 years, 66% by 6 years and 90% by 20 years."}, {"topic": "Spongiotic dermatitis (eczema)", "source": "ICC [VM016] Spongiotic dermatitis [VM-PA002.1]", "stem": "Seborrheic dermatitis has two peak age groups. Which are they?", "correct": "Babies under 3 months and adults from 30 to 60 years", "distractors": ["Children of 6 months to 5 years and adults over 70", "Teenagers and young adults only", "School children of 6 to 12 years and pregnant women"], "exp": "Seborrheic dermatitis affects babies younger than 3 months (cradle cap) and adults from 30 to 60. Six months to 5 years is the usual onset of atopic dermatitis; teenagers and young adults is the age group of pompholyx."}, {"topic": "Spongiotic dermatitis (eczema)", "source": "ICC [VM016] Spongiotic dermatitis [VM-PA002.1]", "stem": "Which description fits the clinical picture of seborrheic dermatitis?", "correct": "Greasy, white, flaky scales over erythematous patches", "distractors": ["Coin-shaped, scaly, crusted, itchy plaques", "Itchy vesicles and bullae on the hands and feet", "Thick skin with prominent markings in the flexures"], "exp": "Seborrheic dermatitis: greasy, white or yellow flaky scaling over red patches; it may itch but is usually not painful. Sites: scalp (dandruff when mild, cradle cap in infants), eyebrows, eyelids, forehead, nasolabial folds, chest and skin creases. Coin-shaped plaques are nummular eczema; hand and foot vesicles are pompholyx."}, {"topic": "Spongiotic dermatitis (eczema)", "source": "ICC [VM016] Spongiotic dermatitis [VM-PA002.1]", "stem": "Which organism is linked to the pathogenesis of seborrheic dermatitis?", "correct": "Malassezia (Pityrosporum) yeast", "distractors": ["Staphylococcus aureus bacteria", "Herpes simplex virus infection", "Dermatophyte (tinea) infection"], "exp": "There is a possible link to Malassezia species, with increased Pityrosporum orbiculare yeasts. Sebum is a food source for the yeast, and the immune system reacts to yeast byproducts. Staphylococcus, herpes and tinea are listed as secondary infections that trigger atopic dermatitis."}, {"topic": "Spongiotic dermatitis (eczema)", "source": "ICC [VM016] Spongiotic dermatitis [VM-PA002.1]", "stem": "Why is seborrheic dermatitis more common in patients with Parkinson's disease?", "correct": "Dopamine loss and autonomic dysfunction raise sebum, which feeds Malassezia", "distractors": ["Levodopa treatment directly causes a type IV reaction in the skin of the face", "The tremor causes constant friction and cytolysis of the facial keratinocytes", "Reduced sweating dries the skin and removes the lipid barrier of the epidermis"], "exp": "Dopamine loss impairs skin neurotransmitter signalling and leads to excessive oil production; cutaneous autonomic dysfunction hyperactivates the sebaceous glands; the extra sebum lets Malassezia multiply and trigger inflammation."}, {"topic": "Spongiotic dermatitis (eczema)", "source": "ICC [VM016] Spongiotic dermatitis [VM-PA002.1]", "stem": "Why do patients with HIV have more seborrheic dermatitis, according to the lecture?", "correct": "CD4 T cell loss frees the microflora, and malabsorption causes zinc deficiency", "distractors": ["High IgE levels cause repeated mast cell degranulation in the skin of the scalp", "Antiretroviral drugs act as chronic irritants and remove the skin lipid barrier", "Nickel in the medication causes a type IV allergic contact dermatitis of the face"], "exp": "With CD4 T cells depleted, the skin microflora escapes T cell control and flourishes. HIV also causes intestinal malabsorption, giving acquired zinc deficiency; without zinc the epidermal barrier collapses and Malassezia penetrates deeply and triggers cytokines."}, {"topic": "Spongiotic dermatitis (eczema)", "source": "ICC [VM016] Spongiotic dermatitis [VM-PA002.1]", "stem": "What is the microscopic picture of seborrheic dermatitis?", "correct": "Subacute dermatitis, spongiosis of epidermis and follicles, scales with neutrophils in the ostia", "distractors": ["Acute dermatitis, large intraepidermal vesicles lying under a very thick acral stratum corneum", "Chronic dermatitis, marked epidermal hyperplasia, no spongiosis at all and dense dermal fibrosis", "Upper epidermal necrosis, marked ballooning degeneration and scattered necrotic keratinocytes"], "exp": "Seborrheic dermatitis is a subacute dermatitis: spongiosis in the epidermis and the hair follicle epithelium, dilated follicular ostia containing scales with neutrophils, and epidermal hyperplasia."}, {"topic": "Spongiotic dermatitis (eczema)", "source": "ICC [VM016] Spongiotic dermatitis [VM-PA002.1]", "stem": "A 17-year-old has an itchy vesicular rash on both palms and soles that flares every summer. What is the most likely diagnosis?", "correct": "Dyshidrotic eczema (pompholyx)", "distractors": ["Seborrheic dermatitis of the skin", "Nummular (discoid) eczema", "Lichen simplex chronicus"], "exp": "Pompholyx (bubble in ancient Greek) is hand and foot eczema of teenagers and young adults: a pruritic vesicular or bullous rash, usually bilateral and often symmetrical, frequently developing in summer. Possible causes: abnormal sweating, nickel allergy, aggravated by stress."}, {"topic": "Spongiotic dermatitis (eczema)", "source": "ICC [VM016] Spongiotic dermatitis [VM-PA002.1]", "stem": "A biopsy of pompholyx shows an acute spongiotic dermatitis with intraepidermal vesicles. Which feature tells you the skin is acral?", "correct": "A thick stratum corneum", "distractors": ["A thin stratum corneum", "Many sebaceous glands", "Abundant hair follicles"], "exp": "Acral skin (palms and soles) has a thick stratum corneum. This is the lecturer's own question on the pompholyx slide."}, {"topic": "Spongiotic dermatitis (eczema)", "source": "ICC [VM016] Spongiotic dermatitis [VM-PA002.1]", "stem": "What is the mechanism of allergic contact dermatitis?", "correct": "Type IV cell mediated delayed hypersensitivity after earlier sensitisation", "distractors": ["Type I IgE mediated immediate hypersensitivity on the very first exposure", "Direct toxic damage to the skin barrier without any immune step at all", "Type III immune complex deposition in the walls of the dermal vessels"], "exp": "First exposure causes no reaction but creates memory helper T cells. On later exposure they are reactivated, release inflammatory cytokines, and stimulate macrophages and cytotoxic T cells to produce the lesion at the contact site. Direct toxic damage is irritant contact dermatitis."}, {"topic": "Spongiotic dermatitis (eczema)", "source": "ICC [VM016] Spongiotic dermatitis [VM-PA002.1]", "stem": "An infant has eczema exactly under the metal snaps of his clothes. What is the most likely cause?", "correct": "Allergic contact dermatitis to nickel", "distractors": ["Irritant contact dermatitis to detergent", "Atopic dermatitis triggered by dust mites", "Seborrheic dermatitis from Malassezia"], "exp": "Nickel allergy is one of the most common causes of contact dermatitis in children. Infants react at the site of snaps; older children react to watches, chains, belt buckles (periumbilical) or earrings. Other allergic causes: poison ivy, rubber, cosmetics, fragrances."}, {"topic": "Spongiotic dermatitis (eczema)", "source": "ICC [VM016] Spongiotic dermatitis [VM-PA002.1]", "stem": "What is the most common irritant contact dermatitis in infants, and what causes it?", "correct": "Diaper rash, from long contact with chemicals in urine and stool", "distractors": ["Cradle cap, from overgrowth of Malassezia yeast on the scalp", "Pompholyx, from abnormal sweating of the hands and the feet", "Nickel dermatitis, from the metal snaps on the baby's garments"], "exp": "Diaper dermatitis is a non immune reaction to the natural chemicals of urine and stool. Irritants damage the skin by removing surface lipids, damaging cell membranes, denaturing keratins, releasing cytokines and direct cytotoxicity."}, {"topic": "Spongiotic dermatitis (eczema)", "source": "ICC [VM016] Spongiotic dermatitis [VM-PA002.1]", "stem": "Which microscopic feature points to IRRITANT rather than allergic contact dermatitis?", "correct": "Necrotic keratinocytes in the upper epidermis with neutrophils", "distractors": ["Marked spongiosis of the lower epidermis with many vesicles", "Eosinophils and lymphocytes inside a spongiotic epidermis", "A perivascular infiltrate of lymphocytes and eosinophils"], "exp": "Irritant: starts in the upper epidermis, slight spongiosis without vesicles, marked ballooning, necrotic keratinocytes, neutrophils, erosions may be present. Allergic: starts in the lower epidermis, marked spongiosis with vesicles, slight ballooning, no necrotic keratinocytes, lymphocytes and eosinophils, no neutrophils."}, {"topic": "Spongiotic dermatitis (eczema)", "source": "ICC [VM016] Spongiotic dermatitis [VM-PA002.1]", "stem": "In allergic contact dermatitis, where does the inflammation start, and which cells show exocytosis?", "correct": "In the papillary dermis, with exocytosis by monocytes and eosinophils", "distractors": ["In the upper half of the epidermis, with exocytosis by neutrophils", "In the subcutaneous fat, with exocytosis by plasma cells", "In the hair follicle ostia, with exocytosis by neutrophils"], "exp": "In allergic contact dermatitis inflammation is initiated within the papillary dermis and cells then move up into the epidermis. In irritant contact dermatitis the damage is direct and the inflammation sits in the upper half of the epidermis."}, {"topic": "Spongiotic dermatitis (eczema)", "source": "ICC [VM016] Spongiotic dermatitis [VM-PA002.1]", "stem": "What happens microscopically with a HIGHLY concentrated irritant?", "correct": "Marked ballooning and keratinocyte necrosis, single cells to confluent zones, with neutrophils", "distractors": ["Marked spongiosis with many eosinophils, a picture identical to allergic contact dermatitis", "Marked epidermal hyperplasia with dermal fibrosis, a picture identical to lichen simplex", "Suprabasal acantholysis with intact hemidesmosomes, a picture identical to pemphigus"], "exp": "The picture of irritant dermatitis depends on the nature of the irritant and the duration of exposure. Strong irritants give ballooning degeneration and necrosis of the upper epidermis with neutrophils. Lower concentrations give spongiosis, dermal oedema and perivascular infiltrates similar to allergic contact dermatitis."}, {"topic": "Spongiotic dermatitis (eczema)", "source": "ICC [VM016] Spongiotic dermatitis [VM-PA002.1]", "stem": "Scaly, crusted, itchy, coin-shaped plaques are typical of which condition, and what is its microscopic picture?", "correct": "Nummular eczema, a subacute spongiotic dermatitis", "distractors": ["Pompholyx, an acute spongiotic dermatitis", "Lichen simplex chronicus, a chronic dermatitis", "Seborrheic dermatitis, a chronic dermatitis"], "exp": "Nummular (discoid) eczema gives coin-shaped plaques and shows a subacute spongiotic dermatitis. It belongs to the endogenous group."}, {"topic": "Ophthalmology examination", "source": "ICC-FCP [VM 058] Ophthalmology examination [VM-SSO001.7]", "stem": "Before starting an eye examination, which sequence of opening steps does the lecture give?", "correct": "Hand washing, greeting, introduction, consent, positioning", "distractors": ["Positioning, inspection, hand washing, greeting, consent", "Greeting, visual acuity, consent, hand washing, positioning", "Consent, fundus examination, introduction, hand washing"], "exp": "Every examination starts with hand washing, greeting, introducing yourself, explaining the examination to obtain consent, and positioning the patient."}, {"topic": "Ophthalmology examination", "source": "ICC-FCP [VM 058] Ophthalmology examination [VM-SSO001.7]", "stem": "What are the four main steps of the eye examination, in order?", "correct": "Inspection, history taking, examination, recording", "distractors": ["History taking, recording, inspection, examination", "Examination, inspection, recording, history taking", "Recording, history taking, examination, inspection"], "exp": "The lecture lists the steps as inspection, history taking, examination and recording."}, {"topic": "Ophthalmology examination", "source": "ICC-FCP [VM 058] Ophthalmology examination [VM-SSO001.7]", "stem": "During inspection of the eye itself, which structures does the lecture ask you to look at?", "correct": "Lids, conjunctiva, sclera, pupil and iris", "distractors": ["Lens, vitreous, retina, macula and optic disc", "Cornea, lens, retina and optic nerve only", "Lacrimal gland, orbit, sinuses and eyebrows"], "exp": "Inspection has three parts: around the bed (walking aids, glasses), general inspection (unilateral weakness, facial asymmetry) and the eye (lids, conjunctiva, sclera, pupil, iris). The retina and disc need fundus examination, which is taught later."}, {"topic": "Ophthalmology examination", "source": "ICC-FCP [VM 058] Ophthalmology examination [VM-SSO001.7]", "stem": "Which set of findings can be picked up by simple inspection of the eyes?", "correct": "Lid ptosis, conjunctival redness or pallor, and a dilated pupil", "distractors": ["Cataract grade, cup to disc ratio and the presence of macular oedema", "Intraocular pressure, extent of visual field and type of colour defect", "Refractive error, near visual acuity and early retinal detachment"], "exp": "The inspection slide shows ptosis of the lid, redness and pallor of the conjunctiva, and a dilated pupil. The other items need instruments or formal tests."}, {"topic": "Ophthalmology examination", "source": "ICC-FCP [VM 058] Ophthalmology examination [VM-SSO001.7]", "stem": "In the brief history, how should the chief complaint be recorded?", "correct": "In the patient's own words, such as redness, burning or flashes of light", "distractors": ["In medical terms chosen by the examiner once the examination is finished", "Only as a final diagnosis, such as cataract, glaucoma or retinal disease", "Only after the visual acuity has been measured and recorded in both eyes"], "exp": "Start with the chief presenting complaint in the patient's own words, then the past ophthalmic history: surgeries, medications and trauma."}, {"topic": "Ophthalmology examination", "source": "ICC-FCP [VM 058] Ophthalmology examination [VM-SSO001.7]", "stem": "Which group of questions about visual loss does the lecture ask you to cover?", "correct": "Sudden or gradual, painful or not, transient or persistent, one or both eyes, local or systemic", "distractors": ["Morning or evening, indoor or outdoor, with or without food, seasonal or constant, hot or cold", "Hereditary or acquired, benign or malignant, primary or secondary, treated or untreated", "Red or white eye, wet or dry eye, large or small pupil, light or dark iris, open or closed lid"], "exp": "These five pairs are the core of the eye history. The checklist adds whether the vision is blurred, dimmed or distorted, the type of field loss, and triggers such as sun, headlights or cinema."}, {"topic": "Ophthalmology examination", "source": "ICC-FCP [VM 058] Ophthalmology examination [VM-SSO001.7]", "stem": "In the lecture's list of field loss types, what does a lesion of the macula produce?", "correct": "Loss of central vision", "distractors": ["An enlarged blind spot", "Loss of peripheral vision", "Bitemporal hemianopia"], "exp": "The slide pairs them as: disc equals blind spot, macular equals central vision, retinal disease equals peripheral loss. It also lists bitemporal and homonymous hemianopia, and scotomas (central, arcuate, altitudinal)."}, {"topic": "Ophthalmology examination", "source": "ICC-FCP [VM 058] Ophthalmology examination [VM-SSO001.7]", "stem": "At what standard distance is distance visual acuity tested with the Snellen chart?", "correct": "6 metres (20 feet)", "distractors": ["3 metres (10 feet)", "1 metre (3 feet)", "40 centimetres (16 inches)"], "exp": "The patient sits 6 m or 20 ft from the chart, unless a modified chart is used. 40 cm (16 inches) is the distance for near vision."}, {"topic": "Ophthalmology examination", "source": "ICC-FCP [VM 058] Ophthalmology examination [VM-SSO001.7]", "stem": "How is distance visual acuity read from the Snellen chart?", "correct": "Each eye is tested separately, and the lowest line read correctly is the acuity", "distractors": ["Both eyes are tested together, and the top line read correctly is the acuity", "Each eye is tested separately, and the first line with any mistake is the acuity", "Both eyes are tested together, and the average of three lines is the acuity"], "exp": "Cover one eye with the occluder, ask the patient to read down the chart, and record the lowest correct line as the distance visual acuity. Then repeat for the other eye."}, {"topic": "Ophthalmology examination", "source": "ICC-FCP [VM 058] Ophthalmology examination [VM-SSO001.7]", "stem": "A patient reads further down the chart when looking through the pinhole occluder. What does this mean?", "correct": "There is an uncorrected refractive error", "distractors": ["There is a dense cataract in that eye", "There is disease of the macula", "There is a red-green colour deficiency"], "exp": "If reading improves through the pinhole, the patient has an uncorrected refractive error. The pinhole test is done one eye after the other."}, {"topic": "Ophthalmology examination", "source": "ICC-FCP [VM 058] Ophthalmology examination [VM-SSO001.7]", "stem": "How is near visual acuity tested?", "correct": "At 40 cm (16 inches), glasses on if needed, one eye occluded, reading Jaeger text", "distractors": ["At 6 m (20 feet), glasses off, both eyes open, reading the letters of a Snellen chart", "At 75 cm, glasses on if needed, both eyes open, reading the numbers on Ishihara plates", "At 1 m (3 feet), glasses off, one eye occluded, counting the examiner's fingers"], "exp": "The patient holds the book (Jaeger notation) at a comfortable distance of about 40 cm with reading glasses on if required, one eye occluded, and reads the smallest text possible. Record the smallest line read."}, {"topic": "Ophthalmology examination", "source": "ICC-FCP [VM 058] Ophthalmology examination [VM-SSO001.7]", "stem": "No near vision chart is available. According to the lecture, which everyday text can be used, and what sizes does it represent?", "correct": "A newspaper: most text is N8 and headlines are N12", "distractors": ["A newspaper: most text is N12 and headlines are N48", "A mobile phone: most text is N5 and titles are N6", "A prescription pad: all text is N18"], "exp": "If Jaeger text is not available, most newspaper text is N8 and headlines are N12."}, {"topic": "Ophthalmology examination", "source": "ICC-FCP [VM 058] Ophthalmology examination [VM-SSO001.7]", "stem": "At what distance should the patient hold the Ishihara colour plates?", "correct": "75 cm", "distractors": ["40 cm", "6 m", "10 cm"], "exp": "Use the 24 to 38 plate edition of the Ishihara plates, held at 75 cm."}, {"topic": "Ophthalmology examination", "source": "ICC-FCP [VM 058] Ophthalmology examination [VM-SSO001.7]", "stem": "Which colour vision defect do the Ishihara plates detect?", "correct": "Red-green deficiency only", "distractors": ["Blue-yellow deficiency only", "Both red-green and blue-yellow deficiency", "Total colour blindness only"], "exp": "The Ishihara plates detect red-green colour deficiency only."}, {"topic": "Ophthalmology examination", "source": "ICC-FCP [VM 058] Ophthalmology examination [VM-SSO001.7]", "stem": "Which of these is NOT one of the four designs of Ishihara plates?", "correct": "Amsler grid design", "distractors": ["Vanishing design", "Transformation design", "Hidden digit design"], "exp": "The four designs are vanishing, transformation, hidden digit and classification. The Amsler grid is a different test and is not part of the Ishihara plates."}, {"topic": "Ophthalmology examination", "source": "ICC-FCP [VM 058] Ophthalmology examination [VM-SSO001.7]", "stem": "What is the correct order when testing colour vision?", "correct": "Both eyes together first (glasses on), then the right eye alone, then the left", "distractors": ["Right eye first (glasses off), then the left eye, and never both eyes together", "The worse eye first (glasses off), then both eyes together from 6 metres away", "Both eyes together only, because colour vision defects are always bilateral"], "exp": "Ask the patient to read the plates with both eyes first, wearing glasses if they use them. Then cover the left eye and test the right, and the reverse. Compare the answers with the chart and record the plates missed."}, {"topic": "Eye OSCE checklist: history, VA, color vision", "source": "Ophthalmology examination checklist [VM-SSO001.7]", "stem": "In the OSCE, what must you ask the patient before measuring visual acuity?", "correct": "Whether he wears glasses or contact lenses, or has had previous eye surgery", "distractors": ["Whether he has a family history of atopy, asthma or allergic rhinitis", "Whether he has eaten in the last six hours and has an escort home", "Whether he can name the four designs of the Ishihara plates"], "exp": "The checklist: wash hands, greet and introduce yourself, explain and obtain consent, seat the patient at 6 m (20 ft), then ask about glasses, contact lenses and previous eye surgeries."}, {"topic": "Eye OSCE checklist: history, VA, color vision", "source": "Ophthalmology examination checklist [VM-SSO001.7]", "stem": "When you look around the bed at the start of the station, which item does the checklist add to walking aids and glasses?", "correct": "A white stick", "distractors": ["A hearing aid", "An oxygen cylinder", "A glucose meter"], "exp": "The checklist says: look around the bed, for example walking aids, white stick, glasses. Then general inspection (unilateral weakness, facial asymmetry), then the eye itself."}, {"topic": "Eye OSCE checklist: history, VA, color vision", "source": "Ophthalmology examination checklist [VM-SSO001.7]", "stem": "In which order is distance visual acuity measured?", "correct": "Uncorrected acuity (without glasses) first, then best corrected acuity (with glasses)", "distractors": ["Best corrected acuity (with glasses) first, then uncorrected acuity (without glasses)", "Pinhole acuity first, then near acuity, and distance acuity last", "Only best corrected acuity is measured; uncorrected acuity is not needed"], "exp": "UCVA (without glasses) is measured first and BCVA (with glasses) next. Each eye is tested separately."}, {"topic": "Eye OSCE checklist: history, VA, color vision", "source": "Ophthalmology examination checklist [VM-SSO001.7]", "stem": "A patient cannot read any letter on the Snellen chart. What is the correct next sequence?", "correct": "Count fingers, then hand movements, then perception of light", "distractors": ["Perception of light, then hand movements, then count fingers", "Hand movements, then count fingers, then Ishihara plates", "Near vision chart, then pinhole test, then fundus examination"], "exp": "If no letters are seen, test the ability to count fingers (CF), then to see hand movements (HM), then to perceive light (PL). You go from the better level of vision down to the worst."}, {"topic": "Eye OSCE checklist: history, VA, color vision", "source": "Ophthalmology examination checklist [VM-SSO001.7]", "stem": "Which question about the quality of vision is added in the checklist history?", "correct": "Is the vision blurred, dimmed or distorted?", "distractors": ["Is the vision better after meals or after sleep?", "Is the vision worse when lying on the left side?", "Is the vision linked to hearing loss or tinnitus?"], "exp": "The checklist history: sudden or gradual, painful, transient or persistent, one or both eyes, local or systemic, blurred, dimmed or distorted, type of field loss, and triggers (sun, headlights, cinema)."}, {"topic": "Eye OSCE checklist: history, VA, color vision", "source": "Ophthalmology examination checklist [VM-SSO001.7]", "stem": "A patient has lost the outer (temporal) half of the visual field in BOTH eyes. Which term from the checklist describes this?", "correct": "Bitemporal hemianopia", "distractors": ["Homonymous hemianopia", "Central scotoma", "Altitudinal scotoma"], "exp": "Bitemporal hemianopia is loss of both temporal half fields. Homonymous hemianopia is loss of the same side (right or left) in both eyes. A scotoma is a patch of lost vision: central, arcuate or altitudinal (upper or lower half)."}, {"topic": "Eye OSCE checklist: history, VA, color vision", "source": "Ophthalmology examination checklist [VM-SSO001.7]", "stem": "After the near vision test, what exactly do you record?", "correct": "The smallest line the patient can read", "distractors": ["The largest line the patient can read", "The time taken to read the first paragraph", "The distance at which the text becomes blurred"], "exp": "Near vision: 40 cm, glasses on if required, one eye occluded, Jaeger text, and record the smallest line read. For distance vision you record the lowest correct Snellen line."}, {"topic": "Eye OSCE checklist: history, VA, color vision", "source": "Ophthalmology examination checklist [VM-SSO001.7]", "stem": "After the colour vision test, what do you record?", "correct": "The plates (frames) the patient missed, after comparing answers with the chart", "distractors": ["Only whether the patient is male or female, since the defect is inherited", "The total time the patient needed to read all the plates", "The plates the patient liked best, to repeat at the next visit"], "exp": "Compare the patient's answers with the answer chart and record the frames that were missed. Test both eyes first, then each eye alone, at 75 cm."}];
const KEY = "hesham_y3_w00D_best";
const $ = id => document.getElementById(id);
const topics = [...new Set(BANK.map(q => q.topic))];
let mode = "practice", count = 0, set = [], idx = 0, answers = [], tick = null, left = 0;

function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function esc(s){return s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]))}
function best(){try{return JSON.parse(localStorage.getItem(KEY))||{}}catch(e){return {}}}
function saveBest(b){try{localStorage.setItem(KEY,JSON.stringify(b))}catch(e){}}
function show(id){["start","quiz","done"].forEach(s=>$(s).classList.toggle("hidden",s!==id));window.scrollTo(0,0)}

function drawStart(){
  const b = best();
  $("topics").innerHTML = topics.map((t,i)=>{
    const n = BANK.filter(q=>q.topic===t).length;
    const last = b[t]!=null ? "best "+b[t]+"%" : "not tried yet";
    return `<label class="topic"><input type="checkbox" value="${i}" checked><span class="name">${esc(t)}</span><span class="meta">${n} questions, ${last}</span></label>`;
  }).join("");
  setNote();
}
function setNote(){
  $("modeNote").textContent = mode==="practice"
    ? "Practice: you see the right answer and the explanation after each question."
    : "Exam: timed at 72 seconds per question, like the real paper. Answers and explanations come at the end.";
}
function pick(group, btn, attr){[...$(group).children].forEach(b=>b.setAttribute("aria-pressed", b===btn));return btn.dataset[attr]}
$("count").onclick = e => {if(e.target.tagName==="BUTTON") count = +pick("count", e.target, "n")};
$("mode").onclick = e => {if(e.target.tagName==="BUTTON"){mode = pick("mode", e.target, "m"); setNote()}};

function begin(pool){
  set = pool.map(q => ({q, opts: shuffle([q.correct, ...q.distractors])}));
  idx = 0; answers = new Array(set.length).fill(null);
  $("qt").textContent = set.length;
  $("strip").innerHTML = set.map(()=>"<i></i>").join("");
  clearInterval(tick);
  if(mode==="exam"){
    left = set.length*72; $("timer").classList.remove("hidden"); paintTimer();
    tick = setInterval(()=>{left--; paintTimer(); if(left<=0) finish()},1000);
  } else $("timer").classList.add("hidden");
  show("quiz"); drawQ();
}
function paintTimer(){const m=Math.floor(left/60),s=left%60;$("timer").textContent=m+":"+String(s).padStart(2,"0");$("timer").classList.toggle("low",left<60)}

$("go").onclick = () => {
  const chosen = [...document.querySelectorAll("#topics input:checked")].map(i=>topics[+i.value]);
  if(!chosen.length){alert("Pick at least one lecture.");return}
  let pool = shuffle(BANK.filter(q=>chosen.includes(q.topic)));
  if(count && count<pool.length) pool = pool.slice(0,count);
  begin(pool);
};

function drawQ(){
  const {q,opts} = set[idx]; let sel = null, locked = false;
  $("qn").textContent = idx+1; $("qtag").textContent = q.topic; $("stem").textContent = q.stem; $("exp").innerHTML = "";
  [...$("strip").children].forEach((el,i)=>{
    const a = answers[i];
    el.className = i===idx ? "now" : a==null ? "" : mode==="exam" ? "done" : (a===set[i].q.correct ? "ok" : "no");
  });
  const nx = $("next"); nx.disabled = true;
  nx.textContent = mode==="practice" ? "Check answer" : (idx===set.length-1 ? "Finish exam" : "Next question");
  $("opts").innerHTML = opts.map((o,i)=>`<button class="opt" data-i="${i}"><span class="k">${"ABCDE"[i]}</span><span>${esc(o)}</span></button>`).join("");
  const btns = [...$("opts").children];
  btns.forEach(b => b.onclick = () => {
    if(locked) return; sel = opts[+b.dataset.i];
    btns.forEach(x=>x.classList.toggle("sel",x===b)); nx.disabled = false;
  });
  nx.onclick = () => {
    if(mode==="practice" && !locked){
      locked = true; answers[idx] = sel; const ok = sel===q.correct;
      btns.forEach(b=>{const o=opts[+b.dataset.i]; b.disabled=true; b.classList.remove("sel");
        if(o===q.correct) b.classList.add("right"); else if(o===sel) b.classList.add("bad")});
      $("exp").innerHTML = `<div class="exp ${ok?"":"no"}"><b class="verdict">${ok?"Correct.":"Not this time."}</b>${esc(q.exp)}<span class="src">From: ${esc(q.source)}</span></div>`;
      $("strip").children[idx].className = ok?"ok":"no";
      nx.textContent = idx===set.length-1 ? "See my result" : "Next question";
      return;
    }
    if(mode==="exam") answers[idx] = sel;
    if(idx===set.length-1) finish(); else {idx++; drawQ(); window.scrollTo(0,0)}
  };
}
$("quit").onclick = () => {if(confirm("End the quiz now and see your result?")) finish()};

function finish(){
  clearInterval(tick);
  const total = set.length, right = set.filter((s,i)=>answers[i]===s.q.correct).length;
  const pct = Math.round(100*right/total);
  $("score").textContent = right+" / "+total;
  $("scoreNote").textContent = pct+"%. " + (pct>=85 ? "Strong. Keep these lectures warm with a short retry next week."
    : pct>=65 ? "Good base. Go through the review list below, then retry the missed ones."
    : "Read the high yield sheet for the weak lectures first, then come back.");
  const b = best();
  $("byTopic").innerHTML = topics.filter(t=>set.some(s=>s.q.topic===t)).map(t=>{
    const items = set.map((s,i)=>[s,i]).filter(([s])=>s.q.topic===t);
    const r = items.filter(([s,i])=>answers[i]===s.q.correct).length, p = Math.round(100*r/items.length);
    if(items.length>=5 && (b[t]==null || p>b[t])) b[t]=p;
    return `<div class="row"><span>${esc(t)}</span><strong>${r} / ${items.length}</strong><div class="track"><span class="${p<65?"weak":""}" style="width:${p}%"></span></div></div>`;
  }).join("");
  saveBest(b);
  const missed = set.map((s,i)=>[s,i]).filter(([s,i])=>answers[i]!==s.q.correct);
  $("retry").classList.toggle("hidden", !missed.length);
  $("revTitle").textContent = missed.length ? "Questions to review ("+missed.length+")" : "Nothing to review. All correct.";
  $("reviews").innerHTML = missed.map(([s,i])=>`<div class="review"><span class="tag">${esc(s.q.topic)}</span>
    <div class="stem">${esc(s.q.stem)}</div>
    <p class="you">${answers[i]==null?"You left this one blank.":"You chose: "+esc(answers[i])}</p>
    <p class="ans">Answer: ${esc(s.q.correct)}</p><p>${esc(s.q.exp)}</p></div>`).join("");
  $("retry").onclick = () => {mode="practice"; begin(shuffle(missed.map(([s])=>s.q)))};
  show("done");
}
$("home").onclick = () => {[...$("mode").children].forEach(b=>b.setAttribute("aria-pressed", b.dataset.m===mode)); drawStart(); show("start")};
drawStart();
</script>
