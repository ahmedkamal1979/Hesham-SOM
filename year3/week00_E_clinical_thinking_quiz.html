<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Year 3 Week 00 E: Clinical thinking and EBM quiz</title>
<style>
:root{
  --paper:#EEF4F2; --card:#FFFFFF; --ink:#0F2A33; --soft:#4C666E; --line:#C9D8D4;
  --scrub:#1B7567; --scrub-dark:#125548; --scrub-tint:#DCEEEA;
  --wrong:#B23A30; --wrong-tint:#F7E3E0; --amber:#B7790C;
  --ui:"Avenir Next","Segoe UI",system-ui,-apple-system,Roboto,sans-serif;
  --read:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
}
@media (prefers-color-scheme:dark){
  :root{--paper:#0C1F25;--card:#132E36;--ink:#E6F0EE;--soft:#9DB5B8;--line:#27474F;
  --scrub:#4FB8A5;--scrub-dark:#7FD3C3;--scrub-tint:#17403F;--wrong:#E8867C;--wrong-tint:#42211F;--amber:#E0A93F;}
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--ui);line-height:1.5;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
.wrap{max-width:760px;margin:0 auto;padding:20px 18px 60px}
h1{font-family:var(--read);font-weight:600;font-size:2rem;line-height:1.15;margin:18px 0 6px;letter-spacing:-.01em}
h2{font-size:1.05rem;margin:26px 0 10px}
p.lead{color:var(--soft);margin:0 0 8px;max-width:60ch}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible,label:focus-within{outline:3px solid var(--amber);outline-offset:2px}
.hidden{display:none!important}

/* start screen */
.topic{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);
  border-radius:10px;padding:13px 14px;margin-bottom:8px}
.topic input{width:22px;height:22px;accent-color:var(--scrub);flex:none}
.topic .name{flex:1;font-weight:600}
.topic .meta{color:var(--soft);font-size:.86rem;white-space:nowrap}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--card)}
.seg button{flex:1;border:0;background:none;padding:12px 8px;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--scrub);color:#fff;font-weight:600}
.note{color:var(--soft);font-size:.9rem;margin:8px 0 0}
.primary{display:block;width:100%;margin-top:26px;border:0;border-radius:12px;background:var(--scrub);
  color:#fff;font-weight:700;font-size:1.08rem;padding:16px}
.primary:active{background:var(--scrub-dark)}
.primary:disabled{opacity:.45}
.ghost{background:none;border:1px solid var(--line);border-radius:10px;padding:11px 16px}

/* count strip: one mark per question */
.strip{display:flex;gap:2px;margin:6px 0 18px;height:12px}
.strip i{flex:1;border-radius:2px;background:var(--line);min-width:2px}
.strip i.ok{background:var(--scrub)} .strip i.no{background:var(--wrong)}
.strip i.done{background:var(--soft)} .strip i.now{background:var(--amber);transform:scaleY(1.5)}
.bar{display:flex;justify-content:space-between;align-items:center;gap:12px;color:var(--soft);font-size:.92rem}
.bar strong{color:var(--ink)}
.timer{font-variant-numeric:tabular-nums;font-weight:700;color:var(--ink)}
.timer.low{color:var(--wrong)}

/* question */
.tag{display:inline-block;background:var(--scrub-tint);color:var(--scrub-dark);border-radius:6px;
  padding:3px 9px;font-size:.82rem;font-weight:600}
.stem{font-family:var(--read);font-size:1.28rem;line-height:1.5;margin:14px 0 18px;max-width:62ch}
.opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;background:var(--card);
  border:1.5px solid var(--line);border-radius:12px;padding:14px;margin-bottom:10px;min-height:54px}
.opt .k{flex:none;width:28px;height:28px;border-radius:50%;border:1.5px solid var(--line);
  display:grid;place-items:center;font-weight:700;font-size:.88rem;color:var(--soft)}
.opt.sel{border-color:var(--scrub);background:var(--scrub-tint)}
.opt.sel .k{background:var(--scrub);border-color:var(--scrub);color:#fff}
.opt.right{border-color:var(--scrub);background:var(--scrub-tint)}
.opt.right .k{background:var(--scrub);border-color:var(--scrub);color:#fff}
.opt.bad{border-color:var(--wrong);background:var(--wrong-tint)}
.opt.bad .k{background:var(--wrong);border-color:var(--wrong);color:#fff}
.opt:disabled{cursor:default;color:inherit;opacity:1}
.exp{border-left:4px solid var(--scrub);background:var(--card);border-radius:0 10px 10px 0;
  padding:14px 16px;margin:16px 0 0}
.exp.no{border-left-color:var(--wrong)}
.exp b.verdict{display:block;margin-bottom:4px}
.exp .src{display:block;margin-top:8px;color:var(--soft);font-size:.86rem}
.actions{display:flex;gap:10px;margin-top:20px}
.actions .primary{margin-top:0}

/* results */
.score{font-family:var(--read);font-size:3.2rem;line-height:1;margin:10px 0 4px}
.row{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center;margin-bottom:12px}
.row .track{grid-column:1/-1;height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.row .track span{display:block;height:100%;background:var(--scrub)}
.row .track span.weak{background:var(--wrong)}
.review{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:10px}
.review .stem{font-size:1.06rem;margin:8px 0 10px}
.review p{margin:4px 0}
.review .you{color:var(--wrong)} .review .ans{color:var(--scrub-dark);font-weight:600}
@media (max-width:480px){h1{font-size:1.6rem}.stem{font-size:1.14rem}.topic{flex-wrap:wrap}.topic .meta{flex-basis:100%;padding-left:34px}}
@media (prefers-reduced-motion:no-preference){.strip i{transition:background .2s,transform .2s}}
</style>
</head>
<body>
<div class="wrap">

<section id="start">
  <h1>Clinical thinking and EBM, week 00</h1>
  <p class="lead">Year 3, batch E. Questions are written from your own lecture slides. Options are shuffled every time.</p>

  <h2>Pick the lectures</h2>
  <div id="topics"></div>

  <h2>How many questions</h2>
  <div class="seg" id="count">
    <button data-n="15">15</button><button data-n="30">30</button><button data-n="0" aria-pressed="true">All</button>
  </div>

  <h2>How to answer</h2>
  <div class="seg" id="mode">
    <button data-m="practice" aria-pressed="true">Practice</button><button data-m="exam">Exam</button>
  </div>
  <p class="note" id="modeNote"></p>

  <button class="primary" id="go">Start quiz</button>
</section>

<section id="quiz" class="hidden">
  <div class="bar"><span>Question <strong id="qn"></strong> of <strong id="qt"></strong></span>
    <span class="timer hidden" id="timer"></span>
    <button class="ghost" id="quit">End quiz</button></div>
  <div class="strip" id="strip"></div>
  <span class="tag" id="qtag"></span>
  <div class="stem" id="stem"></div>
  <div id="opts"></div>
  <div id="exp"></div>
  <div class="actions"><button class="primary" id="next" disabled>Check answer</button></div>
</section>

<section id="done" class="hidden">
  <h1>Your result</h1>
  <div class="score" id="score"></div>
  <p class="lead" id="scoreNote"></p>
  <h2>By lecture</h2>
  <div id="byTopic"></div>
  <div class="actions">
    <button class="primary" id="retry">Retry the ones I missed</button>
    <button class="ghost" id="home">Back to start</button>
  </div>
  <h2 id="revTitle">Questions to review</h2>
  <div id="reviews"></div>
</section>

</div>
<script>
const BANK = [{"topic": "Clinical reasoning and history taking", "source": "ICC [145] Clinical reasoning and history taking ICC [IM-GASTRO 22.1]", "stem": "According to dual process theory, which description fits System 1 thinking?", "correct": "Fast and intuitive, based on pattern recognition and prior experience", "distractors": ["Slow and deliberate, based on explicit knowledge and step by step logic", "Used mainly by novices, because it needs very little clinical experience", "Needs heavy cognitive work, but it is the least open to bias of the two"], "exp": "System 1 is the intuitive approach: quick, implicit, built on first impressions and pattern recognition, needs little cognitive effort and is used more often by experienced clinicians. System 2 is the analytical approach: slow, explicit, based on knowledge and logic, and needs considerable cognitive work."}, {"topic": "Clinical reasoning and history taking", "source": "ICC [145] Clinical reasoning and history taking ICC [IM-GASTRO 22.1]", "stem": "A junior doctor meets an unusual case that fits no pattern he knows. Which thinking mode is he expected to use, and what is its main advantage?", "correct": "System 2 (analytical): slow, but less susceptible to bias", "distractors": ["System 1 (intuitive): quick, and less susceptible to bias", "System 1 (intuitive): slow, but based on explicit logic", "System 2 (analytical): quick, and needs little effort"], "exp": "System 2 is commonly used by novice clinicians, or by experienced clinicians when they face a diagnostic dilemma. It is a slow process built on careful analysis, which makes it less open to bias and helps avoid diagnostic errors in complex cases. Experienced clinicians switch between the two systems depending on the scenario."}, {"topic": "Clinical reasoning and history taking", "source": "ICC [145] Clinical reasoning and history taking ICC [IM-GASTRO 22.1]", "stem": "What does the Dunning-Kruger effect describe?", "correct": "People of low ability overestimate themselves, as they lack metacognition", "distractors": ["People of low ability underestimate their competence and fear being exposed", "Experienced clinicians always reason faster than novices, whatever the case", "People of high ability correctly judge how hard a task will be for others"], "exp": "It is a cognitive bias in which people fail to assess their own competence. Those of low ability experience illusory superiority and cannot judge their level because they lack metacognition. The other side: highly able people assume tasks that are trivial for them are trivial for everyone, tend to underestimate themselves, and may experience impostor syndrome (doubting their achievements and fearing exposure as a fraud)."}, {"topic": "Clinical reasoning and history taking", "source": "ICC [145] Clinical reasoning and history taking ICC [IM-GASTRO 22.1]", "stem": "In the data, information, knowledge, wisdom pyramid shown in the lecture, \"the height of Mt. Everest\" is an example of what?", "correct": "Data (a discrete element)", "distractors": ["Information (processed data)", "Knowledge (mental application)", "Wisdom (internalization)"], "exp": "Data: the height of Mt. Everest. Information: a book on the geological characteristics of Mt. Everest. Knowledge: memorizing a report on the best practical way to reach the peak. Wisdom: the correct, personal choice of whether to climb it at all."}, {"topic": "Clinical reasoning and history taking", "source": "ICC [145] Clinical reasoning and history taking ICC [IM-GASTRO 22.1]", "stem": "According to the lecture, about what proportion of diagnoses is based on history taking alone?", "correct": "About 80%", "distractors": ["About 20%", "About 40%", "About 60%"], "exp": "It is estimated that 80% of diagnoses are based on history taking alone. This is the reason behind Osler's advice: always listen to the patient, he might be telling you the diagnosis."}, {"topic": "Clinical reasoning and history taking", "source": "ICC [145] Clinical reasoning and history taking ICC [IM-GASTRO 22.1]", "stem": "During a consultation the doctor asks: \"You are not allergic to anything, are you?\" What type of question is this, and what does the lecture say about it?", "correct": "A leading question; these should not be used at all", "distractors": ["An open question; every consultation should start with one", "A closed question; useful to clarify after the patient's story", "A leading question; useful to save time in a busy clinic"], "exp": "Leading questions are built on your own assumptions and push the patient toward the answer you want to hear, so they should not be used at all. A closed question clarifies and focuses, for example \"Are you still taking the aspirin your GP prescribed?\" An open question invites the story, for example \"How can I help you?\""}, {"topic": "Clinical reasoning and history taking", "source": "ICC [145] Clinical reasoning and history taking ICC [IM-GASTRO 22.1]", "stem": "What is the recommended order of questioning when finding the reason for the consultation?", "correct": "Start with an open question and listen to the story, then use closed questions to clarify", "distractors": ["Start with closed questions to save time, then finish with one open question at the end", "Start with leading questions to guide the patient, then move on to open questions", "Use closed questions only, because open questions bring out irrelevant information"], "exp": "Always start with an open ended question and take the time to listen to the patient's story. Once the narrative is complete, move to closed questions that clarify and focus on the useful points. Leading questions are avoided throughout."}, {"topic": "Clinical reasoning and history taking", "source": "ICC [145] Clinical reasoning and history taking ICC [IM-GASTRO 22.1]", "stem": "What is the correct order of the five steps of the Calgary-Cambridge model?", "correct": "Initiating the session, gathering information, physical examination, explanation and planning, closing the session", "distractors": ["Gathering information, initiating the session, physical examination, closing the session, explanation and planning", "Initiating the session, physical examination, gathering information, explanation and planning, closing the session", "Initiating the session, gathering information, explanation and planning, physical examination, closing the session"], "exp": "The five steps run in this order: 1 initiating the session (preparation, rapport, reason for the consultation), 2 gathering information (complaint, history, the patient's perspective, system review), 3 physical examination, 4 explanation and planning, 5 closing the session (forward planning, safety netting, final check)."}, {"topic": "Clinical reasoning and history taking", "source": "ICC [145] Clinical reasoning and history taking ICC [IM-GASTRO 22.1]", "stem": "In the WIPER preparation for a physical examination, what do the letters stand for?", "correct": "Wash hands, Informed consent, Pain, Exposure, Reposition", "distractors": ["Wash hands, Introduce yourself, Privacy, Examine, Record", "Welcome, Informed consent, Position, Examine, Reassure", "Wash hands, Identify patient, Palpate, Expose, Report"], "exp": "WIPER: Wash hands, Informed consent, Pain (ask about it), Exposure, Reposition. Preparation also includes explaining the procedure, seeking consent, keeping privacy and dignity, and having a chaperone if required."}, {"topic": "Clinical reasoning and history taking", "source": "ICC [145] Clinical reasoning and history taking ICC [IM-GASTRO 22.1]", "stem": "What does \"safety netting\" mean when closing the session?", "correct": "Explaining possible unexpected outcomes, what to do if the plan is not working, and when and how to seek help", "distractors": ["Ordering every possible investigation, so that no diagnosis can be missed by the team looking after the patient", "Asking a senior doctor to repeat the history and the examination before the patient is allowed to go home", "Writing out a full copy of the notes for the patient, in order to protect the doctor from later complaints"], "exp": "Safety netting is part of forward planning in step 5 (closing the session). The session then ends with a brief summary shared with the patient, a final check that the patient agrees and is comfortable with the plan, and a short written summary."}, {"topic": "Critical thinking questions: how to approach a question", "source": "ICC [IM 23.1] Critical thinking questions (orientation)", "stem": "What do the letters of the STOP framework stand for?", "correct": "Scan, Target, Organize, Provide", "distractors": ["Stop, Think, Observe, Proceed", "Scan, Think, Order, Present", "Summarize, Target, Organize, Prove"], "exp": "Scan: what information is given (symptoms, signs, history, investigations)? Target: what exactly is being asked? Organize: which information matters and how does it connect? Provide: the appropriate answer, focused, logical and justified. The lecture calls it a scaffold for clinical reasoning, not a formula."}, {"topic": "Critical thinking questions: how to approach a question", "source": "ICC [IM 23.1] Critical thinking questions (orientation)", "stem": "Which step of the STOP framework covers deciding which findings matter and how they connect into a pattern?", "correct": "Organize", "distractors": ["Scan", "Target", "Provide"], "exp": "Organize means filtering what matters and connecting the findings: which are relevant, which help tell one possibility from another, and how they fit into a pattern. In the lecture's case, smoking history plus chronic cough, sputum and exertional dyspnoea connect into a pattern of chronic airflow limitation, suggesting COPD."}, {"topic": "Critical thinking questions: how to approach a question", "source": "ICC [IM 23.1] Critical thinking questions (orientation)", "stem": "Why is the Target step so important before writing an answer?", "correct": "It stops you from answering a question other than the one that was asked", "distractors": ["It makes sure that every finding in the case is copied into the answer", "It lets you skip reading the case and go straight to the final question", "It guarantees that the first diagnosis that comes to mind is correct"], "exp": "The same clinical information can answer completely different questions. In the lecture the same 60-year-old smoker is used for a diagnosis question (COPD), an investigation question (spirometry), an interpretation question (the ABG) and a management question. Only the target changed."}, {"topic": "Critical thinking questions: how to approach a question", "source": "ICC [IM 23.1] Critical thinking questions (orientation)", "stem": "What is the difference between the FORMAT and the TASK of a clinical question?", "correct": "Format is how information is presented; task is what you do with it", "distractors": ["Format is what you must do with the data; task is how it is presented", "Format is the command word used; task is the number of marks given", "Format is the most likely diagnosis; task is the treatment that follows"], "exp": "Formats: case-based, data interpretation (ECG, ABG, labs), short essay, or combined. Tasks: diagnose, differentiate, interpret, explain, investigate, decide or manage, integrate new information. Same format does not mean same task, so recognising the task is the first step to the right answer."}, {"topic": "Critical thinking questions: how to approach a question", "source": "ICC [IM 23.1] Critical thinking questions (orientation)", "stem": "A question says: \"Comment on the acid-base balance in the following ABG.\" What is the main task?", "correct": "Interpret", "distractors": ["Diagnose", "Enumerate", "Decide / manage"], "exp": "Interpret means explaining what investigation results or clinical data actually indicate. \"What is the most likely diagnosis?\" is a diagnose task, \"Explain the mechanism responsible for this finding\" is an explain task, and \"Outline the initial treatment\" is a decide / manage task."}, {"topic": "Critical thinking questions: how to approach a question", "source": "ICC [IM 23.1] Critical thinking questions (orientation)", "stem": "The command word \"Outline\" asks you to do what?", "correct": "Give the main steps in order", "distractors": ["Give the mechanism or reasoning", "State what you see", "Give an organized, broader response"], "exp": "Enumerate / list: give the requested points. Describe: state what you see (for example an ECG rhythm). Outline: give the main steps (for example initial management). Interpret: explain what the findings mean. Explain: give the mechanism or reasoning. Discuss: give an organized, broader response. Compare / differentiate: similarities and distinguishing features."}, {"topic": "Critical thinking questions: how to approach a question", "source": "ICC [IM 23.1] Critical thinking questions (orientation)", "stem": "A 60-year-old smoker has a long history of chronic cough and sputum, with increasing breathlessness on exertion. The question asks which investigation would confirm the diagnosis. What is the best answer?", "correct": "Spirometry (pulmonary function testing), which shows airflow obstruction", "distractors": ["Chest X-ray, which shows the airflow obstruction directly on the film", "Arterial blood gas, which confirms the diagnosis of COPD in all patients", "Sputum culture, which identifies the cause of the long standing cough"], "exp": "The pattern points to COPD, and the task here is to choose a confirmatory investigation, not to give the diagnosis or the treatment. Spirometry demonstrates airflow obstruction and supports the diagnosis of COPD."}, {"topic": "Critical thinking questions: how to approach a question", "source": "ICC [IM 23.1] Critical thinking questions (orientation)", "stem": "The same patient has this ABG: pH 7.30, PaCO2 60 mmHg, HCO3 29 mmol/L, PaO2 45 mmHg. What is the correct interpretation?", "correct": "Chronic respiratory acidosis with metabolic compensation, and type II respiratory failure", "distractors": ["Acute metabolic acidosis with respiratory compensation, and type I respiratory failure", "Chronic respiratory alkalosis with metabolic compensation, and normal oxygenation", "Acute respiratory acidosis with no compensation at all, and type I respiratory failure"], "exp": "Read stepwise: pH below 7.35 is acidaemia. A raised PaCO2 is the respiratory component. A raised bicarbonate is metabolic compensation, which means the process is chronic. A low PaO2 together with a high PaCO2 is type II respiratory failure."}, {"topic": "Critical thinking questions: how to approach a question", "source": "ICC [IM 23.1] Critical thinking questions (orientation)", "stem": "A 65-year-old diabetic smoker with dyslipidaemia has had chest pain on effort for 3 months. Over the last 2 weeks it came with less effort, became more severe and now occurs at rest. What is the most suitable lab test?", "correct": "Cardiac enzymes and troponin", "distractors": ["D-dimer", "Lipid profile and HbA1c", "Brain natriuretic peptide (BNP)"], "exp": "The risk factors and the progressive pattern reflect a high ischaemic risk and raise the probability of unstable angina or myocardial infarction. In the lecture the first investigation chosen is an ECG, and the best lab test is cardiac enzymes and troponin."}, {"topic": "Critical thinking questions: how to approach a question", "source": "ICC [IM 23.1] Critical thinking questions (orientation)", "stem": "A 45-year-old obese woman has uncontrolled hypertension. She eats a lot of salt, takes regular NSAIDs for knee pain and is on one antihypertensive drug. Which list gives the modifications the lecture recommends?", "correct": "Weight reduction, less salt, stop the NSAIDs, and a single pill combination", "distractors": ["Weight reduction, less salt, continue the NSAIDs, and double the same drug", "Bed rest, less fluid intake, stop the NSAIDs, and add a sedative at night", "Weight reduction, more salt, add a second NSAID, and stop the current drug"], "exp": "The command is to list the causes that need modification, so each clue in the stem is matched to an action: obesity to weight reduction, a lot of salt to less salt, regular NSAIDs to stopping them, and one antihypertensive agent to a single pill combination."}, {"topic": "Critical reading, part A", "source": "A- Critical reading ICC [IM 39.7], part 1", "stem": "Why does the lecture say that critical reading is a necessity in medicine?", "correct": "At least 30,000 articles a month appear on Medline, so we must learn to keep only the good ones", "distractors": ["Most published medical articles are written to deceive, so none of them can ever be trusted", "Medical students are examined on journal articles only, not on the lectures or textbooks", "Reading every article in full is the only way to stay up to date in medical practice"], "exp": "It is impossible to read all the medical literature (a minimum of 30,000 articles a month on Medline), so we must learn to retain only good publications. The lecture also warns about the power of marketing and manipulation."}, {"topic": "Critical reading, part A", "source": "A- Critical reading ICC [IM 39.7], part 1", "stem": "What is the aim of critical reading?", "correct": "To examine the evidence and weigh the argument, and not just to find fault", "distractors": ["To find the faults in a text, so that its conclusions can be safely rejected", "To memorise the facts in a text exactly as the author has stated them", "To read slowly and with care, so that no single detail is ever missed"], "exp": "Critical reading is not simply close and careful reading, and its aim is not to find fault. It does not have to be all negative: it is just as useful to conclude that a study presents very strong evidence and a well reasoned argument as it is to identify weak ones."}, {"topic": "Critical reading, part A", "source": "A- Critical reading ICC [IM 39.7], part 1", "stem": "What is the recommended starting point for a critical reader?", "correct": "Take what you read as the author's argument, not a fact", "distractors": ["Take what you read as a fact, unless it is proven wrong", "Assume the author is biased and the conclusion is false", "Accept the text if it appeared in a well known journal"], "exp": "However objective or scientific the subject, the authors made many decisions during the research and writing, and each decision is open to examination and debate rather than blind acceptance."}, {"topic": "Critical reading, part A", "source": "A- Critical reading ICC [IM 39.7], part 1", "stem": "How does a NON-critical reader treat a text?", "correct": "As a source of facts to memorise, with blind acceptance", "distractors": ["As one portrayal of the facts, shaped by a unique author", "As an argument whose evidence must be weighed first", "As a text whose tone and purpose must be inferred"], "exp": "To non-critical readers, texts provide facts and knowledge is gained by memorizing the statements. To the critical reader, any single text gives but one portrayal of the facts: they recognize not only what a text says but also how it portrays the subject, as the unique creation of a unique author."}, {"topic": "Critical reading, part A", "source": "A- Critical reading ICC [IM 39.7], part 1", "stem": "Analysis and inference are the two tools of critical reading. What is inference?", "correct": "How to think about what you find: clues from the text plus reader knowledge give a conclusion", "distractors": ["What to look for: recognising those aspects of a discussion that control the meaning of the whole text", "Learning about a text before you actually read it, for example from its title and from its wording", "Placing a text in its historical, biographical and cultural context before judging it"], "exp": "Analysis is what to look for (the aspects of a discussion that control the meaning). Inference is how to think about what you find: clues from the text + reader knowledge = inference. Learning about a text before reading it is previewing, and placing it in its context is contextualizing; both are reading strategies."}, {"topic": "Critical reading, part A", "source": "A- Critical reading ICC [IM 39.7], part 1", "stem": "When reading critically, what must a text show about causes and effects?", "correct": "Causes must be shown to come before effects and to be capable of producing them", "distractors": ["Causes and effects must be shown to occur together at the same point in time", "Effects must be shown to be statistically significant in more than one study", "Causes need not be explained when the conclusion matches common knowledge"], "exp": "Whatever the topic, certain tasks must be done: a specific topic addressed, terms clearly defined, evidence presented, common knowledge accounted for, exceptions explained, causes shown to precede effects and to be capable of the effect, and conclusions shown to follow logically from the earlier arguments and evidence."}, {"topic": "Critical reading, part A", "source": "A- Critical reading ICC [IM 39.7], part 1", "stem": "When can a reader begin to decide whether to accept a text's assertions and conclusions?", "correct": "Only after the text is found consistent and coherent", "distractors": ["As soon as the title and the abstract have been read", "Only after other authors have confirmed the conclusions", "As soon as the text agrees with the reader's own views"], "exp": "The critical reader first checks that the required tasks were completed in a comprehensive and consistent manner. Only once a text has been found consistent and coherent can we begin to evaluate whether or not to accept its assertions and conclusions."}, {"topic": "Critical reading, part A", "source": "A- Critical reading ICC [IM 39.7], part 1", "stem": "In the broader definition of evidence, what counts as evidence in a paper?", "correct": "Everything you read: the context, the choice of method, the audit trail and the rationale for conclusions", "distractors": ["Only the actual data that were collected and then presented in the results tables and the figures of the paper", "Only the statistical tests, because the interpretation is a matter of the personal opinion of the authors", "Only the final conclusions, since they sum up everything that a busy reader needs to take from the paper"], "exp": "All that you read can be considered as evidence, not purely the data. This includes the report of the context, the choice of method for data collection, the audit trail for the analysis, the decisions and steps in the analysis, and the rationale for the interpretations and conclusions. On its own evidence cannot contribute to debate; its interpretation and presentation within an argument lets it contribute."}, {"topic": "Critical reading, part A", "source": "A- Critical reading ICC [IM 39.7], part 1", "stem": "Non-critical reading is satisfied with recognising what a text says and restating it. Critical reading goes two steps further. What are they?", "correct": "Recognising what the text is doing (arguing, giving examples), then inferring what the text as a whole means", "distractors": ["Memorising the key remarks of the text, then restating them in exactly the same order as the author presented them", "Checking the qualifications of the author, then counting how often the paper has been cited by other researchers", "Finding the faults in the method of the study, then rejecting every conclusion that depends on that method"], "exp": "The critical reader asks what the text is doing: is it offering examples, arguing, appealing for sympathy, making a contrast to clarify a point? Finally, based on that analysis, the reader infers what the text as a whole means."}, {"topic": "Critical reading, part B (critical thinking)", "source": "B- Critical reading ICC [IM 39.7], part 2", "stem": "Relying on reason rather than emotion, requiring evidence and following it where it leads. Which characteristic of critical thinking is this?", "correct": "Rationality", "distractors": ["Self-awareness", "Discipline", "Open-mindedness"], "exp": "Rationality: rely on reason rather than emotion, require evidence and follow it where it leads, and care more about finding the best explanation than about being right. The other characteristics in the lecture are self-awareness, honesty, open-mindedness, discipline and judgment."}, {"topic": "Critical reading, part B (critical thinking)", "source": "B- Critical reading ICC [IM 39.7], part 2", "stem": "Which behaviour shows the SELF-AWARENESS characteristic of critical thinking?", "correct": "Weighing the influence of motives and bias, and recognising our own assumptions and prejudices", "distractors": ["Being precise, meticulous and exhaustive, and avoiding snap judgments about the evidence", "Considering a variety of viewpoints, and staying open to the alternative interpretations", "Recognising the extent and the weight of the evidence behind each alternative perspective"], "exp": "Self-awareness: weigh the influences of motives and bias, and recognize our own assumptions, prejudices, biases or point of view. Precision and avoiding snap judgments is discipline; considering many viewpoints is open-mindedness; recognising the extent and weight of evidence is judgment."}, {"topic": "Critical reading, part B (critical thinking)", "source": "B- Critical reading ICC [IM 39.7], part 2", "stem": "Recognising emotional impulses, selfish motives and other modes of self-deception belongs to which characteristic of critical thinking?", "correct": "Honesty", "distractors": ["Judgment", "Rationality", "Discipline"], "exp": "Honesty: we think critically when we recognize emotional impulses, selfish motives, nefarious purposes and other modes of self-deception in ourselves."}, {"topic": "Critical reading, part B (critical thinking)", "source": "B- Critical reading ICC [IM 39.7], part 2", "stem": "Being precise and meticulous, resisting manipulation and irrational appeals, and avoiding snap judgments belong to which characteristic?", "correct": "Discipline", "distractors": ["Honesty", "Judgment", "Open-mindedness"], "exp": "Discipline: be precise, meticulous, comprehensive and exhaustive, resist manipulation and irrational appeals, and avoid snap judgments. Judgment is different: it is recognising the relevance or merit of alternative assumptions and the extent and weight of the evidence."}, {"topic": "Critical reading, part B (critical thinking)", "source": "B- Critical reading ICC [IM 39.7], part 2", "stem": "According to the open-mindedness characteristic, when should we accept a new explanation or model?", "correct": "When it explains the evidence better, is simpler, or covers more of the data than before", "distractors": ["When it is backed by the majority, since unpopular views are usually the wrong ones", "When it confirms our prior decisions and so protects our earlier beliefs from doubt", "When it comes from a senior author, whatever the weight of the evidence behind it"], "exp": "Open-mindedness: evaluate all reasonable inferences, consider a variety of viewpoints, remain open to alternative interpretations, accept a new explanation because it fits the evidence better, accept new priorities after re-evaluating the evidence, and do not reject unpopular views."}, {"topic": "Critical reading, part B (critical thinking)", "source": "B- Critical reading ICC [IM 39.7], part 2", "stem": "Which description fits a NON-critical (simple) thinker?", "correct": "Sees things in black and white, and takes his own perspective as the only valid one", "distractors": ["Is sceptical by nature, and approaches written texts with the same doubt as spoken remarks", "Is active rather than passive, and asks questions and analyses whatever is being read", "Is willing to look into competing evidence, and is open to new ideas and perspectives"], "exp": "Non-critical thinkers take a simplistic, egotistical view: things are either-or, questions are yes or no with no subtleties, linkages and complexities are missed, and their own facts, perspective and goal are taken as the only valid ones. Critical thinkers are sceptical, active and open to new ideas."}, {"topic": "Critical reading, part B (critical thinking)", "source": "B- Critical reading ICC [IM 39.7], part 2", "stem": "How does the lecture distinguish critical reading from critical thinking?", "correct": "Critical reading discovers the ideas within a text; critical thinking evaluates them and decides what to accept", "distractors": ["Critical reading evaluates the ideas and decides what to believe; critical thinking discovers those ideas within the text", "Critical reading is for scientific papers only; critical thinking is for newspapers, adverts and spoken remarks", "Critical reading looks for the faults in a given text; critical thinking looks for the strengths of that same text"], "exp": "Critical reading is a technique for discovering information and ideas within a text: careful, active, reflective, analytic reading. Critical thinking is a technique for evaluating information and ideas, for deciding what to accept and believe, by reflecting on the validity of what was read in light of prior knowledge."}, {"topic": "Critical reading, part B (critical thinking)", "source": "B- Critical reading ICC [IM 39.7], part 2", "stem": "By the lecture's definitions, which comes first, and why?", "correct": "Critical reading, because we can evaluate a text's assertions only once we have fully understood it", "distractors": ["Critical thinking, because we must judge the author's claims before we spend time reading them", "Critical thinking, because our prior knowledge should decide what the text is allowed to mean", "Neither, because the two are fully separate skills that are never used on the same text"], "exp": "Critical thinking depends on critical reading: you can think critically about a text only if you have understood it. In practice the two work together: if an assertion seems ridiculous (critical thinking), we go back and examine the text more closely to test our understanding (critical reading)."}, {"topic": "Critical reading, part B (critical thinking)", "source": "B- Critical reading ICC [IM 39.7], part 2", "stem": "If critical reading and critical thinking are so closely linked, why is the distinction still useful?", "correct": "It reminds us to read each text on its own merits and not force our own views onto it", "distractors": ["It reminds us that prior knowledge should always override what the author has written in the text", "It allows us to skip critical reading whenever we already hold a firm opinion on the topic", "It shows that evaluating ideas must wait until all the literature is read"], "exp": "We must evaluate ideas as we read, but without distorting the meaning of the text or imposing our prior knowledge and views on it. If we force a text to say what we want, we will never learn anything new."}, {"topic": "Talking about tests", "source": "ICC [082] VM-EBM021.1 Talking about tests", "stem": "What is the sensitivity of a test?", "correct": "The proportion of people WITH the disease who are correctly identified by a positive result", "distractors": ["The proportion of people FREE of the disease who are correctly identified by a negative result", "The proportion of people with a positive result who turn out to truly have the disease", "The probability that a person has the disease before the test has been carried out"], "exp": "Sensitivity is the true positive rate: of those who have the disease, how many test positive. Specificity is the true negative rate: of those free of the disease, how many test negative. The probability of disease before the test is the pre-test probability."}, {"topic": "Talking about tests", "source": "ICC [082] VM-EBM021.1 Talking about tests", "stem": "Which of the following is NOT a feature of an ideal test?", "correct": "It needs a highly trained operator to run it", "distractors": ["It has 100% sensitivity and 100% specificity", "It is low in risk, low in cost and painless", "It is easy to do and it is readily available"], "exp": "The ideal test has perfect accuracy and reliability (100% sensitivity and specificity), low risk, low cost, is painless, easy to do (no highly trained operator or complex equipment) and available. No real test meets all of these, which is why tests are not infallible."}, {"topic": "Talking about tests", "source": "ICC [082] VM-EBM021.1 Talking about tests", "stem": "What is pre-test probability?", "correct": "The probability that a person has the disease before the test is carried out", "distractors": ["The probability that the result of the test will be reported as positive", "The proportion of people with the disease who will have a positive test", "The probability that the disease is present once the test is positive"], "exp": "Pre-test probability is judged from the patient's background before testing (age, sex, smoking, family history, symptoms). A doctor should know whether a test is likely to be positive or negative before ordering it."}, {"topic": "Talking about tests", "source": "ICC [082] VM-EBM021.1 Talking about tests", "stem": "How does pre-test probability affect the way a test result is read?", "correct": "A high pre-test probability makes it easier to confirm the disease; a low one, to accept its absence", "distractors": ["A high pre-test probability makes it easier to exclude the disease; a low one makes it easier to confirm it", "It changes the sensitivity of the test but not the specificity, so only negative results are affected by it", "It has no effect: a positive result means disease and a negative one means no disease"], "exp": "A high pre-test probability makes it (much) easier to confirm the presence of the target disease. A low pre-test probability makes it (much) easier to accept its absence. A result that goes against the pre-test probability deserves doubt."}, {"topic": "Talking about tests", "source": "ICC [082] VM-EBM021.1 Talking about tests", "stem": "A 35-year-old woman, a non smoker with no family history, has intermittent chest pain. Her test for coronary artery disease comes back POSITIVE. How should the GP think about this result?", "correct": "Her pre-test probability was low, so the positive result may well turn out to be a false positive", "distractors": ["A positive test always confirms the disease, so she should be told that she has coronary artery disease", "Her pre-test probability was high, so the positive result only confirms what was already expected", "Pre-test probability has no bearing on a result, so the report should be accepted just as it stands"], "exp": "Tests are not infallible. In the first pair of patients the results matched expectation (high risk man positive, low risk woman negative), so the GP is comfortable. Here the result goes against a low pre-test probability, so the GP should not be happy to simply hand it over."}, {"topic": "Talking about tests", "source": "ICC [082] VM-EBM021.1 Talking about tests", "stem": "A 50-year-old male smoker with a family history of heart problems has intermittent chest pain. His test for coronary artery disease is NEGATIVE. What is the right conclusion?", "correct": "His pre-test probability was high, so a negative result does not safely rule out the disease", "distractors": ["A negative test always excludes the disease, so he can be fully reassured and discharged", "His pre-test probability was low, so the negative result only confirms what was expected", "The result proves that smoking and family history are not risk factors in his own case"], "exp": "With a high pre-test probability it is easy to confirm disease but hard to accept its absence on one negative test. A result that contradicts the clinical picture may be a false negative and needs further thought."}, {"topic": "Talking about tests", "source": "ICC [082] VM-EBM021.1 Talking about tests", "stem": "Every risk has two elements. What are they?", "correct": "How likely it is to happen and how severe it is", "distractors": ["The cost of the test and how widely it is available", "The sensitivity of the test and the specificity of it", "The age of the patient and the sex of the patient"], "exp": "Risk has an element of likelihood and an element of severity. Being knocked down by a car: unlikely, but really bad. Winning the lottery: unlikely, but really good. Food poisoning: likely at some time, but unlikely to kill. Smoking: both the likelihood and the severity increase with time."}, {"topic": "Talking about tests", "source": "ICC [082] VM-EBM021.1 Talking about tests", "stem": "A 20-year-old woman, 14 weeks pregnant, has chest pain and a pulmonary embolus is suspected. She is scared of radiation. From the lecture's list, which test gives LOW radiation with GOOD accuracy for PE?", "correct": "Nuclear medicine lung scan", "distractors": ["CT pulmonary angiogram", "Chest X-ray", "Doppler ultrasound of the legs"], "exp": "The lecture's list: CT pulmonary angiogram has high radiation and good accuracy; nuclear medicine lung scan has low radiation and good accuracy for PE; chest X-ray has low radiation, is not good for PE but good for other pathology; Doppler ultrasound is good for DVT but not for PE. Balancing risk and benefit differs for similar problems in different patients."}, {"topic": "Talking about tests", "source": "ICC [082] VM-EBM021.1 Talking about tests", "stem": "What is the most meaningful way to explain the radiation risk of a test to a patient?", "correct": "Relate it to an everyday risk, such as background radiation or a holiday flight", "distractors": ["Quote the exact dose in millisieverts, since numbers are understood by everyone", "Avoid mentioning the risk at all, because patients perceive risk very poorly", "Say that modern tests carry no risk at all, so that consent is easier to obtain"], "exp": "Perception of risk is poor in the general population, including doctors. Relating a medical risk to everyday risk is more meaningful, for example comparing the radiation from a test with background radiation or with a flight to Spain (exposure increases at altitude)."}, {"topic": "Talking about tests", "source": "ICC [082] VM-EBM021.1 Talking about tests", "stem": "The lecture's reference paper discusses the rules \"SpPIn\" and \"SnNOut\". What does SnNOut mean?", "correct": "With a highly Sensitive test, a Negative result helps to rule the disease OUT", "distractors": ["With a highly Specific test, a Negative result helps to rule the disease OUT", "With a highly Sensitive test, a Positive result helps to rule the disease IN", "With a highly Specific test, a Normal result shows the test was Not needed"], "exp": "SnNOut: Sensitive test, Negative result, rules OUT. SpPIn: Specific test, Positive result, rules IN. The reference (Pewsner, BMJ 2004) adds a note of caution: these rules are shortcuts and can mislead, so the pre-test probability still matters. This point comes from the lecture's reference, not from a slide."}];
const KEY = "hesham_y3_w00E_best";
const $ = id => document.getElementById(id);
const topics = [...new Set(BANK.map(q => q.topic))];
let mode = "practice", count = 0, set = [], idx = 0, answers = [], tick = null, left = 0;

function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function esc(s){return s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]))}
function best(){try{return JSON.parse(localStorage.getItem(KEY))||{}}catch(e){return {}}}
function saveBest(b){try{localStorage.setItem(KEY,JSON.stringify(b))}catch(e){}}
function show(id){["start","quiz","done"].forEach(s=>$(s).classList.toggle("hidden",s!==id));window.scrollTo(0,0)}

function drawStart(){
  const b = best();
  $("topics").innerHTML = topics.map((t,i)=>{
    const n = BANK.filter(q=>q.topic===t).length;
    const last = b[t]!=null ? "best "+b[t]+"%" : "not tried yet";
    return `<label class="topic"><input type="checkbox" value="${i}" checked><span class="name">${esc(t)}</span><span class="meta">${n} questions, ${last}</span></label>`;
  }).join("");
  setNote();
}
function setNote(){
  $("modeNote").textContent = mode==="practice"
    ? "Practice: you see the right answer and the explanation after each question."
    : "Exam: timed at 72 seconds per question, like the real paper. Answers and explanations come at the end.";
}
function pick(group, btn, attr){[...$(group).children].forEach(b=>b.setAttribute("aria-pressed", b===btn));return btn.dataset[attr]}
$("count").onclick = e => {if(e.target.tagName==="BUTTON") count = +pick("count", e.target, "n")};
$("mode").onclick = e => {if(e.target.tagName==="BUTTON"){mode = pick("mode", e.target, "m"); setNote()}};

function begin(pool){
  set = pool.map(q => ({q, opts: shuffle([q.correct, ...q.distractors])}));
  idx = 0; answers = new Array(set.length).fill(null);
  $("qt").textContent = set.length;
  $("strip").innerHTML = set.map(()=>"<i></i>").join("");
  clearInterval(tick);
  if(mode==="exam"){
    left = set.length*72; $("timer").classList.remove("hidden"); paintTimer();
    tick = setInterval(()=>{left--; paintTimer(); if(left<=0) finish()},1000);
  } else $("timer").classList.add("hidden");
  show("quiz"); drawQ();
}
function paintTimer(){const m=Math.floor(left/60),s=left%60;$("timer").textContent=m+":"+String(s).padStart(2,"0");$("timer").classList.toggle("low",left<60)}

$("go").onclick = () => {
  const chosen = [...document.querySelectorAll("#topics input:checked")].map(i=>topics[+i.value]);
  if(!chosen.length){alert("Pick at least one lecture.");return}
  let pool = shuffle(BANK.filter(q=>chosen.includes(q.topic)));
  if(count && count<pool.length) pool = pool.slice(0,count);
  begin(pool);
};

function drawQ(){
  const {q,opts} = set[idx]; let sel = null, locked = false;
  $("qn").textContent = idx+1; $("qtag").textContent = q.topic; $("stem").textContent = q.stem; $("exp").innerHTML = "";
  [...$("strip").children].forEach((el,i)=>{
    const a = answers[i];
    el.className = i===idx ? "now" : a==null ? "" : mode==="exam" ? "done" : (a===set[i].q.correct ? "ok" : "no");
  });
  const nx = $("next"); nx.disabled = true;
  nx.textContent = mode==="practice" ? "Check answer" : (idx===set.length-1 ? "Finish exam" : "Next question");
  $("opts").innerHTML = opts.map((o,i)=>`<button class="opt" data-i="${i}"><span class="k">${"ABCDE"[i]}</span><span>${esc(o)}</span></button>`).join("");
  const btns = [...$("opts").children];
  btns.forEach(b => b.onclick = () => {
    if(locked) return; sel = opts[+b.dataset.i];
    btns.forEach(x=>x.classList.toggle("sel",x===b)); nx.disabled = false;
  });
  nx.onclick = () => {
    if(mode==="practice" && !locked){
      locked = true; answers[idx] = sel; const ok = sel===q.correct;
      btns.forEach(b=>{const o=opts[+b.dataset.i]; b.disabled=true; b.classList.remove("sel");
        if(o===q.correct) b.classList.add("right"); else if(o===sel) b.classList.add("bad")});
      $("exp").innerHTML = `<div class="exp ${ok?"":"no"}"><b class="verdict">${ok?"Correct.":"Not this time."}</b>${esc(q.exp)}<span class="src">From: ${esc(q.source)}</span></div>`;
      $("strip").children[idx].className = ok?"ok":"no";
      nx.textContent = idx===set.length-1 ? "See my result" : "Next question";
      return;
    }
    if(mode==="exam") answers[idx] = sel;
    if(idx===set.length-1) finish(); else {idx++; drawQ(); window.scrollTo(0,0)}
  };
}
$("quit").onclick = () => {if(confirm("End the quiz now and see your result?")) finish()};

function finish(){
  clearInterval(tick);
  const total = set.length, right = set.filter((s,i)=>answers[i]===s.q.correct).length;
  const pct = Math.round(100*right/total);
  $("score").textContent = right+" / "+total;
  $("scoreNote").textContent = pct+"%. " + (pct>=85 ? "Strong. Keep these lectures warm with a short retry next week."
    : pct>=65 ? "Good base. Go through the review list below, then retry the missed ones."
    : "Read the high yield sheet for the weak lectures first, then come back.");
  const b = best();
  $("byTopic").innerHTML = topics.filter(t=>set.some(s=>s.q.topic===t)).map(t=>{
    const items = set.map((s,i)=>[s,i]).filter(([s])=>s.q.topic===t);
    const r = items.filter(([s,i])=>answers[i]===s.q.correct).length, p = Math.round(100*r/items.length);
    if(items.length>=5 && (b[t]==null || p>b[t])) b[t]=p;
    return `<div class="row"><span>${esc(t)}</span><strong>${r} / ${items.length}</strong><div class="track"><span class="${p<65?"weak":""}" style="width:${p}%"></span></div></div>`;
  }).join("");
  saveBest(b);
  const missed = set.map((s,i)=>[s,i]).filter(([s,i])=>answers[i]!==s.q.correct);
  $("retry").classList.toggle("hidden", !missed.length);
  $("revTitle").textContent = missed.length ? "Questions to review ("+missed.length+")" : "Nothing to review. All correct.";
  $("reviews").innerHTML = missed.map(([s,i])=>`<div class="review"><span class="tag">${esc(s.q.topic)}</span>
    <div class="stem">${esc(s.q.stem)}</div>
    <p class="you">${answers[i]==null?"You left this one blank.":"You chose: "+esc(answers[i])}</p>
    <p class="ans">Answer: ${esc(s.q.correct)}</p><p>${esc(s.q.exp)}</p></div>`).join("");
  $("retry").onclick = () => {mode="practice"; begin(shuffle(missed.map(([s])=>s.q)))};
  show("done");
}
$("home").onclick = () => {[...$("mode").children].forEach(b=>b.setAttribute("aria-pressed", b.dataset.m===mode)); drawStart(); show("start")};
drawStart();
</script>

</html>
