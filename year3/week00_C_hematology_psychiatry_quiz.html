<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">

<title>Year 3 Week 00 C: Hematology and Psychiatry quiz</title>
<style>
:root{
  --paper:#EEF4F2; --card:#FFFFFF; --ink:#0F2A33; --soft:#4C666E; --line:#C9D8D4;
  --scrub:#1B7567; --scrub-dark:#125548; --scrub-tint:#DCEEEA;
  --wrong:#B23A30; --wrong-tint:#F7E3E0; --amber:#B7790C;
  --ui:"Avenir Next","Segoe UI",system-ui,-apple-system,Roboto,sans-serif;
  --read:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
}
@media (prefers-color-scheme:dark){
  :root{--paper:#0C1F25;--card:#132E36;--ink:#E6F0EE;--soft:#9DB5B8;--line:#27474F;
  --scrub:#4FB8A5;--scrub-dark:#7FD3C3;--scrub-tint:#17403F;--wrong:#E8867C;--wrong-tint:#42211F;--amber:#E0A93F;}
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--ui);line-height:1.5;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
.wrap{max-width:760px;margin:0 auto;padding:20px 18px 60px}
h1{font-family:var(--read);font-weight:600;font-size:2rem;line-height:1.15;margin:18px 0 6px;letter-spacing:-.01em}
h2{font-size:1.05rem;margin:26px 0 10px}
p.lead{color:var(--soft);margin:0 0 8px;max-width:60ch}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible,label:focus-within{outline:3px solid var(--amber);outline-offset:2px}
.hidden{display:none!important}

/* start screen */
.topic{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);
  border-radius:10px;padding:13px 14px;margin-bottom:8px}
.topic input{width:22px;height:22px;accent-color:var(--scrub);flex:none}
.topic .name{flex:1;font-weight:600}
.topic .meta{color:var(--soft);font-size:.86rem;white-space:nowrap}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--card)}
.seg button{flex:1;border:0;background:none;padding:12px 8px;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--scrub);color:#fff;font-weight:600}
.note{color:var(--soft);font-size:.9rem;margin:8px 0 0}
.primary{display:block;width:100%;margin-top:26px;border:0;border-radius:12px;background:var(--scrub);
  color:#fff;font-weight:700;font-size:1.08rem;padding:16px}
.primary:active{background:var(--scrub-dark)}
.primary:disabled{opacity:.45}
.ghost{background:none;border:1px solid var(--line);border-radius:10px;padding:11px 16px}

/* count strip: one mark per question */
.strip{display:flex;gap:2px;margin:6px 0 18px;height:12px}
.strip i{flex:1;border-radius:2px;background:var(--line);min-width:2px}
.strip i.ok{background:var(--scrub)} .strip i.no{background:var(--wrong)}
.strip i.done{background:var(--soft)} .strip i.now{background:var(--amber);transform:scaleY(1.5)}
.bar{display:flex;justify-content:space-between;align-items:center;gap:12px;color:var(--soft);font-size:.92rem}
.bar strong{color:var(--ink)}
.timer{font-variant-numeric:tabular-nums;font-weight:700;color:var(--ink)}
.timer.low{color:var(--wrong)}

/* question */
.tag{display:inline-block;background:var(--scrub-tint);color:var(--scrub-dark);border-radius:6px;
  padding:3px 9px;font-size:.82rem;font-weight:600}
.stem{font-family:var(--read);font-size:1.28rem;line-height:1.5;margin:14px 0 18px;max-width:62ch}
.opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;background:var(--card);
  border:1.5px solid var(--line);border-radius:12px;padding:14px;margin-bottom:10px;min-height:54px}
.opt .k{flex:none;width:28px;height:28px;border-radius:50%;border:1.5px solid var(--line);
  display:grid;place-items:center;font-weight:700;font-size:.88rem;color:var(--soft)}
.opt.sel{border-color:var(--scrub);background:var(--scrub-tint)}
.opt.sel .k{background:var(--scrub);border-color:var(--scrub);color:#fff}
.opt.right{border-color:var(--scrub);background:var(--scrub-tint)}
.opt.right .k{background:var(--scrub);border-color:var(--scrub);color:#fff}
.opt.bad{border-color:var(--wrong);background:var(--wrong-tint)}
.opt.bad .k{background:var(--wrong);border-color:var(--wrong);color:#fff}
.opt:disabled{cursor:default;color:inherit;opacity:1}
.exp{border-left:4px solid var(--scrub);background:var(--card);border-radius:0 10px 10px 0;
  padding:14px 16px;margin:16px 0 0}
.exp.no{border-left-color:var(--wrong)}
.exp b.verdict{display:block;margin-bottom:4px}
.exp .src{display:block;margin-top:8px;color:var(--soft);font-size:.86rem}
.actions{display:flex;gap:10px;margin-top:20px}
.actions .primary{margin-top:0}

/* results */
.score{font-family:var(--read);font-size:3.2rem;line-height:1;margin:10px 0 4px}
.row{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center;margin-bottom:12px}
.row .track{grid-column:1/-1;height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.row .track span{display:block;height:100%;background:var(--scrub)}
.row .track span.weak{background:var(--wrong)}
.review{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:10px}
.review .stem{font-size:1.06rem;margin:8px 0 10px}
.review p{margin:4px 0}
.review .you{color:var(--wrong)} .review .ans{color:var(--scrub-dark);font-weight:600}
@media (max-width:480px){h1{font-size:1.6rem}.stem{font-size:1.14rem}.topic{flex-wrap:wrap}.topic .meta{flex-basis:100%;padding-left:34px}}
@media (prefers-reduced-motion:no-preference){.strip i{transition:background .2s,transform .2s}}
</style>
</head>

<div class="wrap">

<section id="start">
  <h1>Hematology and Psychiatry, week 00</h1>
  <p class="lead">Year 3, batch C. Questions are written from your own lecture slides and OSCE checklists. Options are shuffled every time.</p>

  <h2>Pick the lectures</h2>
  <div id="topics"></div>

  <h2>How many questions</h2>
  <div class="seg" id="count">
    <button data-n="15">15</button><button data-n="30">30</button><button data-n="0" aria-pressed="true">All</button>
  </div>

    <button data-m="practice" aria-pressed="true">Practice</button><button data-m="exam">Exam</button>
  </div>
  <p class="note" id="modeNote"></p>

  <button class="primary" id="go">Start quiz</button>
</section>

<section id="quiz" class="hidden">
  <div class="bar"><span>Question <strong id="qn"></strong> of <strong id="qt"></strong></span>
    <span class="timer hidden" id="timer"></span>
    <button class="ghost" id="quit">End quiz</button></div>
  <div class="strip" id="strip"></div>

  <div id="exp"></div>
  <div class="actions"><button class="primary" id="next" disabled>Check answer</button></div>
</section>

<section id="done" class="hidden">

  <h2>By lecture</h2>
  <div id="byTopic"></div>
  <div class="actions">
    <button class="primary" id="retry">Retry the ones I missed</button>
    <button class="ghost" id="home">Back to start</button>
  </div>
  <h2 id="revTitle">Questions to review</h2>
  <div id="reviews"></div>
</section>

<script>
const BANK = [{"topic": "Appropriate use of blood components", "source": "ICC [010a] Appropriate use of blood components", "stem": "What is the only absolute indication for a red cell transfusion?", "correct": "To increase oxygen delivery to vital organs in an anaemic patient", "distractors": ["To bring the haemoglobin back to the normal range before discharge", "To replace iron stores in a patient with a low ferritin level", "To expand the blood volume in a patient with low blood pressure"], "exp": "Red cells are given for one reason: to carry oxygen to the vital organs of an anaemic patient. A number on its own is not the reason. Iron deficiency is treated with iron, and volume is replaced with fluids."}, {"topic": "Appropriate use of blood components", "source": "ICC [010a] Appropriate use of blood components", "stem": "Above which haemoglobin level is a red cell transfusion NOT indicated?", "correct": "100 g/L", "distractors": ["70 g/L", "80 g/L", "120 g/L"], "exp": "The lecture's triggers: above 100 g/L transfusion is not indicated, below 70 g/L there is a strong indication, and between 70 and 100 g/L the decision depends on the patient."}, {"topic": "Appropriate use of blood components", "source": "ICC [010a] Appropriate use of blood components", "stem": "A stable patient has a haemoglobin of 85 g/L. What decides whether to transfuse?", "correct": "Symptoms and the patient's cardiopulmonary reserve", "distractors": ["The haemoglobin alone, which is already below 90 g/L", "The patient's blood group and antibody screen result", "Whether the blood bank has enough units in stock"], "exp": "Between 70 and 100 g/L the picture is less clear. Assess cardiopulmonary reserve, and transfuse symptomatic patients (fatigue, dizziness, shortness of breath, new or worsening angina). The lecture says a universal trigger does not make sense."}, {"topic": "Appropriate use of blood components", "source": "ICC [010a] Appropriate use of blood components", "stem": "What red cell transfusion threshold does the lecture give for critical care patients?", "correct": "70 g/L, and possibly 90 g/L if the patient has cardiac disease", "distractors": ["100 g/L for all, and 120 g/L if the patient has cardiac disease", "50 g/L for all, and 70 g/L if the patient has cardiac disease", "90 g/L for all, with no change for patients with cardiac disease"], "exp": "Critical care uses a restrictive threshold of 70 g/L, which may be raised to 90 g/L in cardiac patients because the heart tolerates anaemia poorly."}, {"topic": "Appropriate use of blood components", "source": "ICC [010a] Appropriate use of blood components", "stem": "For a transfusion dependent patient, for example with myelodysplastic syndrome (MDS), how is the trigger chosen?", "correct": "Whatever level best suits the patient's quality of life", "distractors": ["A fixed haemoglobin of 70 g/L, as in critical care", "A fixed haemoglobin of 100 g/L, to prevent all symptoms", "Transfuse only when the patient develops angina"], "exp": "In transfusion dependent patients the target is individual and is set by quality of life. Haemoglobinopathy patients are also managed with individualised plans."}, {"topic": "Appropriate use of blood components", "source": "ICC [010a] Appropriate use of blood components", "stem": "Two patients have a haemoglobin of 72 g/L: a fit young man after tibial fracture surgery, and an elderly lady with angina and early COPD awaiting hip fracture surgery. Which statement is best?", "correct": "The elderly lady has the stronger case (poor reserve)", "distractors": ["Both must receive 2 units, because the number is the same", "Neither needs blood, because both are above 70 g/L", "The young man has the stronger case, because he had surgery"], "exp": "The same number means different things in different patients. A fit young man can compensate, so he can be assessed by symptoms. Angina and COPD reduce the ability to compensate for anaemia, so the elderly lady is more likely to need transfusion. (The slide poses the case; this answer follows the lecture's principle of assessing cardiopulmonary reserve.)"}, {"topic": "Appropriate use of blood components", "source": "ICC [010a] Appropriate use of blood components", "stem": "What percentage of the UK population donates blood, according to the lecture?", "correct": "Only 4%", "distractors": ["About 10%", "About 25%", "About 40%"], "exp": "Blood is a finite resource: only 4% of the population donate. This is one of the main reasons to use it appropriately."}, {"topic": "Appropriate use of blood components", "source": "ICC [010a] Appropriate use of blood components", "stem": "Which is the most common ABO blood group in the lecture's table?", "correct": "Group O (44%)", "distractors": ["Group A (42%)", "Group B (10%)", "Group AB (4%)"], "exp": "O 44%, A 42%, B 10%, AB 4%. Overall 83% are Rh D positive and 17% are Rh D negative."}, {"topic": "Appropriate use of blood components", "source": "ICC [010a] Appropriate use of blood components", "stem": "According to the lecture's risk table, which transfusion transmitted infection is the MOST likely?", "correct": "Hepatitis B (about 1 in 670,000)", "distractors": ["Hepatitis C (about 1 in 83 million)", "HIV (about 1 in 7.1 million)", "All three carry the same risk"], "exp": "Hepatitis B about 1:670,000, HIV about 1:7.1 million, hepatitis C about 1:83 million. For comparison, the risk of dying in a road accident is about 1:8,000, so infection is a very small risk."}, {"topic": "Appropriate use of blood components", "source": "ICC [010a] Appropriate use of blood components", "stem": "Why is the risk of variant CJD (vCJD) from transfusion still unknown?", "correct": "There is no screening test for it", "distractors": ["It has never been found in donors", "It is destroyed by cold storage", "It only spreads through plasma"], "exp": "There is no screening test for vCJD, so the risk cannot be measured. Many measures have been introduced to reduce it."}, {"topic": "Appropriate use of blood components", "source": "ICC [010a] Appropriate use of blood components", "stem": "Where do the most serious risks of transfusion come from?", "correct": "Errors made at the hospital, about half of them human error", "distractors": ["Infections that escape donor screening at the blood service", "Faulty storage of blood units at the collection centre", "Allergic reactions that cannot be predicted or avoided"], "exp": "Most serious risks are generated at the hospital. 50% of reported events are due to human error, there are about 100 near misses for every error, and \"wrong blood in tube\" happens in about 1 in 2,000 to 4,000 samples."}, {"topic": "Appropriate use of blood components", "source": "ICC [010a] Appropriate use of blood components", "stem": "What does \"wrong blood in tube\" mean?", "correct": "The sample in the tube is not from the patient named on the label", "distractors": ["The wrong anticoagulant tube was used for the crossmatch sample", "A unit of the wrong blood group was delivered to the patient's ward", "The blood sample clotted in the tube before it reached the lab"], "exp": "It is a sampling and labelling error, with a rate of about 1 in 2,000 to 4,000. It can lead to an incompatible transfusion, which is why identity checks at the bedside are essential."}, {"topic": "Appropriate use of blood components", "source": "ICC [010a] Appropriate use of blood components", "stem": "A lady started a red cell transfusion 20 minutes ago. She now has sudden loin pain, tachycardia, hypotension and a temperature of 38.9 C. What is the first action?", "correct": "Stop the transfusion at once and keep the IV line open with saline", "distractors": ["Slow the transfusion, give paracetamol and review her again in one hour", "Give a diuretic and continue the transfusion at the same rate", "Continue the transfusion and send blood cultures for infection"], "exp": "Loin pain, fever and shock soon after starting suggests an acute haemolytic reaction, usually from ABO incompatible blood. Stop the transfusion, keep the line open, resuscitate, check the patient's identity against the unit, and inform the transfusion laboratory. (The slide poses the case; the answer is the standard management.)"}, {"topic": "Appropriate use of blood components", "source": "ICC [010a] Appropriate use of blood components", "stem": "Near the end of a transfusion a man's temperature has risen from 36.8 C to 37.6 C. His other observations are unchanged. What would you advise?", "correct": "Mild febrile reaction: continue, observe more often, consider paracetamol", "distractors": ["A haemolytic reaction: stop the transfusion and call the crash team", "Bacterial contamination: stop, take blood cultures and start IV antibiotics", "Fluid overload: stop the transfusion and give furosemide"], "exp": "A small temperature rise (less than 1.5 C, below 38 C) with otherwise stable observations is a mild febrile non-haemolytic reaction. The transfusion can continue with more frequent observations. It must be stopped if other features appear. (The slide poses the case; the answer is the standard management.)"}, {"topic": "Appropriate use of blood components", "source": "ICC [010a] Appropriate use of blood components", "stem": "A symptomatic post-operative patient with a haemoglobin of 65 g/L has been feverish all day and is on antibiotics. The nurses do not want to start blood. What is correct?", "correct": "Fever does not stop it: record baseline observations and transfuse", "distractors": ["Wait until the patient has been free of fever for 24 hours", "Cancel the blood and give intravenous iron in its place", "Transfuse only after all the blood cultures have come back negative"], "exp": "The patient has a clear indication (below 70 g/L and symptomatic). A pre-existing fever does not stop a needed transfusion, but the baseline temperature must be documented so that a new rise can be recognised as a possible reaction."}, {"topic": "Appropriate use of blood components", "source": "ICC [010a] Appropriate use of blood components", "stem": "A competent adult Jehovah's Witness, haemoglobin 91 g/L, is booked for myomectomy in 7 weeks and refuses all blood products. What is the best approach?", "correct": "Respect and document her refusal, and raise her haemoglobin before surgery", "distractors": ["Cancel the operation, because surgery without blood is unsafe", "Agree with her now, but transfuse her in theatre if the bleeding becomes heavy", "Ask her family to give consent for transfusion on her behalf"], "exp": "A competent adult can refuse blood and this must be respected and documented. The plan is patient blood management: find and treat the cause of anaemia (iron), discuss which alternatives she accepts (such as cell salvage or tranexamic acid) and minimise blood loss."}, {"topic": "Appropriate use of blood components", "source": "ICC [010a] Appropriate use of blood components", "stem": "A woman with heavy bleeding from fibroids has haemoglobin 42 g/L, ferritin 5 and MCV 73. She received 4 units and 2 weeks of oral iron, then returned months later with haemoglobin 30 g/L. What was the main failure?", "correct": "The iron deficiency and its cause were never properly treated", "distractors": ["She should have been given 8 units of blood at the first visit", "She should have received platelets together with the red cells", "Her antibody screen should have been repeated every week"], "exp": "Low ferritin and low MCV mean iron deficiency from chronic blood loss. Transfusion is only a temporary fix: she needed full iron replacement, treatment of the fibroids and a reliable follow up. Repeated transfusion also gave her red cell antibodies (anti-C, anti-Cw), which made emergency blood harder to provide, and no repeat haemoglobin was checked after 6 units."}, {"topic": "Appropriate use of blood components", "source": "ICC [010a] Appropriate use of blood components", "stem": "On the morning of her CABG, a patient's antibody screen is positive and she is known to have had anti-Fya. The surgeon wants 4 units. What should have happened?", "correct": "A sample at pre-assessment, so compatible blood was found in time", "distractors": ["Emergency group O negative blood should be used for the operation", "The antibody can be ignored, because it is not an ABO antibody", "The patient should be given her units without a crossmatch"], "exp": "When red cell antibodies are present the laboratory needs time and extra samples to find antigen negative, crossmatch compatible units. She was seen 3 weeks earlier, so this should have been sorted then. Now the best plan is to talk to the laboratory and delay surgery until compatible blood is available. O negative blood is not safe here, because it may still carry the Fya antigen."}, {"topic": "Appropriate use of blood components", "source": "ICC [010a] Appropriate use of blood components", "stem": "Which of these is one of the lecture's definitions of major haemorrhage?", "correct": "Replacement of more than 50% of the blood volume within 3 hours", "distractors": ["Replacement of more than 10% of the blood volume within 24 hours", "Transfusion of 2 units of packed red cells within 6 hours", "Blood loss at a rate of 15 ml or more per minute"], "exp": "Definitions: whole blood volume replaced in 24 hours; more than 8 to 10 units of red cells in 24 hours; more than 50% of blood volume in 3 hours; blood loss of 150 ml/min or more; 4 or more units in 1 hour with ongoing bleeding; or predicted need for 8 or more units within 2 hours."}, {"topic": "Appropriate use of blood components", "source": "ICC [010a] Appropriate use of blood components", "stem": "What does the lecture name as critical for managing a major haemorrhage well?", "correct": "Good communication, with one person coordinating and scribing", "distractors": ["Waiting for the full blood count before any blood is ordered", "Every doctor on the team phoning the laboratory separately", "Giving red cells only, and leaving plasma until bleeding stops"], "exp": "Key elements: know how to activate the major haemorrhage protocol, appoint a coordinator who talks to the laboratory and keeps a record, use SBAR (Situation, Background, Assessment, Recommendation), give extra blood components to correct coagulopathy, and train and review as a team."}, {"topic": "Appropriate use of blood components", "source": "ICC [010a] Appropriate use of blood components", "stem": "In Egypt, which number reaches the ambulance service?", "correct": "123", "distractors": ["122", "125", "126"], "exp": "Ambulance 123, police 122, fire 125, traffic emergency 126. The 112 hotline is planned as the single national emergency network. The Egyptian Red Crescent hotline is 15086."}, {"topic": "Blood components: red cells and platelets", "source": "ICC [047] Blood components and complications of blood transfusion", "stem": "What volume of packed red cells raises the haemoglobin by about 1 g/dl?", "correct": "3 ml/kg", "distractors": ["1 ml/kg", "10 ml/kg", "20 ml/kg"], "exp": "3 ml/kg raises the haemoglobin by about 1 g/dl. In an adult, one unit (about 280 ml) is expected to give a rise of more than 1 g/dl, depending on the size of the patient and of the donor unit."}, {"topic": "Blood components: red cells and platelets", "source": "ICC [047] Blood components and complications of blood transfusion", "stem": "About how much volume is in one unit of packed red cells?", "correct": "About 280 ml", "distractors": ["About 100 ml", "About 450 ml", "About 600 ml"], "exp": "A unit of packed red cells is about 280 ml."}, {"topic": "Blood components: red cells and platelets", "source": "ICC [047] Blood components and complications of blood transfusion", "stem": "How are packed red cells stored?", "correct": "At 4 C, for up to 35 days", "distractors": ["At room temperature, for up to 5 days", "At minus 30 C, for up to 1 year", "At 37 C, for up to 24 hours"], "exp": "Red cells are kept at 4 C and can be stored for up to 35 days."}, {"topic": "Blood components: red cells and platelets", "source": "ICC [047] Blood components and complications of blood transfusion", "stem": "In bone marrow failure with no bleeding, below which platelet count does the lecture suggest giving platelets?", "correct": "10 (x 10^9/L)", "distractors": ["50 (x 10^9/L)", "100 (x 10^9/L)", "150 (x 10^9/L)"], "exp": "The lecture's examples (not rigid rules): bone marrow failure below 10, bleeding in the eye or brain below 100. The threshold always depends on the clinical situation."}, {"topic": "Blood components: red cells and platelets", "source": "ICC [047] Blood components and complications of blood transfusion", "stem": "A patient is bleeding into the brain. Which platelet threshold does the lecture give for transfusion?", "correct": "Below 100 (x 10^9/L)", "distractors": ["Below 10 (x 10^9/L)", "Below 30 (x 10^9/L)", "Below 50 (x 10^9/L)"], "exp": "Bleeding in a critical site such as the eye or brain has the highest threshold, because even a small bleed there causes serious damage."}, {"topic": "Blood components: red cells and platelets", "source": "ICC [047] Blood components and complications of blood transfusion", "stem": "What dose of platelets is usually enough?", "correct": "10 ml/kg or one pool, whichever is less", "distractors": ["3 ml/kg or one pool, whichever is more", "30 ml/kg, repeated every 6 hours", "Four pools given together"], "exp": "10 ml/kg or 1 pool (whichever is least) is usually enough, and more is rarely needed. Platelets are sometimes needed for platelet dysfunction even with a normal count, for example on cardiac bypass."}, {"topic": "Hematology history and examination (OSCE)", "source": "ICC [278] history checklist + ICC [277] examination checklist", "stem": "In a hematology history, which group of symptoms points to hyperviscosity (polycythemia, essential thrombocythemia)?", "correct": "Throbbing headache, plethora, erythromelalgia, blurred vision", "distractors": ["Brittle nails, pica, hair fall and stomatitis", "Night sweats, fever, weight loss and neck lumps", "Epistaxis, bleeding gums, purpura, petechiae and easy bruising"], "exp": "Hyperviscosity: throbbing headache, plethora, erythromelalgia, blurred vision, high blood pressure. Brittle nails and pica suggest iron deficiency, night sweats with lumps suggest lymphoma, and superficial bleeding suggests a platelet disorder."}, {"topic": "Hematology history and examination (OSCE)", "source": "ICC [278] history checklist + ICC [277] examination checklist", "stem": "Which associated features point to iron deficiency?", "correct": "Brittle nails, pica, hair fall and stomatitis", "distractors": ["Burning tongue and loss of proprioception", "Jaundice, dark urine and epigastric pain", "Severe bone pain, priapism, leg ulcers and gangrene"], "exp": "Burning tongue with loss of proprioception suggests B12 deficiency. Jaundice and dark urine suggest hemolytic anemia. Recurrent severe bone pain, priapism, ulcers and digital gangrene suggest sickle cell vaso-occlusive crisis."}, {"topic": "Hematology history and examination (OSCE)", "source": "ICC [278] history checklist + ICC [277] examination checklist", "stem": "A patient has recurrent swollen painful joints with limited movement. Another has purpura, petechiae and bleeding gums. How does the checklist separate them?", "correct": "Joint (deep) bleeding suggests hemophilia; superficial bleeding suggests thrombocytopenia", "distractors": ["Joint (deep) bleeding suggests thrombocytopenia; superficial bleeding suggests hemophilia", "Both patterns suggest thrombocytopenia; only the severity is different", "Both patterns suggest hemophilia; only the severity is different"], "exp": "Deep bleeding (joints, muscles, abdominal swelling) points to a coagulation factor disorder such as hemophilia. Superficial bleeding (purpura, petechiae, ecchymosis, epistaxis, gum bleeding) points to a platelet problem."}, {"topic": "Hematology history and examination (OSCE)", "source": "ICC [278] history checklist + ICC [277] examination checklist", "stem": "How does the checklist define weight loss as a B symptom?", "correct": "Loss of more than 10% of body weight over 6 months", "distractors": ["Loss of more than 5% of body weight over 1 month", "Loss of more than 2 kg over any period of time", "Loss of more than 20% of body weight over 12 months"], "exp": "B symptoms: night sweats, night fever, weight loss of more than 10% over 6 months, loss of appetite and fatigue. Ask about them with lymph node swellings (lymphoma)."}, {"topic": "Hematology history and examination (OSCE)", "source": "ICC [278] history checklist + ICC [277] examination checklist", "stem": "Which precipitating factors should you ask about for a sickle cell vaso-occlusive crisis?", "correct": "Infection, dehydration, smoking, fasting, hypoxia", "distractors": ["Immobility, malignancy and hormonal therapy", "Surgery, chronic disease, piles and heavy menstrual bleeding", "Fava beans, new drugs and vaccination"], "exp": "Immobility, malignancy and hormonal therapy are asked about for blood clots. Surgery, chronic disease, piles and heavy menses are asked about for bleeding and anemia."}, {"topic": "Hematology history and examination (OSCE)", "source": "ICC [278] history checklist + ICC [277] examination checklist", "stem": "Why does the hematology history ask whether a patient is vegetarian or vegan?", "correct": "Risk of B12 deficiency", "distractors": ["Risk of iron overload", "Risk of G6PD hemolysis", "Risk of folate excess"], "exp": "B12 comes from animal food, so a diet without meat risks B12 deficiency. Types of food are also asked about for G6PD deficiency, where certain foods trigger hemolysis."}, {"topic": "Hematology history and examination (OSCE)", "source": "ICC [278] history checklist + ICC [277] examination checklist", "stem": "In the family history, a bleeding disorder affects only the males of the family. Why is this asked?", "correct": "The pedigree shows the inheritance, such as X-linked hemophilia", "distractors": ["It shows that the bleeding is caused by diet in the household", "It proves the condition was acquired by an infection in the home", "It shows that the women in the family cannot be carriers"], "exp": "The checklist asks: similar conditions, family pedigree (only males, or both sexes), ethnic history (alpha and beta thalassemia traits), consanguineous marriage and history of cancers."}, {"topic": "Hematology history and examination (OSCE)", "source": "ICC [278] history checklist + ICC [277] examination checklist", "stem": "Which features make up thalassemic facies?", "correct": "Frontal bossing, prominent supraorbital ridges and prominent jaws", "distractors": ["Moon face, facial plethora and thin skin with purple striae", "Puffy eyelids, coarse dry skin and loss of the outer eyebrows", "Facial muscle wasting, drooping of both eyelids and frontal baldness"], "exp": "Thalassemic facies comes from marrow expansion in the skull and facial bones. The chest may also show deformity in thalassemia."}, {"topic": "Hematology history and examination (OSCE)", "source": "ICC [278] history checklist + ICC [277] examination checklist", "stem": "During the hematological examination, why are the ribs palpated for tender points?", "correct": "To look for multiple myeloma", "distractors": ["To look for iron deficiency", "To look for hemophilia", "To look for sickle cell disease"], "exp": "Bone tenderness over the ribs suggests multiple myeloma. In the history, myeloma is suggested by bony aches or pathological fractures, chronic constipation and mood changes (hypercalcemia)."}, {"topic": "Hematology history and examination (OSCE)", "source": "ICC [278] history checklist + ICC [277] examination checklist", "stem": "The lower border of the spleen cannot be felt. What is the next step in the checklist?", "correct": "Percuss Traube's area", "distractors": ["Do tidal percussion", "Test Murphy's sign", "Measure the liver span"], "exp": "If the spleen is not palpable, percuss Traube's area. If it is palpable, measure the distance from the costal margin, preferably in centimeters, and comment on the surface: a soft, tender spleen may suggest infection."}, {"topic": "Hematology history and examination (OSCE)", "source": "ICC [278] history checklist + ICC [277] examination checklist", "stem": "Which position does the checklist prefer for examining the lymph nodes?", "correct": "Sitting, with head, neck and upper chest exposed", "distractors": ["Lying flat, with the abdomen exposed from the groin", "Standing, with the arms raised above the head", "Lying on the left side, with knees bent"], "exp": "Lying flat is for the abdomen and joints. For lymph nodes the patient sits. Most head and neck groups are examined from behind; the post-auricular, occipital and posterior triangle nodes are examined from the front."}, {"topic": "Hematology history and examination (OSCE)", "source": "ICC [278] history checklist + ICC [277] examination checklist", "stem": "How many lymph node groups are examined in each axilla, and what else must be examined with them?", "correct": "5 groups (apical, medial, anterior, posterior, lateral), plus epitrochlear nodes", "distractors": ["3 groups (upper, middle, lower), plus the supraclavicular nodes on both sides", "5 groups (apical, medial, anterior, posterior, lateral), plus the popliteal nodes", "2 groups (superficial, deep), plus the inguinal nodes on both sides"], "exp": "Both axillae are examined, 5 groups each, plus epitrochlear nodes bilaterally. The student should also tell the examiner that he would like to examine the inguinal nodes."}, {"topic": "Hematology history and examination (OSCE)", "source": "ICC [278] history checklist + ICC [277] examination checklist", "stem": "When is the \"move\" step of joint examination NOT done in a patient with hemophilia?", "correct": "When prophylaxis is insufficient", "distractors": ["When the joint has old scars", "When the patient is a child", "When both knees and elbows are affected"], "exp": "Target joints are the knees and elbows. Look, feel, then move. Moving the joint is skipped in hemophilia patients who are not adequately covered by factor prophylaxis, because it may cause a bleed."}, {"topic": "Hematology history and examination (OSCE)", "source": "ICC [278] history checklist + ICC [277] examination checklist", "stem": "Why is cardiac auscultation important in a hematology examination?", "correct": "A murmur may be the first sign of endocarditis, which causes hemolysis", "distractors": ["A murmur proves the anemia is caused by bleeding from the gut", "A murmur means that leukemia has already spread to the valves of the heart", "A murmur is never related to anemia or to its possible causes"], "exp": "Murmurs can explain the anemia (bacterial endocarditis, metallic clicks of prosthetic valves causing hemolysis). Anemia itself causes a hemic murmur: a soft systolic murmur all over the precordium. Also listen to the lung bases (infiltrates and effusions in leukemia and anemic heart failure) and for a splenic rub in splenic infarction."}, {"topic": "Psychiatry in a general hospital", "source": "ICC [VM006] Introduction to psychiatry in a general hospital", "stem": "How does the lecture define psychiatry?", "correct": "The diagnosis and management of disorders of mental function", "distractors": ["The scientific study of normal behaviour and personality", "Treatment of the unconscious mind through long term talking therapy", "The study of diseases of the brain, spinal cord and nerves"], "exp": "Psychiatry is a medical specialty: the diagnosis and management of disorders of mental function. Other \"psy\" professions are psychologists, psychoanalysts and psychotherapists."}, {"topic": "Psychiatry in a general hospital", "source": "ICC [VM006] Introduction to psychiatry in a general hospital", "stem": "Which two classification systems are used for psychiatric diagnosis?", "correct": "ICD-10 and DSM-5", "distractors": ["TNM and FIGO", "NYHA and CCS", "GCS and AVPU"], "exp": "Psychiatric diagnoses are made with ICD-10 (World Health Organization) and DSM-5 (American Psychiatric Association). Major depression in DSM-5 is the equivalent of severe depression in ICD-10."}, {"topic": "Psychiatry in a general hospital", "source": "ICC [VM006] Introduction to psychiatry in a general hospital", "stem": "Psychiatric symptoms can arise in the context of medical disease in four ways. Which of these is NOT one of them?", "correct": "Psychiatric disorder protects against physical disease", "distractors": ["They are a direct result of the physical disease", "They are a psychological reaction to having the physical disease", "Psychiatric disorder presents as a physical disorder"], "exp": "The four ways: direct result of physical disease, psychological reaction to disease, psychiatric disorder leading to physical symptoms, and psychiatric disorder presenting as a physical disorder."}, {"topic": "Psychiatry in a general hospital", "source": "ICC [VM006] Introduction to psychiatry in a general hospital", "stem": "How does the point prevalence of major depression change from the community to medical inpatients?", "correct": "Community 3 to 5%, primary care 5 to 10%, medical inpatients 10 to 15%", "distractors": ["Community 10 to 15%, primary care 5 to 10%, medical inpatients 3 to 5%", "Community 1%, primary care 2%, medical inpatients 3%", "It is the same, about 5%, in all three settings"], "exp": "Depression becomes more common the closer you get to the hospital bed. Anxiety may account for up to 10% of all visits to clinicians."}, {"topic": "Psychiatry in a general hospital", "source": "ICC [VM006] Introduction to psychiatry in a general hospital", "stem": "What proportion of patients with epilepsy have mood disorders, according to this lecture?", "correct": "Up to 50 to 60%", "distractors": ["About 5%", "About 10 to 15%", "More than 90%"], "exp": "Up to 50 to 60% of patients with epilepsy have mood disorders, a reminder that psychiatric disorder is very common in chronic physical disease."}, {"topic": "Psychiatry in a general hospital", "source": "ICC [VM006] Introduction to psychiatry in a general hospital", "stem": "What does the letter T stand for in the BATHE technique?", "correct": "Trouble: what troubles you most?", "distractors": ["Treatment: what are you taking?", "Time: how long has it lasted?", "Trust: do you trust your doctors?"], "exp": "BATHE: Background, Affect, Trouble, Handling, Empathy. It is a quick, practical way to explore a patient's emotional life. The lecture also suggests problem lists and asking about psychiatric history, medications and substance misuse."}, {"topic": "Psychiatry in a general hospital", "source": "ICC [VM006] Introduction to psychiatry in a general hospital", "stem": "In BATHE, which question explores \"Affect\"?", "correct": "How do you feel about that?", "distractors": ["What is going on in your life?", "How are you handling that?", "What troubles you the most?"], "exp": "Background: what is going on. Affect: how do you feel about it. Trouble: what troubles you most. Handling: how are you handling it. Empathy: that must be very difficult for you."}, {"topic": "Psychiatry in a general hospital", "source": "ICC [VM006] Introduction to psychiatry in a general hospital", "stem": "Which cancers does the lecture list as able to PRESENT as a psychiatric disorder?", "correct": "Brain tumours, small cell lung cancer and cancer of the pancreas", "distractors": ["Basal cell carcinoma, thyroid cancer and cancer of the prostate", "Breast cancer, cervical cancer and cancer of the urinary bladder", "Osteosarcoma, testicular cancer and cancer of the larynx"], "exp": "Primary and metastatic brain tumours, small cell lung cancer and pancreatic cancer can show themselves first with psychiatric symptoms."}, {"topic": "Psychiatry in a general hospital", "source": "ICC [VM006] Introduction to psychiatry in a general hospital", "stem": "What does the lecture stress about patients with cancer of the head and neck?", "correct": "A vulnerable group with disfigurement, depression and high suicide rates", "distractors": ["A resilient group with low rates of depression and very low suicide rates", "A group in whom psychiatric symptoms are caused only by brain metastases", "A group in whom depression appears only after treatment has finished"], "exp": "They are a vulnerable and excluded group. Disfigurement and loss of function come from both the cancer and its treatment, with anxiety, depression and high suicide rates."}, {"topic": "Psychiatry in a general hospital", "source": "ICC [VM006] Introduction to psychiatry in a general hospital", "stem": "How common is depression in cardiovascular disease, and what does it predict?", "correct": "17 to 27%; it predicts increased morbidity and hastened death", "distractors": ["1 to 2%; it has no effect on the outcome of heart disease", "17 to 27%; it protects the patient against further cardiac events", "More than 80%; it predicts faster recovery after an infarct"], "exp": "Depression is linked with developing CVD and with worse outcomes. Suggested mechanisms: non-adherence, shared risk factors, platelet activity and other metabolic effects."}, {"topic": "Psychiatry in a general hospital", "source": "ICC [VM006] Introduction to psychiatry in a general hospital", "stem": "In \"how to think about patients in a psychiatric way\", what does the lecture advise the doctor to do?", "correct": "Manage your own feelings, and be good rather than perfect", "distractors": ["Leave all emotional issues to the psychiatrist on call", "Hide all feelings and keep strict distance from patients", "Aim to be perfect, since any error at all is a personal failure"], "exp": "Patients' emotional lives are not the preserve of psychiatry. Know your own drives, stay open to the patient's needs, be aware of defence mechanisms, guilt and self blame, manage feelings of anger, and be good rather than perfect."}, {"topic": "Liaison psychiatry", "source": "ICC [VM-MH016.1] Liaison psychiatry", "stem": "What proportion of general hospital patients have a mental disorder?", "correct": "More than one quarter", "distractors": ["About one in fifty", "About one in twenty", "More than nine in ten"], "exp": "More than 1/4 of hospital patients have a mental disorder. Two thirds of beds are occupied by older people, and 60% of them have or will develop a mental health condition during the stay."}, {"topic": "Liaison psychiatry", "source": "ICC [VM-MH016.1] Liaison psychiatry", "stem": "Which are the three most common mental health conditions in older hospital inpatients?", "correct": "Dementia, delirium and depression", "distractors": ["Schizophrenia, mania and anorexia", "Phobia, OCD and panic disorder", "Autism, ADHD and tic disorders"], "exp": "The \"three Ds\" in older inpatients: dementia, delirium and depression."}, {"topic": "Liaison psychiatry", "source": "ICC [VM-MH016.1] Liaison psychiatry", "stem": "Over half of depression in general hospitals goes unrecognised. Which reason does the lecture give?", "correct": "Symptoms overlap with physical illness, and distress seems \"normal\"", "distractors": ["Depressed inpatients never show changes in sleep or appetite", "Depression cannot be diagnosed without a brain scan", "Hospital policy forbids doctors from asking patients about their mood"], "exp": "Reasons for under-recognition: symptom overlap, normalisation (\"anyone would be low\"), stigma, time constraints, and the physician's omission or reluctance to ask."}, {"topic": "Liaison psychiatry", "source": "ICC [VM-MH016.1] Liaison psychiatry", "stem": "Within what time after an identifiable stressor must the symptoms of adjustment disorder begin?", "correct": "Within 1 month", "distractors": ["Within 24 hours", "Within 6 months", "Within 2 years"], "exp": "Adjustment disorder: onset within 1 month of a psychosocial stressor that is not unusual or catastrophic. Symptoms do not usually last more than 6 months after the stress ends (except a prolonged depressive reaction)."}, {"topic": "Liaison psychiatry", "source": "ICC [VM-MH016.1] Liaison psychiatry", "stem": "Which feature suggests the ONSET OF MENTAL ILLNESS rather than an adjustment reaction to physical illness?", "correct": "A persistent, extreme, disabling mood change, or suicidality", "distractors": ["Sadness in the first days after hearing the diagnosis", "Worry about the results of tests that are still pending", "Wanting family members to be present during all the consultations"], "exp": "Warning signs: persistent, extreme, disabling mood change; bizarre symptoms (psychosis, aggression); maladjustment to illness; suicidality; physical function poorer and recovery slower than expected; poor social interaction."}, {"topic": "Liaison psychiatry", "source": "ICC [VM-MH016.1] Liaison psychiatry", "stem": "Compared with the general population, how much more likely are people with TWO or more chronic physical conditions to have mental health problems?", "correct": "7 times", "distractors": ["2 times", "3 times", "20 times"], "exp": "Diabetes, hypertension and coronary disease double the rate of depression. COPD, cerebrovascular disease and other chronic conditions triple it. Two or more chronic conditions: 7 times more likely."}, {"topic": "Liaison psychiatry", "source": "ICC [VM-MH016.1] Liaison psychiatry", "stem": "About what proportion of patients have clinically significant depression after a myocardial infarction?", "correct": "About 20%", "distractors": ["About 2%", "About 50%", "About 80%"], "exp": "About 20% after MI or at diagnostic cardiac catheterization, and a similar proportion have raised depressive symptoms below the threshold. Coronary disease with depression brings more cardiac complications and more invasive procedures."}, {"topic": "Liaison psychiatry", "source": "ICC [VM-MH016.1] Liaison psychiatry", "stem": "A patient has recurrent headache, lethargy, diplopia and blurred vision, worse with exercise or fasting, and was labelled as depressed. Which diagnosis does the lecture warn about?", "correct": "Insulinoma", "distractors": ["Phaeochromocytoma", "Carcinoid tumour", "Pituitary adenoma"], "exp": "Insulinoma, one of the most common pancreatic neuroendocrine tumours, can present with neuropsychiatric symptoms and is often misdiagnosed as psychosis or depression. The clue is symptoms with fasting or exercise (hypoglycaemia)."}, {"topic": "Liaison psychiatry", "source": "ICC [VM-MH016.1] Liaison psychiatry", "stem": "What is comorbid depression in diabetes associated with?", "correct": "Poorer glycaemic control, more complications, higher death risk", "distractors": ["Better glycaemic control, because patients eat less", "Lower insulin needs and fewer clinic visits", "No change in outcome or survival once the glucose is well controlled"], "exp": "Depressive disorders occur in about 9% of people with diabetes, around twice the rate in healthy controls. Also remember needle phobia, underuse of insulin to lose weight, and insulin as a readily available means of overdose."}, {"topic": "Liaison psychiatry", "source": "ICC [VM-MH016.1] Liaison psychiatry", "stem": "A breathless, hypoxic COPD patient becomes anxious and has panic attacks. Which statement from the lecture is correct?", "correct": "Depression or anxiety affects up to 50%, and steroids can cause psychosis or depression", "distractors": ["Anxiety is rare in COPD, and steroids reliably protect these patients from depression", "Panic attacks in COPD are always caused by salbutamol, and stop as soon as it is withdrawn", "Depression in COPD has no link with breathlessness, with fatigue or with disability"], "exp": "People with COPD are 2.5 times more likely to have depression and anxiety, especially if hypoxic or severely breathless. Panic attacks and phobic avoidance of leaving home are common. Depression predicts breathlessness, fatigue and disability even after adjusting for COPD severity."}, {"topic": "Liaison psychiatry", "source": "ICC [VM-MH016.1] Liaison psychiatry", "stem": "What does the \"suffocation false alarm\" model of panic in COPD propose?", "correct": "Oversensitive brain stem chemoreceptors trigger panic", "distractors": ["Low blood calcium from overbreathing triggers panic", "Inhaled steroids act on the amygdala to trigger panic", "Fear of hospital staff is learned and triggers panic"], "exp": "It is based on the finding that lactate can produce panic attacks in about 2/3 of people who have panic attacks. Oversensitive brain stem chemoreceptors give a false alarm of suffocation. The lecture also covers a hyperventilation model and a cognitive behaviour model."}, {"topic": "Liaison psychiatry", "source": "ICC [VM-MH016.1] Liaison psychiatry", "stem": "In multiple sclerosis, which drug is MOST likely to cause drug induced low mood or mania?", "correct": "Steroids", "distractors": ["Baclofen", "Dantrolene", "Tizanidine"], "exp": "All four can do it, but steroids are the most likely. Mild to moderate mania occurs in up to 1/3 of patients given steroids, more often with a family or personal history of affective disorder or alcoholism. It is interferon ALPHA (used in viral hepatitis) that is clearly linked to depression; the link with beta interferon is controversial."}, {"topic": "Liaison psychiatry", "source": "ICC [VM-MH016.1] Liaison psychiatry", "stem": "Which statement about depression in multiple sclerosis is correct?", "correct": "Lifetime prevalence is 40 to 50%, and SSRIs have an evidence base for treatment", "distractors": ["Lifetime prevalence is below 5%, and antidepressants are contraindicated", "It is reliably predicted by the number and the site of the lesions seen on MRI", "ECT is the first choice, because it carries no risk of relapse"], "exp": "Depression in MS is about three times the general rate, with no clear link to MRI abnormalities. Suicide accounted for 15% of deaths over 16 years. ECT may be used but carries about a 20% risk of triggering an MS relapse, especially with active lesions on MRI."}, {"topic": "Liaison psychiatry", "source": "ICC [VM-MH016.1] Liaison psychiatry", "stem": "Why is the MMSE not helpful for screening cognitive impairment in multiple sclerosis?", "correct": "The deficits are subcortical, which the MMSE picks up poorly", "distractors": ["Patients with MS are unable to hold a pen to complete it", "Cognitive impairment never occurs in multiple sclerosis", "The MMSE has only been validated in patients older than 65 years"], "exp": "Cognitive impairment occurs in some (not all) patients and may come before the neurological lesions. The pattern is subcortical. Donepezil improved memory in MS in a randomised trial."}, {"topic": "Liaison psychiatry", "source": "ICC [VM-MH016.1] Liaison psychiatry", "stem": "After a stroke, a patient has severe, persistent tearfulness (emotionalism). What does the guideline recommend?", "correct": "Treat with an antidepressant and monitor how often he cries", "distractors": ["Reassure only, since it always settles within one week", "Treat with a benzodiazepine and monitor the sleep pattern", "Treat with an antipsychotic and monitor the fasting blood sugar"], "exp": "Screen for depression and anxiety within the first month after stroke. Mild to moderate depression: social interaction, exercise and psychosocial support. Persistent depressed mood: trial of antidepressant, continued for at least 4 months after initial recovery. Post-stroke major depression lasts 34 weeks on average."}, {"topic": "Liaison psychiatry", "source": "ICC [VM-MH016.1] Liaison psychiatry", "stem": "Which stroke location does the lecture link most with major depressive disorder?", "correct": "Infarcts involving the basal ganglia, especially on the left", "distractors": ["Infarcts of the occipital cortex, especially on the right", "Infarcts that are limited to the cerebellum, on either side", "Infarcts of the brain stem below the pons"], "exp": "The old view that left hemisphere lesions are depressogenic has been contested, but major depression is common with basal ganglia infarcts, especially on the left."}, {"topic": "Liaison psychiatry", "source": "ICC [VM-MH016.1] Liaison psychiatry", "stem": "In a patient with epilepsy and bipolar symptoms, why must lithium be used with caution?", "correct": "It lowers the seizure threshold and worsens seizure severity", "distractors": ["It raises the seizure threshold and so hides new seizures", "It blocks the absorption of all antiepileptic drugs from the gut", "It causes status epilepticus in every patient who takes it"], "exp": "In epilepsy: depression 30 to 50%, panic disorder 20%, depression especially in temporal lobe epilepsy. SSRIs are first line (lowering the seizure threshold is rare). Suicide risk is high, and mortality is nearly 25 times higher when clinical depression is present."}, {"topic": "Liaison psychiatry", "source": "ICC [VM-MH016.1] Liaison psychiatry", "stem": "Which statement about episodic psychosis in epilepsy is correct?", "correct": "It is most often post-ictal, and visual hallucinations are commoner than in functional psychosis", "distractors": ["It is most often pre-ictal, and hallucinations of any kind are never seen in these patients", "It is more common in generalised epilepsy than in any of the partial (focal) epilepsies", "It is best treated with clozapine, which is the one antipsychotic that raises the seizure threshold"], "exp": "Psychosis is more common in partial epilepsies. Post-ictal psychosis may have affective and confusional features. Clozapine is epileptogenic; sulpiride and haloperidol may be less so. Non-epileptic seizures are linked to past psychiatric history, somatisation and social stressors, especially childhood abuse."}, {"topic": "Liaison psychiatry", "source": "ICC [VM-MH016.1] Liaison psychiatry", "stem": "How much sooner, on average, do people with schizophrenia or bipolar disorder die than the general population?", "correct": "16 to 25 years sooner", "distractors": ["1 to 2 years sooner", "5 to 8 years sooner", "There is no difference"], "exp": "They die 16 to 25 years sooner, with more respiratory, cardiovascular and infectious disease, obesity, abnormal lipids and diabetes. Smoking is a big factor: 70% of psychiatric inpatients smoke, compared with 21% of the general population."}, {"topic": "Liaison psychiatry", "source": "ICC [VM-MH016.1] Liaison psychiatry", "stem": "Which antipsychotic carries the highest risk of diabetes and impaired glucose tolerance?", "correct": "Clozapine", "distractors": ["Haloperidol", "Aripiprazole", "Sulpiride"], "exp": "As many as 1/3 of patients may develop diabetes after 5 years of clozapine. Antipsychotic side effects in general: metabolic syndrome, extrapyramidal effects, seizures, neuroleptic malignant syndrome, weight gain, sedation, raised prolactin and QTc prolongation."}, {"topic": "Liaison psychiatry", "source": "ICC [VM-MH016.1] Liaison psychiatry", "stem": "Besides agranulocytosis, which potentially fatal risks of clozapine does the lecture list?", "correct": "Myocarditis or cardiomyopathy, pulmonary embolism, bowel obstruction", "distractors": ["Liver failure, pancreatitis and aplastic anaemia", "Stevens-Johnson syndrome, acute renal failure and haemorrhagic stroke", "Hypothyroidism, diabetes insipidus and Ebstein's anomaly"], "exp": "Fatal agranulocytosis less than 1 in 5,000; fatal myocarditis or cardiomyopathy perhaps as high as 1 in 1,000; fatal pulmonary embolism about 1 in 4,500; and potentially fatal bowel obstruction. This links to the lecture's case of the woman on clozapine admitted with small bowel obstruction."}, {"topic": "Liaison psychiatry", "source": "ICC [VM-MH016.1] Liaison psychiatry", "stem": "A patient on lithium is started on an NSAID and becomes nauseated with diarrhoea, a coarse tremor and disorientation. What is happening?", "correct": "Lithium toxicity, because NSAIDs raise lithium levels", "distractors": ["Serotonin syndrome, because NSAIDs raise serotonin", "Neuroleptic malignant syndrome, triggered by the NSAID", "An allergic reaction to the NSAID tablet coating"], "exp": "NSAIDs, ACE inhibitors, angiotensin II blockers and diuretics all risk lithium toxicity. Toxic level: above 1.5 mmol/L. Features: nausea, diarrhoea, coarse tremor, disorientation, seizures, coma, death. Treatment is dialysis (peritoneal or haemodialysis)."}, {"topic": "Liaison psychiatry", "source": "ICC [VM-MH016.1] Liaison psychiatry", "stem": "Which is a recognised long term adverse effect of lithium?", "correct": "Hypothyroidism", "distractors": ["Hyperthyroidism", "Agranulocytosis", "Hyperprolactinaemia"], "exp": "Lithium: polyuria and polydipsia, hypothyroidism, impaired renal function, cardiac conduction problems, and teratogenicity (Ebstein's anomaly and other cardiac defects)."}, {"topic": "Liaison psychiatry", "source": "ICC [VM-MH016.1] Liaison psychiatry", "stem": "How do SSRIs increase the risk of bleeding?", "correct": "They block serotonin uptake into platelets, impairing aggregation", "distractors": ["They block vitamin K in the liver, which lowers clotting factors", "They destroy platelets in the spleen, which lowers the platelet count", "They thin the stomach lining directly, as NSAIDs do"], "exp": "Platelets release serotonin at a vascular injury to promote vasoconstriction and aggregation. SSRIs block the transporter that loads serotonin into platelets. GI bleeding risk rises further with aspirin or NSAIDs, in the elderly and with a past GI bleed. With warfarin, the risk of a non-GI bleed rises."}, {"topic": "Liaison psychiatry", "source": "ICC [VM-MH016.1] Liaison psychiatry", "stem": "True or false quiz from the lecture: what proportion of people with mental illness are in treatment?", "correct": "Only one quarter", "distractors": ["About one half", "About three quarters", "Almost all"], "exp": "From the lecture's quiz: among those under 65, nearly half of all ill health is mental illness; a person with depression is at least 50% more disabled than someone with angina, arthritis, asthma or diabetes; only 1/4 are in treatment; and people aged 18 to 74 with serious mental illness have a mortality rate 3 times higher than the general population."}, {"topic": "Psychopharmacology", "source": "ICC-FCP [VM-UM026.1] Psychopharmacology", "stem": "What is the shared mechanism behind the efficacy of all antipsychotics?", "correct": "Dopamine D2 blockade in the mesolimbic pathway", "distractors": ["Serotonin reuptake inhibition in the raphe nuclei", "GABA-A receptor activation in the cortex", "Noradrenaline release in the locus coeruleus"], "exp": "All antipsychotics show some D2 antagonism in the mesolimbic area, and this is what gives their effect on psychosis."}, {"topic": "Psychopharmacology", "source": "ICC-FCP [VM-UM026.1] Psychopharmacology", "stem": "Why do first generation antipsychotics cause extrapyramidal side effects?", "correct": "They block D2 receptors in the nigrostriatal pathway", "distractors": ["They block D2 receptors in the mesolimbic pathway", "They block 5HT2A receptors in the prefrontal cortex area", "They block H1 receptors in the hypothalamus"], "exp": "D2 blockade in the mesolimbic pathway treats psychosis; the same blockade in the nigrostriatal pathway gives extrapyramidal effects. In the pituitary pathway it raises prolactin (impotence, amenorrhoea). Weight gain is an antihistaminic effect."}, {"topic": "Psychopharmacology", "source": "ICC-FCP [VM-UM026.1] Psychopharmacology", "stem": "Which drug is a third generation antipsychotic, and how does it act?", "correct": "Aripiprazole, a dopamine partial agonist", "distractors": ["Haloperidol, a pure dopamine antagonist", "Olanzapine, a 5HT2A and D2 antagonist", "Clozapine, a dopamine reuptake inhibitor"], "exp": "First generation (haloperidol, trifluoperazine): D2 antagonists. Second generation (clozapine, olanzapine, quetiapine, risperidone): 5HT2A and D2 antagonists with fewer extrapyramidal but more metabolic effects. Third generation (aripiprazole, brexpiprazole, cariprazine, lumateperone): dopamine partial agonists."}, {"topic": "Psychopharmacology", "source": "ICC-FCP [VM-UM026.1] Psychopharmacology", "stem": "A patient with newly diagnosed schizophrenia asks to wait a few months before starting medication. What does the lecture say?", "correct": "Do not delay: delay worsens the negative symptoms", "distractors": ["Delay is safe: negative symptoms respond better later", "Delay is advised: start only after a second episode", "Delay is required: psychotherapy must be tried first"], "exp": "Once psychosis is diagnosed, start antipsychotic medication. Treatment is more than drugs: individual care plans include psychosocial interventions and family support."}, {"topic": "Psychopharmacology", "source": "ICC-FCP [VM-UM026.1] Psychopharmacology", "stem": "A patient with schizophrenia keeps forgetting his oral antipsychotic, and the dose is already established. Which option helps most?", "correct": "Switch to a depot injection", "distractors": ["Double the oral dose", "Add a benzodiazepine at night", "Stop all medication"], "exp": "When concordance is a problem, depot medication is more useful than oral medication once the dose has been established."}, {"topic": "Psychopharmacology", "source": "ICC-FCP [VM-UM026.1] Psychopharmacology", "stem": "A young man on haloperidol has an increasing fever with no clear cause, muscle rigidity, tachycardia and a CPK above 1,000. What is the diagnosis?", "correct": "Neuroleptic malignant syndrome", "distractors": ["Acute dystonic reaction", "Tardive dyskinesia", "Akathisia"], "exp": "Neuroleptic malignant syndrome is an emergency: fever, rigidity, tachycardia and CPK above 1,000 units."}, {"topic": "Psychopharmacology", "source": "ICC-FCP [VM-UM026.1] Psychopharmacology", "stem": "After prolonged treatment with a typical antipsychotic, a patient develops involuntary movements of the face, mouth and tongue. What is this?", "correct": "Tardive dyskinesia", "distractors": ["Acute dystonic reaction", "Akathisia", "Parkinsonism"], "exp": "Tardive dyskinesia appears after prolonged use. Acute dystonia is a severe spastic contraction of a muscle group (emergency). Akathisia is a subjective muscle discomfort that makes the patient restless (emergency). Parkinsonism is rigidity, bradykinesia and tremor."}, {"topic": "Psychopharmacology", "source": "ICC-FCP [VM-UM026.1] Psychopharmacology", "stem": "Which serious blood side effect needs monitoring in a patient on clozapine?", "correct": "Agranulocytosis", "distractors": ["Macrocytic anaemia", "Thrombocytosis", "Secondary polycythaemia"], "exp": "With newer drugs the main reported problems are weight gain, sexual dysfunction (raised prolactin), postural hypotension from alpha-1 blockade especially in the first 3 months, long QTc, daytime drowsiness, and with clozapine myocarditis, cardiomyopathy and agranulocytosis."}, {"topic": "Psychopharmacology", "source": "ICC-FCP [VM-UM026.1] Psychopharmacology", "stem": "How long do antidepressants take to reach full efficacy, and when should the first formal assessment be?", "correct": "Full efficacy at about 6 weeks; assess formally after 4 weeks", "distractors": ["Full efficacy at about 6 days; assess formally after 2 days", "Full efficacy at about 6 months; assess formally after 3 months", "Full efficacy at once; assess formally the next day"], "exp": "Warn the patient that symptoms may get worse in the first weeks, and monitor closely for increased suicidality during that time."}, {"topic": "Psychopharmacology", "source": "ICC-FCP [VM-UM026.1] Psychopharmacology", "stem": "A patient has fully recovered from depression on an SSRI. How long should it be continued?", "correct": "At least 6 months after recovery, or 50% will relapse", "distractors": ["It can stop the day the mood returns to normal", "Exactly 2 weeks after recovery; then stop suddenly", "For life in every patient, because stopping is never safe"], "exp": "If the drug is effective, continue for at least six months after recovery. If it is stopped too soon, 50% of patients relapse."}, {"topic": "Psychopharmacology", "source": "ICC-FCP [VM-UM026.1] Psychopharmacology", "stem": "After 4 weeks on an adequate dose of an SSRI there is NO response. What is the next step?", "correct": "Switch to a different class of antidepressant", "distractors": ["Keep raising the dose of the same drug every week", "Add a second SSRI to the first", "Stop all drugs and offer only reassurance"], "exp": "No response or poor tolerability at 4 weeks: switch class. Do not keep increasing the dose, because there is little evidence for a dose response. If there is a minor response, the dose can be titrated up. Switching is better than augmenting."}, {"topic": "Psychopharmacology", "source": "ICC-FCP [VM-UM026.1] Psychopharmacology", "stem": "Which statement about CBT (cognitive behavioural therapy) in depression is correct?", "correct": "As effective as antidepressants in mild to moderate depression, and the combination is better than either alone", "distractors": ["Less effective than placebo in mild depression, and it must never be combined with any form of drug treatment", "Only useful in severe psychotic depression, and only after ECT has been tried and has failed", "Effective only in children, with no role in adults who are able to take antidepressant tablets"], "exp": "Discuss both drug and non-drug treatment with the patient. Medication is one of a range of therapeutic interventions."}, {"topic": "Psychopharmacology", "source": "ICC-FCP [VM-UM026.1] Psychopharmacology", "stem": "Which SSRI does the lecture call the best choice in ischaemic heart disease?", "correct": "Sertraline", "distractors": ["Citalopram", "Fluoxetine", "Escitalopram"], "exp": "SSRIs are first line. Fluoxetine, citalopram or escitalopram, and sertraline are all good choices; sertraline is best in IHD. Citalopram causes dose dependent QTc prolongation, so check the ECG (risk of torsades de pointes)."}, {"topic": "Psychopharmacology", "source": "ICC-FCP [VM-UM026.1] Psychopharmacology", "stem": "Which blood tests should be monitored in any patient on an SSRI?", "correct": "Full blood count, urea and electrolytes", "distractors": ["Thyroid function and serum calcium", "Liver function tests and serum amylase", "Blood glucose and lipid profile"], "exp": "FBC looks for anaemia from GI bleeding (avoid NSAIDs at the same time). U&E looks for hyponatraemia."}, {"topic": "Psychopharmacology", "source": "ICC-FCP [VM-UM026.1] Psychopharmacology", "stem": "Which antidepressant is a NaSSA that causes drowsiness at low doses, so it helps sleep when given in the evening?", "correct": "Mirtazapine", "distractors": ["Venlafaxine", "Moclobemide", "Nortriptyline"], "exp": "Mirtazapine is a noradrenergic and specific serotonergic antidepressant. Venlafaxine is an SNRI, more effective with mixed anxiety, and needs a baseline BP and ECG. Tricyclics (nortriptyline, clomipramine) and MAOIs (moclobemide) are older drugs used at fourth line."}, {"topic": "Psychopharmacology", "source": "ICC-FCP [VM-UM026.1] Psychopharmacology", "stem": "Which mood stabiliser is first line for bipolar disorder with a mixed state or rapid cycling?", "correct": "Sodium valproate", "distractors": ["Lamotrigine", "Carbamazepine", "Buspirone"], "exp": "Valproate blocks voltage sensitive sodium channels and raises brain GABA. It is not usually prescribed to women of childbearing age (spina bifida, heart defects, cleft lip). Side effects: sedation, tremor, headache, weight gain, lipid changes and alopecia."}, {"topic": "Psychopharmacology", "source": "ICC-FCP [VM-UM026.1] Psychopharmacology", "stem": "Which mood stabiliser is more effective for the DEPRESSIVE episodes of bipolar disorder, and what is its serious warning?", "correct": "Lamotrigine; life threatening skin reactions such as Stevens-Johnson syndrome", "distractors": ["Lithium; life threatening liver failure in the first week of treatment", "Carbamazepine; life threatening kidney stones and renal failure in the first year", "Valproate; life threatening weight loss and hyperthyroidism"], "exp": "Lamotrigine is a voltage gated sodium channel antagonist that reduces glutamate release. Nearly all skin reactions appear in the first 2 to 8 weeks, or if the drug is stopped suddenly and then restarted at the full dose."}, {"topic": "Psychopharmacology", "source": "ICC-FCP [VM-UM026.1] Psychopharmacology", "stem": "A woman on carbamazepine becomes pregnant while taking the oral contraceptive pill. What explains this?", "correct": "It induces hepatic P450 enzymes, which lowers the pill's effect", "distractors": ["It inhibits hepatic P450 enzymes, which blocks the pill's effect", "It binds the pill in the gut and stops it from being absorbed", "It raises fertility by lowering the level of prolactin"], "exp": "Enzyme induction also reduces the effect of warfarin. Other carbamazepine side effects: GI upset, sedation, ataxia and severe bone marrow depression. Its efficacy in bipolar disorder is less than lithium."}, {"topic": "Psychopharmacology", "source": "ICC-FCP [VM-UM026.1] Psychopharmacology", "stem": "How quickly does lithium start to work in acute mania, and what is used in the meantime?", "correct": "A week or more; antipsychotics or sedatives are used first", "distractors": ["It works within one hour; nothing else is ever needed", "It takes about six months; a course of ECT is always used first", "It works within a day; antidepressants are added first"], "exp": "Valproate and the antipsychotics olanzapine and aripiprazole may control mania faster. Only 1/3 of bipolar patients get adequate relief with monotherapy. Patients on lithium must avoid dehydration, which concentrates lithium and causes toxicity."}, {"topic": "Psychopharmacology", "source": "ICC-FCP [VM-UM026.1] Psychopharmacology", "stem": "A student has tremor and sweating when giving presentations. What does propranolol do for her?", "correct": "It improves the somatic symptoms but not the cognitive anxiety", "distractors": ["It improves the cognitive anxiety but not the somatic symptoms", "It removes both the cognitive anxiety and the somatic symptoms", "It has no effect on anxiety and is used only for blood pressure"], "exp": "Beta blockers reduce tremulousness and sweating, which is useful for public speaking, but the person still feels anxious and simply does not look it."}, {"topic": "Psychopharmacology", "source": "ICC-FCP [VM-UM026.1] Psychopharmacology", "stem": "Which statement about buspirone is correct?", "correct": "A 5-HT1A agonist that is not sedating and can take up to 4 weeks to work", "distractors": ["A GABA receptor agonist that is sedating and works within 30 minutes", "A beta blocker that is the first choice for sudden panic attacks", "A dopamine antagonist that causes dependence and tolerance within a few days"], "exp": "Buspirone is mainly used for generalised anxiety disorder. It is not a GABA agonist, is better tolerated because it is not sedating, and is not suited to quick relief, short term anxiety or panic disorder."}, {"topic": "Psychopharmacology", "source": "ICC-FCP [VM-UM026.1] Psychopharmacology", "stem": "Which statement about benzodiazepines is correct?", "correct": "They cause somnolence, amnesia and disinhibition, and are best used sparingly for acute distress", "distractors": ["They are the long term treatment of choice for anxiety disorders, because tolerance never develops", "They have no risk of dependence, so they can be stopped suddenly at any time", "They improve memory and alertness, so they are given in the morning"], "exp": "Patients become dependent and tolerant, which makes them hard to stop. They are not a long term solution. In anxiety disorders, anxiolytics are often combined with SSRIs or SNRIs."}, {"topic": "Psychopharmacology", "source": "ICC-FCP [VM-UM026.1] Psychopharmacology", "stem": "A patient on psychiatric medication is not improving. After reviewing the dose, tolerance and interactions, what else does the lecture tell you to do?", "correct": "Rethink the diagnosis, and check the drug is really being taken", "distractors": ["Add two more drugs of the same class at the same visit", "Discharge the patient as resistant to all treatment", "Tell the patient that the drug is working, and wait for another year"], "exp": "Patients refuse medication because they think the side effects are worse than the disease, because of stigma, because it reminds them of being ill, or because they believe it does not work. Encourage them to ask about the name, purpose, side effects, timing, missed doses, stopping and interactions, and be ready to answer."}];
const KEY = "hesham_y3_w00C_best";
const $ = id => document.getElementById(id);
const topics = [...new Set(BANK.map(q => q.topic))];
let mode = "practice", count = 0, set = [], idx = 0, answers = [], tick = null, left = 0;

function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function esc(s){return s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]))}
function best(){try{return JSON.parse(localStorage.getItem(KEY))||{}}catch(e){return {}}}
function saveBest(b){try{localStorage.setItem(KEY,JSON.stringify(b))}catch(e){}}
function show(id){["start","quiz","done"].forEach(s=>$(s).classList.toggle("hidden",s!==id));window.scrollTo(0,0)}

function drawStart(){
  const b = best();
  $("topics").innerHTML = topics.map((t,i)=>{
    const n = BANK.filter(q=>q.topic===t).length;
    const last = b[t]!=null ? "best "+b[t]+"%" : "not tried yet";
    return `<label class="topic"><input type="checkbox" value="${i}" checked><span class="name">${esc(t)}</span><span class="meta">${n} questions, ${last}</span></label>`;
  }).join("");
  setNote();
}
function setNote(){
  $("modeNote").textContent = mode==="practice"
    ? "Practice: you see the right answer and the explanation after each question."
    : "Exam: timed at 72 seconds per question, like the real paper. Answers and explanations come at the end.";
}
function pick(group, btn, attr){[...$(group).children].forEach(b=>b.setAttribute("aria-pressed", b===btn));return btn.dataset[attr]}
$("count").onclick = e => {if(e.target.tagName==="BUTTON") count = +pick("count", e.target, "n")};
$("mode").onclick = e => {if(e.target.tagName==="BUTTON"){mode = pick("mode", e.target, "m"); setNote()}};

function begin(pool){
  set = pool.map(q => ({q, opts: shuffle([q.correct, ...q.distractors])}));
  idx = 0; answers = new Array(set.length).fill(null);
  $("qt").textContent = set.length;
  $("strip").innerHTML = set.map(()=>"<i></i>").join("");
  clearInterval(tick);
  if(mode==="exam"){
    left = set.length*72; $("timer").classList.remove("hidden"); paintTimer();
    tick = setInterval(()=>{left--; paintTimer(); if(left<=0) finish()},1000);
  } else $("timer").classList.add("hidden");
  show("quiz"); drawQ();
}
function paintTimer(){const m=Math.floor(left/60),s=left%60;$("timer").textContent=m+":"+String(s).padStart(2,"0");$("timer").classList.toggle("low",left<60)}

$("go").onclick = () => {
  const chosen = [...document.querySelectorAll("#topics input:checked")].map(i=>topics[+i.value]);
  if(!chosen.length){alert("Pick at least one lecture.");return}
  let pool = shuffle(BANK.filter(q=>chosen.includes(q.topic)));
  if(count && count<pool.length) pool = pool.slice(0,count);
  begin(pool);
};

function drawQ(){
  const {q,opts} = set[idx]; let sel = null, locked = false;
  $("qn").textContent = idx+1; $("qtag").textContent = q.topic; $("stem").textContent = q.stem; $("exp").innerHTML = "";
  [...$("strip").children].forEach((el,i)=>{
    const a = answers[i];
    el.className = i===idx ? "now" : a==null ? "" : mode==="exam" ? "done" : (a===set[i].q.correct ? "ok" : "no");
  });
  const nx = $("next"); nx.disabled = true;
  nx.textContent = mode==="practice" ? "Check answer" : (idx===set.length-1 ? "Finish exam" : "Next question");
  $("opts").innerHTML = opts.map((o,i)=>`<button class="opt" data-i="${i}"><span class="k">${"ABCDE"[i]}</span><span>${esc(o)}</span></button>`).join("");
  const btns = [...$("opts").children];
  btns.forEach(b => b.onclick = () => {
    if(locked) return; sel = opts[+b.dataset.i];
    btns.forEach(x=>x.classList.toggle("sel",x===b)); nx.disabled = false;
  });
  nx.onclick = () => {
    if(mode==="practice" && !locked){
      locked = true; answers[idx] = sel; const ok = sel===q.correct;
      btns.forEach(b=>{const o=opts[+b.dataset.i]; b.disabled=true; b.classList.remove("sel");
        if(o===q.correct) b.classList.add("right"); else if(o===sel) b.classList.add("bad")});
      $("exp").innerHTML = `<div class="exp ${ok?"":"no"}"><b class="verdict">${ok?"Correct.":"Not this time."}</b>${esc(q.exp)}<span class="src">From: ${esc(q.source)}</span></div>`;
      $("strip").children[idx].className = ok?"ok":"no";
      nx.textContent = idx===set.length-1 ? "See my result" : "Next question";
      return;
    }
    if(mode==="exam") answers[idx] = sel;
    if(idx===set.length-1) finish(); else {idx++; drawQ(); window.scrollTo(0,0)}
  };
}
$("quit").onclick = () => {if(confirm("End the quiz now and see your result?")) finish()};

function finish(){
  clearInterval(tick);
  const total = set.length, right = set.filter((s,i)=>answers[i]===s.q.correct).length;
  const pct = Math.round(100*right/total);
  $("score").textContent = right+" / "+total;
  $("scoreNote").textContent = pct+"%. " + (pct>=85 ? "Strong. Keep these lectures warm with a short retry next week."
    : pct>=65 ? "Good base. Go through the review list below, then retry the missed ones."
    : "Read the high yield sheet for the weak lectures first, then come back.");
  const b = best();
  $("byTopic").innerHTML = topics.filter(t=>set.some(s=>s.q.topic===t)).map(t=>{
    const items = set.map((s,i)=>[s,i]).filter(([s])=>s.q.topic===t);
    const r = items.filter(([s,i])=>answers[i]===s.q.correct).length, p = Math.round(100*r/items.length);
    if(items.length>=5 && (b[t]==null || p>b[t])) b[t]=p;
    return `<div class="row"><span>${esc(t)}</span><strong>${r} / ${items.length}</strong><div class="track"><span class="${p<65?"weak":""}" style="width:${p}%"></span></div></div>`;
  }).join("");
  saveBest(b);
  const missed = set.map((s,i)=>[s,i]).filter(([s,i])=>answers[i]!==s.q.correct);
  $("retry").classList.toggle("hidden", !missed.length);
  $("revTitle").textContent = missed.length ? "Questions to review ("+missed.length+")" : "Nothing to review. All correct.";
  $("reviews").innerHTML = missed.map(([s,i])=>`<div class="review"><span class="tag">${esc(s.q.topic)}</span>
    <div class="stem">${esc(s.q.stem)}</div>
    <p class="you">${answers[i]==null?"You left this one blank.":"You chose: "+esc(answers[i])}</p>
    <p class="ans">Answer: ${esc(s.q.correct)}</p><p>${esc(s.q.exp)}</p></div>`).join("");
  $("retry").onclick = () => {mode="practice"; begin(shuffle(missed.map(([s])=>s.q)))};
  show("done");
}
$("home").onclick = () => {[...$("mode").children].forEach(b=>b.setAttribute("aria-pressed", b.dataset.m===mode)); drawStart(); show("start")};
drawStart();
</script>
